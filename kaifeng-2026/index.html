<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>古都走廊 · 开封</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;700&family=Patrick+Hand&family=Courier+Prime&family=Long+Cang&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&family=Long+Cang&family=Noto+Serif+SC:wght@600&display=swap">
<style>
@font-face{font-family:"WenKai";src:url(wenkai.woff2) format("woff2");font-display:swap}
/* Layout: one big hand-drawn day map (three colored routes, pan/zoom) → a stack of journal spreads, one per stop, in the white-paper scrapbook style. */
:root{
  --desk:#1d1a17; --paper:#fbfaf6; --ink:#24211e; --ink-soft:#6b635a;
  --m:#2f7fb0; --a:#c4554b; --n:#6a4c9c; --food:#d9822b;
  --mark:#f6e48a; --green:#3d7a4a; --yellow:#e6b93a; --kraft:#6d4d3a; --cream:#f5edda;
  --f-hand:"WenKai","Kaiti SC","KaiTi",cursive;
  --f-enhand:"Patrick Hand","Comic Sans MS",cursive;
  --f-map:"Architects Daughter","Caveat",cursive;
  --f-ui:"Zen Maru Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  --f-type:"Courier Prime","Courier New",monospace;
  --f-serif:"Shippori Mincho B1","Songti SC",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--cream);font-family:var(--f-ui);padding:18px 16px 70px;
  background-image:radial-gradient(ellipse at 50% 0%,#2b2621 0%,#1d1a17 55%,#151311 100%)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto}
html[lang="en"] .hand{font-family:var(--f-enhand);font-size:1.2em;line-height:1.5}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand .badge{width:50px;height:50px;border-radius:50%;background:var(--a);color:var(--cream);display:grid;place-items:center;font-family:var(--f-serif);font-weight:800;font-size:20px;box-shadow:0 0 0 3px var(--desk),0 0 0 5px var(--a)}
.brand h1{margin:0;font-weight:900;font-size:clamp(22px,4vw,34px);letter-spacing:.1em;line-height:1.1}
.brand p{margin:3px 0 0;font-family:var(--f-map);font-size:13px;letter-spacing:.14em;color:#b7ab95}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.days{display:flex;gap:6px}
.days button,.days a{border:1.5px solid #6b6155;background:none;padding:5px 11px;font-family:var(--f-map);font-size:15px;color:#b7ab95;text-decoration:none}.days a:hover{border-color:var(--yellow);color:var(--yellow)}
.days button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.days button[disabled]{opacity:.4;cursor:not-allowed}
.homelink{border:1.5px solid #6b6155;padding:5px 11px;font-family:var(--f-map);font-size:15px;color:#b7ab95;text-decoration:none;white-space:nowrap}.homelink:hover{border-color:var(--yellow);color:var(--yellow)}
.lang{display:flex;border:1.5px solid var(--cream);border-radius:20px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 12px;font-size:13px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}

/* ---------- map sheet ---------- */
.sheet{background:#efeee9;color:var(--ink);border-radius:3px;padding:16px clamp(10px,2vw,22px) 18px;box-shadow:0 28px 60px #000a;position:relative;
  background-image:linear-gradient(90deg,#0000 49.7%,#0000000c 50%,#ffffff60 50.2%,#0000 50.6%),linear-gradient(180deg,#0000 49.7%,#0000000a 50%,#ffffff50 50.2%,#0000 50.6%)}
.sheethead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 18px;margin-bottom:10px}
.sheethead h2{margin:0;font-family:var(--f-map);font-weight:400;font-size:clamp(24px,3.4vw,36px);letter-spacing:.03em;line-height:1}
.sheethead h2 small{display:block;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--ink-soft);margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:26px;height:5px;border-radius:3px}
.legend b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;color:#fff;font-size:10px;font-family:var(--f-map)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:2px solid var(--ink);background:#fff;padding:4px 12px;border-radius:18px;font-size:13px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.m{border-color:var(--m)}.chip.a{border-color:var(--a)}.chip.n{border-color:var(--n)}
.chip.m[aria-pressed="true"]{background:var(--m)}.chip.a[aria-pressed="true"]{background:var(--a)}.chip.n[aria-pressed="true"]{background:var(--n)}
.mapbox{position:relative;border:2px solid #8e897f;background:#e6e5df;overflow:hidden;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.mapbox svg{display:block;width:100%;height:auto;cursor:grab}
.mapbox svg:active{cursor:grabbing}
.zoombtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombtns button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:20px;font-weight:900;line-height:1}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--ink-soft)}
.pin{cursor:pointer}
.pin:focus{outline:none}
#map .deco{transition:opacity .35s}
.pin:focus .ring,.pin:hover .ring{stroke:var(--yellow);stroke-width:5}

/* ---------- spreads ---------- */
.book{margin-top:44px;display:flex;flex-direction:column;gap:46px}
.spread{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:3px;box-shadow:0 26px 60px #000a;position:relative;scroll-margin-top:16px;color:var(--ink)}
.spread::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:60px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,#0000,#00000010 40%,#00000028 50%,#00000010 60%,#0000)}
.pg{position:relative;min-width:0;padding:26px 38px 34px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.pghead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-map);font-size:19px}
.pghead .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:900;font-size:15px;letter-spacing:.06em}
.pghead .tag b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-family:var(--f-map);font-size:14px}
.notes{background:#fff;border:1px solid #d9d4c8;padding:10px 14px 12px;position:relative;font-family:var(--f-hand);font-size:16.5px;line-height:1.7;color:#3a3530;max-width:36em;box-shadow:2px 2px 0 #0000000d;z-index:2}
.notes::before{content:attr(data-tag);position:absolute;top:-10px;left:12px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.14em;padding:1px 8px}
html[lang="en"] .notes{font-family:var(--f-enhand);font-size:17.5px;line-height:1.5}
.hand{font-family:var(--f-hand);font-size:21px;line-height:1.62;margin:0;max-width:34em;position:relative;z-index:2}
.feelwrap{position:relative;z-index:2}
.deco-st{display:block;max-width:280px;transform:rotate(var(--r));filter:drop-shadow(0 3px 5px #0003);position:relative;z-index:4;pointer-events:none}
@media (max-width:760px){.deco-st{max-width:170px}}
.deco-wrap{position:relative;z-index:4;max-width:230px;shape-image-threshold:.35;shape-margin:8px;transform:rotate(var(--r));filter:drop-shadow(0 3px 5px #0003);pointer-events:none}
.deco-wrap.right{float:right;margin:0 -6px 4px 10px}.deco-wrap.left{float:left;margin:0 10px 4px -6px}
[data-wrap]{display:flow-root}
@media (max-width:760px){.deco-wrap{max-width:150px}}

.callout{position:relative;align-self:center;margin:8px 0 18px;padding:16px 26px;background:#fff;border:2px solid var(--ink);border-radius:26px;transform:rotate(-2deg);box-shadow:4px 4px 0 #24211e22;max-width:88%}
.callout::after{content:"";position:absolute;left:38px;bottom:-14px;width:22px;height:22px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.callout p{margin:0;font-family:var(--f-hand);font-size:24px;line-height:1.4;color:var(--a)}
html[lang="en"] .callout p{font-family:var(--f-enhand);font-size:26px}
.vcredit{margin:-6px 0 0;font-size:11px;color:#9a8f84;text-align:right}
.vwide{grid-column:1/-1;margin:0;padding:6px 38px 34px;position:relative;z-index:30;background:var(--paper)}.vwide img{display:block;width:100%;height:auto;border:8px solid #fff;box-shadow:0 6px 16px #0003}.vwide figcaption{font-family:var(--f-hand);font-size:16px;color:#2f3f63;margin-top:8px}.vwide figcaption small{display:block;font-family:var(--f-ui);font-size:11px;color:#9a8f84;margin-top:2px}@media (max-width:760px){.vwide{padding:6px 12px 24px}}
.vtag b{background:#34405a;box-shadow:0 0 0 3px #c9d3e6}
.vwrap .hand{color:#2f3f63}
.vwrap .hand+.hand{margin-top:.55em}
.vli{padding-left:1.1em;text-indent:-1.1em}.vli:not(.vnum)::before{content:"· "}.vnum{padding-left:1.35em;text-indent:-1.35em}
.vwrap .vli+.vli{margin-top:.3em}
.lettersp::before,.lettersp::after{display:none!important}.lettersp{grid-template-columns:1fr;background:transparent;box-shadow:none;padding:6px 0}.lettersp+.lettersp .letter{transform:rotate(.5deg)}
.letter{--blue:#34405a;position:relative;max-width:760px;margin:0 auto;background:#efe4cc;background-image:radial-gradient(#0000 60%,#b8955a22),linear-gradient(#ffffff18,#ffffff18);padding:34px 48px 34px;box-shadow:0 18px 40px #0008,inset 0 0 0 1px #d9c8a4;border-radius:2px;transform:rotate(-.6deg);color:var(--blue)}
.letter::before{content:"";position:absolute;inset:12px;border:1px solid #c8b38a;pointer-events:none}
.letter::after{content:"";position:absolute;top:-12px;left:50%;width:110px;height:26px;transform:translateX(-50%) rotate(2deg);background:#d7c8a6cc}
.ltag{font-family:var(--f-map);font-size:14px;letter-spacing:.08em;color:#8a6a3a;border-bottom:1.5px solid #8a6a3a;display:inline-block;margin-bottom:12px}
.lt{font-family:var(--f-hand);font-size:20px;line-height:1.75;margin:0;color:var(--blue)}
.lt+.lt{margin-top:.5em}
.lt.li{padding-left:1.2em;text-indent:-1.2em}.lt.li:not(.num)::before{content:"· ";}.lt.num{padding-left:1.4em;text-indent:-1.4em}
.lt.li+.lt.li{margin-top:.25em}
html[lang="en"] .lt{font-family:var(--f-enhand);font-size:23px;line-height:1.5}
@media (max-width:760px){.letter{padding:26px 22px;transform:none}.lt{font-size:18px}html[lang="en"] .lt{font-size:21px}}

.feelwrap .ft{font-family:var(--f-map);font-size:14px;color:var(--a);letter-spacing:.06em}
mark{background:linear-gradient(100deg,#0000 1%,var(--mark) 3%,var(--mark) 97%,#0000 99%) no-repeat 0 60%/100% 72%;color:inherit;padding:0 .1em}
.row{display:grid;gap:6px;position:relative;z-index:1}
.row figure,.wall figure{margin:0;overflow:hidden;position:relative;background:#ddd}
.row figure{aspect-ratio:var(--ar,4/3)}
.row img{object-position:center 30%}
.row img,.wall img{width:100%;height:100%;object-fit:cover;display:block}
.photo{margin:0;align-self:center;width:88%;background:#fff;padding:8px;box-shadow:0 6px 16px #0003;position:relative;z-index:1}
.photo img{display:block;width:100%;max-height:420px;object-fit:cover}
.pcap{font-family:var(--f-hand);font-size:15px;color:#4a4038;padding:8px 2px 0;line-height:1.45}.credit{position:absolute;right:14px;top:14px;background:#fffdf7e6;color:#5a4f45;font-family:var(--f-enhand);font-size:13px;padding:1px 7px;border-radius:3px;transform:rotate(1.5deg);box-shadow:0 1px 3px #0002}.pcap small{display:block;font-family:var(--f-ui,sans-serif);font-size:10.5px;color:#9a8f84;margin-top:2px}
.wall{display:grid;gap:5px}
.wall figure{aspect-ratio:1}
.wall figcaption,.row figcaption{position:absolute;left:5px;right:5px;bottom:3px;font-family:var(--f-hand);font-size:15px;color:#fff;text-shadow:0 1px 3px #000d;line-height:1.2}
html[lang="en"] .wall figcaption{font-family:var(--f-enhand);font-size:17px}
.pghead{position:relative;z-index:6}
.cut{position:absolute;z-index:4;filter:drop-shadow(0 4px 6px #0003);pointer-events:none;transform:rotate(var(--r,0deg))}
.sketch{width:70%;align-self:flex-end;opacity:.9;mix-blend-mode:multiply}
.big{font-family:var(--f-serif);font-weight:800;font-size:clamp(48px,7vw,86px);line-height:.9;color:var(--green);letter-spacing:.01em;margin-top:auto}
/* station sign */
.ekimei{align-self:flex-start;width:min(300px,78%);background:#fff;border:1.5px solid var(--ink);box-shadow:3px 3px 0 #0000001c;position:relative;z-index:2;transform:rotate(-1.5deg)}
.em-main{text-align:center;padding:8px 10px 4px}
.em-main small{display:block;font-size:13px;letter-spacing:.4em;color:#555}
.em-main b{display:block;font-size:40px;font-weight:900;letter-spacing:.2em;line-height:1.1}
.em-main i{display:block;font-style:normal;font-family:var(--f-map);font-size:15px;letter-spacing:.1em}
.em-num{position:absolute;left:10px;top:12px;width:44px;height:44px;border:4px solid var(--line);border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:16px;line-height:.9;text-align:center}
.em-num span{display:block;font-size:11px}
.em-bar{display:flex;justify-content:space-between;gap:6px;background:var(--line);color:#fff;font-size:10.5px;padding:3px 8px;font-weight:700}
.ekimei.metro{--line:#9a9a92}.ekimei.metro .em-num{border-radius:50%}
.ekimei.jr{--line:#80c241}
.label{align-self:flex-start;background:var(--kraft);color:var(--cream);font-family:var(--f-serif);font-weight:800;font-size:26px;letter-spacing:.12em;padding:8px 16px;line-height:1.15;transform:rotate(-1deg);box-shadow:3px 3px 0 #0000001c;position:relative;z-index:2}
.label small{display:block;font-family:var(--f-map);font-weight:400;font-size:12px;letter-spacing:.14em}
.stamp{align-self:flex-start;width:122px;height:122px;border-radius:50%;border:3px solid #c0453d;color:#c0453d;display:grid;place-items:center;text-align:center;transform:rotate(-10deg);mix-blend-mode:multiply;position:relative;z-index:2}
.stamp::before{content:"";position:absolute;inset:6px;border:1.5px solid #c0453d;border-radius:50%}
.stamp b{display:block;font-family:var(--f-serif);font-size:32px;line-height:1}
.stamp small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;max-width:84px}
.match{align-self:flex-start;width:178px;height:110px;background:var(--a);color:var(--cream);border:5px solid var(--cream);outline:2px solid var(--a);transform:rotate(-4deg);display:grid;place-items:center;text-align:center;box-shadow:0 5px 10px #0003;position:relative;z-index:2}
.match b{display:block;font-weight:900;font-size:22px;letter-spacing:.08em}
.match small{display:block;font-family:var(--f-serif);font-size:11px;letter-spacing:.04em;margin-top:3px}
.price{align-self:flex-start;background:#fff8d9;border:1.5px dashed var(--ink);padding:4px 14px 4px 22px;font-family:var(--f-map);font-size:18px;transform:rotate(3deg);position:relative;z-index:2;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.price b{font-family:var(--f-ui);font-size:20px;margin-left:8px}
.circles{position:relative;height:600px}
.circles .dot{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;padding:13%}
.circles .dot.g{background:var(--green);color:#fffbe8}.circles .dot.y{background:var(--yellow);color:var(--ink)}
.circles .dot:nth-child(1){left:0;top:0}.circles .dot:nth-child(2){right:0;top:30%}.circles .dot:nth-child(3){left:4%;top:60%}
.circles .dot p{margin:0;font-family:var(--f-hand);font-size:27px;line-height:1.25;text-align:center;position:relative;z-index:1}
html[lang="en"] .circles .dot p{font-family:var(--f-enhand);font-size:24px}
.circles .cc{position:absolute;z-index:3;width:40%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid var(--paper);box-shadow:0 4px 8px #0003}
.circles .dot:nth-child(1) .cc{right:-20%;top:-2%}.circles .dot:nth-child(2) .cc{right:-8%;bottom:-18%}.circles .dot:nth-child(3) .cc{right:-34%;bottom:4%}
.slip{align-self:flex-end;width:44%;margin:0;background:#fff;padding:6px 6px 24px;box-shadow:0 4px 10px #0003;transform:rotate(4deg);position:relative;z-index:3}
.slip img{display:block;width:100%}
.slip figcaption{position:absolute;bottom:3px;left:8px;font-family:var(--f-hand);font-size:15px}
.film{background:#191714;padding:16px 38px;margin:0 -38px;position:relative;display:flex;gap:6px;overflow:hidden}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:9px;background:repeating-linear-gradient(90deg,#0000 0 7px,#e9e2cf 7px 15px,#0000 15px 22px)}
.film::before{top:3px}.film::after{bottom:3px}
.film img{height:150px;width:auto;flex:none;display:block}
.belt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;background:repeating-linear-gradient(90deg,#c9c3b6 0 2px,#ddd7ca 2px 26px);border-radius:12px;border:3px solid #9a9184}
.belt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 6px #0003;display:block}
.endmark{font-family:var(--f-map);font-size:22px;text-align:center;margin-top:auto;color:var(--ink-soft)}
.nextp{align-self:flex-end;margin-top:auto;background:var(--paper);border:0;box-shadow:0 0 0 6px var(--paper);border-bottom:1.5px solid var(--a);color:var(--a);font-weight:700;font-size:13px;padding:2px 0;position:relative;z-index:6}
.draft{font-size:12px;color:#8a8278;margin:0}

@media (max-width:860px){
  .spread{grid-template-columns:1fr}
  .spread::after{display:none}
  .pg{padding:20px 18px 26px}
  .film{margin:0 -18px;padding:14px 18px}
  .film img{height:104px}
  .circles{height:auto;display:flex;flex-direction:column}
  .circles .dot{position:relative;left:auto!important;right:auto!important;top:auto!important;width:74%}
  .circles .dot:nth-child(2){align-self:flex-end;margin-top:-12%}
  .circles .dot:nth-child(3){margin-top:-12%}
  .hand{font-size:19px}
  .photo{width:100%}
}

.stops{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.stopbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid #cfc9bd;border-radius:20px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700;color:var(--ink)}
.stopbtn b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-family:var(--f-map);font-size:13px}
.stopbtn:hover{border-color:var(--ink)}
.tobook{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:12px;background:var(--ink);color:#fff;border:0;border-radius:6px;font-weight:900;font-size:15px;letter-spacing:.1em}
.backmap{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:5px 12px 5px 9px;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.06em}
.backmap:hover{background:var(--a)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:26px;padding:10px 16px 10px 12px;font-weight:900;font-size:15px;letter-spacing:.06em;box-shadow:0 6px 16px #0007}
.fab:hover{background:#f1cb55}

.feelwrap .hand+.hand{margin-top:.55em}
.duo{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start}
.duo .photo{width:100%;margin:0}
.duo .photo img{max-height:330px}

const INDEXURL='../';const ALL={"1":{"D":{"ui":{"title":{"zh":"古都走廊 · 开封","en":"Ancient Capitals · Kaifeng"},"sub":{"zh":"KAIFENG · 汴京","en":"KAIFENG · THE SONG CAPITAL"},"dayline":{"zh":"到开封 · 清明上河园的第一个晚上","en":"Arriving · a first night in the painting"},"legendM":{"zh":"上午","en":"Morning"},"legendA":{"zh":"下午","en":"Afternoon"},"legendN":{"zh":"晚上","en":"Evening"},"sight":{"zh":"名所","en":"Sights"},"food":{"zh":"吃的","en":"Food"},"all":{"zh":"全图","en":"Whole map"},"hint":{"zh":"点圆点或下面的地名翻到那一页。缩放：按钮、双指，或 Ctrl/⌘ + 滚轮；电脑上可拖动地图。单指上下滑照常翻页。","en":"Tap a pin, or a name below, to turn to its page. Zoom with the buttons, a two-finger pinch, or Ctrl/⌘ + scroll; on a computer, drag to pan. A one-finger swipe simply scrolls the page."},"back":{"zh":"回地图","en":"Back to map"},"notesTag":{"zh":"小知识","en":"Background"},"feelTag":{"zh":"攻略","en":"Tips"},"dayTag":{"zh":"那天","en":"That day"},"next":{"zh":"下一页 →","en":"Next →"},"home":{"zh":"酒店","en":"Hotel"},"end":{"zh":"— Day 1 · 完 —","en":"— end of Day 1 —"},"fab":{"zh":"回地图","en":"Map"},"tobook":{"zh":"往下看这一天的手账 ↓","en":"Read the day's journal ↓"},"day":"Day 1","badge":"汴","maphead":{"zh":"City Walk","en":"City Walk"}},"areas":{"a":{"color":"#b3261e","zh":"傍晚 · 到开封","en":"Late afternoon · Arriving","box":[-10,291,160]},"n":{"color":"#5b4a7a","zh":"晚上 · 清明上河园","en":"Evening · Qingming Riverside Park","box":[266,284,630]}},"home":[34.8035,114.3442],"hops":[{"from":"a","to":"home","q":[560,1180],"t":[360,905,18],"fs":24,"txt":{"zh":"开封北站 → 打车去酒店（约 9 公里）","en":"Kaifeng North → taxi to the hotel (about 9 km)"}},{"from":"home","to":"b","q":[900,640],"t":[800,700,-28],"fs":24,"txt":{"zh":"走进园","en":"walk into the park"}}],"places":[{"id":"a","L":"A","area":"a","kind":"sight","time":"17:01","lat":34.8126,"lon":114.3272,"name":{"zh":"到开封","en":"Arriving in Kaifeng"},"pinName":{"zh":"← 开封北站","en":"← Kaifeng North Sta."},"lab":{"dx":18,"dy":-8,"a":"start"},"wide":{"p":{"zh":"p3001","en":"p3002"},"mx":620},"notes":{"zh":"开封古称大梁、汴州，北宋时叫东京、汴梁。北宋一百六十多年，这里是都城。公元 1100 年前后，东京是当时世界上最大、最富的城市，人口一般估计在百万以上（也有一百五十万的说法），同时期的伦敦只有一两万人。人们常说开封是「七朝古都」（也有「八朝」的说法，把夏朝也算进去，有争议）。黄河一次次泛滥，泥沙把旧城一层层埋进地下，新城又盖在上面——今天的开封城底下，叠着六座城。我们走在街上，北宋的东京就在脚下八到十米。","en":"Kaifeng was Daliang and Bianzhou in older times, and Dongjing — the Eastern Capital — under the Northern Song. For over 160 years it was the capital. Around 1100 Dongjing was the largest and richest city in the world, usually estimated at over a million people (some say 1.5 million), while London at the time had perhaps fifteen or twenty thousand. It's called the capital of seven dynasties (some say eight, counting the Xia, which is disputed). Again and again the Yellow River flooded, buried the old city in silt, and a new one was built on top — there are six cities stacked under today's Kaifeng. Walking its streets, we had Song-dynasty Dongjing eight to ten metres under our feet."},"left":[{"t":"label","zh":"汴京","en":"BIANJING · 汴京"},{"c":"hongqiao","w":"44%","r":-2,"a":"r","wrap":1,"mt":4,"t":"deco"},{"t":"notes"},{"t":"kbox","title":{"zh":"小知识 · 城摞城","en":"Field notes · a city on a city"},"intro":{"zh":"地下三米到十几米，叠着六座城：三座国都、两座省城、一座中原重镇。","en":"From three to over a dozen metres down lie six cities: three national capitals, two provincial capitals and one regional seat."},"rows":[{"h":{"zh":"最深一层","en":"The deepest"},"t":{"zh":"战国时魏国的都城大梁，在地下十二到十四米。","en":"Daliang, capital of the Warring States kingdom of Wei, 12–14 m down."}},{"h":{"zh":"北宋东京","en":"Song Dongjing"},"t":{"zh":"在地下八到十米。北宋御街上的州桥 2020 年前后被挖了出来，石壁上刻着海马、仙鹤、祥云，和《东京梦华录》写的一样。","en":"8–10 m down. Zhou Bridge on the Song imperial avenue was dug out around 2020; its stone walls are carved with sea-horses, cranes and clouds, just as the old memoir of the city describes."}},{"h":{"zh":"明、清","en":"Ming and Qing"},"t":{"zh":"明城在五六米深，清城只有三米左右。1642 年那次大水，把明朝的开封整个淹了。","en":"The Ming city is 5–6 m down, the Qing about 3 m. The great flood of 1642 drowned Ming Kaifeng whole."}},{"h":{"zh":"门摞门","en":"Gate on gate"},"t":{"zh":"北宋宣德门、金代承天门、明代午门，在同一个位置上下叠着。","en":"The Song Xuande Gate, the Jin Chengtian Gate and the Ming Meridian Gate sit one above another in the same spot."}}]}],"right":[{"t":"photo","p":"p007","r":-1.5,"w":"44%","cap":{"zh":"洛阳去开封的高铁上","en":"On the train from Luoyang"}},{"t":"photo","p":"p010","r":1,"w":"56%","cap":{"zh":"开封北站外","en":"Outside Kaifeng North"}},{"t":"note","txt":{"zh":"然后🚄一小时抵达开封马不停蹄吃完晚饭就去了清明上河园（一日票其实可以无限打卡三天，太赞了👍）","en":"Then a one-hour 🚄 ride to Kaifeng, and without stopping we had dinner and went straight to the Qingming Riverside Park (a one-day ticket actually lets you in as often as you like for three days — brilliant 👍)"}},{"t":"tip","txt":{"zh":"洛阳龙门站到==开封北站==，高铁最快一个多小时。开封北站 2016 年启用，在老城西北八到十公里，出站打车进城。","en":"Luoyang Longmen to ==Kaifeng North== takes just over an hour on the fastest trains. The station opened in 2016, 8–10 km northwest of the old city; take a taxi in."}}],"cuts":[]},{"id":"b","L":"B","area":"n","kind":"sight","time":"20:21","name":{"zh":"清明上河园 · 夜","en":"Qingming Riverside Park by night"},"pinName":{"zh":"清明上河园","en":"Qingming Park"},"lab":{"dx":18,"dy":26,"a":"start"},"notes":{"zh":"清明上河园是照着张择端的《清明上河图》建起来的一座宋城，1998 年开园，在龙亭湖西岸，占地六百多亩，其中一百多亩是水面。画里汴河两岸的虹桥、码头、酒楼、小摊，这里都搭成了真的；街上走着穿宋装的「NPC」，一天有上百场演出。","en":"Qingming Riverside Park is a Song-dynasty town built from Zhang Zeduan's scroll, Along the River During the Qingming Festival. It opened in 1998 on the west shore of Longting Lake: over 600 mu (about 40 hectares), a fifth of it water. The rainbow bridge, the wharves, the wine houses and the stalls along the painted Bian River are all built for real; costumed 'NPCs' stroll the streets and there are about a hundred shows a day."},"left":[{"t":"label","zh":"清明上河园","en":"QINGMING RIVERSIDE PARK"},{"t":"notes"},{"t":"photo","p":"p011","r":-1,"w":"72%","cap":{"zh":"进园","en":"In we go"}},{"t":"note","txt":{"zh":"我10岁的时候来开封，还没有清明上河园这样的主题乐园。如果当年也有这样的地方，我想我小时候对开封的印象一定会清晰得多。","en":"When I came to Kaifeng at ten, there was no theme park like this. If there had been, I think my childhood memory of Kaifeng would be much clearer."},"by":"dad"},{"c":"tiehua","w":"40%","r":2,"a":"r","wrap":1,"t":"deco"},{"t":"kbox","title":{"zh":"小知识 · 打铁花","en":"Field notes · iron flowers"},"intro":{"zh":"一千多度的铁水，被一棒打上夜空。","en":"Molten iron at over a thousand degrees, struck up into the night sky."},"rows":[{"h":{"zh":"国家级非遗","en":"National heritage"},"t":{"zh":"2008 年，河南确山的打铁花列入国家级非物质文化遗产，说是「始于北宋，盛于明清」，原本是工匠祭祀太上老君的仪式。","en":"In 2008 the iron flowers of Queshan, Henan, became national intangible heritage — 'begun in the Northern Song, flourishing in the Ming and Qing', first a craftsmen's rite for Laozi."}},{"h":{"zh":"怎么打","en":"How it's done"},"t":{"zh":"把生铁化成铁水，表演者用柳木棒舀起来往高处一击，铁水碎成漫天火星，像一棵开满花的树。","en":"Pig iron is melted down; the performer scoops it with a willow stick and strikes it high, and it bursts into a tree of sparks."}},{"h":{"zh":"老规矩","en":"The old costume"},"t":{"zh":"传统上表演者光着膀子、头上扣一个葫芦瓢，在柳枝搭的花棚下打。","en":"Traditionally bare-chested, a gourd ladle on the head, under a canopy of willow branches."}},{"h":{"zh":"园里两场","en":"Two shows here"},"t":{"zh":"晚上虹桥西边水面有《铁花庆归航》，九龙桥西南水面有《打铁花之盛世大宋》。","en":"At night: 'Iron Flowers Welcome the Boats Home' west of the Rainbow Bridge, and 'Iron Flowers of the Great Song' southwest of Nine Dragon Bridge."}}]},{"t":"photo","p":"p042","r":1.5,"w":"52%","cap":{"zh":"一路的荷叶灯","en":"Lotus-leaf lamps along the path"}}],"right":[{"t":"photo","p":"p022","r":1,"w":"80%"},{"t":"note","txt":{"zh":"园里布景好美，刚好最近是大宋上元灯会，夜幕下，直接一秒穿回汴京。园区好多npc和小活动，我们高效率的刷了两个高质量打铁花表演➕","en":"The park is beautifully staged, and the Song Lantern Festival happened to be on, so after dark you're back in Bianjing in a second. NPCs and little activities everywhere; we efficiently caught two excellent iron-flower shows ➕"}},{"t":"row","p":["p034","p037"],"cap":[{"zh":"水上的铁花","en":"Iron flowers on the water"},null]},{"t":"photo","p":"p055","r":-1,"w":"86%","cap":{"zh":"九龙桥边的打铁花","en":"Iron flowers by Nine Dragon Bridge"}},{"t":"note","txt":{"zh":"这次在清明上河园看的每一场演出参加的每一个活动，几乎都是给哥哥讲宋史的好机会。两场打铁花，确实是视觉盛宴；","en":"Nearly every show we watched and every activity we joined in the park was a chance to tell our older boy about Song history. The two iron-flower shows really were a feast for the eyes;"},"by":"dad"},{"t":"row","p":["p057","p065"]},{"t":"tip","txt":{"zh":"门票 ¥120（≈ $18），==6–18 岁优待票 ¥60（≈ $9）==，以当日公示为准；9:00 开园，22:00 闭园。晚上的打铁花、马战入园后都免费。节目每天微调，==进门先看公众号「清明上河园景区」的当日节目表==。","en":"Tickets ¥120 (≈ $18), ==¥60 (≈ $9) for ages 6–18== — check the prices posted on the day; open 9:00–22:00. The night iron-flower shows and the horse battle are free once you're in. The schedule shifts daily: ==check the park's WeChat account for the day's programme== as you enter."}}],"cuts":[],"lat":34.8088937,"lon":114.3362575},{"id":"c","L":"C","area":"n","kind":"sight","time":"21:35","name":{"zh":"《岳飞 · 郾城大捷》","en":"Yue Fei at Yancheng"},"pinName":{"zh":"大宋·校场","en":"Song Drill Ground"},"lab":{"dx":18,"dy":-10,"a":"start"},"notes":{"zh":"夜里在「大宋·校场」看的大马战，2024 年五一首演，三十分钟左右，两百来名演员，真马上阵。演的是岳飞北伐时的郾城之战。真实的历史：绍兴十年（1140）七月初八，金兀术（完颜宗弼）带一万五千多骑兵在郾城和岳家军遭遇。岳飞先派背嵬军、游奕军两支骑兵迎战，又让儿子岳云冲阵，从下午一直打到天黑，金兵败退。几天后，岳家的将领杨再兴带三百骑在小商桥撞上金军主力，战死——戏里也有小商桥这一幕。","en":"The big night-time horse battle in the Song Drill Ground opened in 2024: about thirty minutes, some two hundred performers and real horses. It tells the Battle of Yancheng from Yue Fei's northern campaign. The history: on the eighth day of the seventh month of 1140, the Jin commander Wuzhu (Wanyan Zongbi) met Yue Fei's army at Yancheng with over fifteen thousand horsemen. Yue Fei sent in two cavalry corps, then his son Yue Yun, and they fought from afternoon until dark, when the Jin fell back. A few days later his officer Yang Zaixing ran into the main Jin army at Xiaoshang Bridge with three hundred riders and was killed — the show has a scene for that too."},"left":[{"t":"label","zh":"大宋·校场","en":"SONG DRILL GROUND"},{"c":"yuefei","w":"40%","r":-1,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"photo","p":"p074","r":-1,"w":"90%"},{"t":"photo","p":"p095","r":1,"w":"58%"},{"t":"kbox","title":{"zh":"小知识 · 拐子马，砍马腿","en":"Field notes · chained horses?"},"intro":{"zh":"《宋史》里有个很有名的故事，学者们却不太信。","en":"A famous story from the official history that historians doubt."},"rows":[{"h":{"zh":"《宋史》说","en":"The history says"},"t":{"zh":"金兵的「拐子马」三匹连在一起冲；岳飞让步兵「勿仰视，第斫马足」——别抬头，只管低头砍马腿，倒一匹，另外两匹也跑不动。","en":"The Jin 'crutch horses' charged three to a chain; Yue Fei told his foot soldiers, 'don't look up — just cut the horses' legs.' Fell one, and the other two are stuck."}},{"h":{"zh":"学者说","en":"Historians say"},"t":{"zh":"邓广铭考证，「拐子马」原本指左右两翼的骑兵；「三马相连」是岳飞的孙子岳珂后来写的，被《宋史》照抄。乾隆皇帝也说这是「理所必无」。","en":"Deng Guangming showed that 'crutch horses' just meant the cavalry on the two wings; the chained-horses story was written later by Yue Fei's grandson and copied into the history. Even the Qianlong Emperor called it impossible."}},{"h":{"zh":"「莫须有」","en":"'Perhaps'"},"t":{"zh":"打了胜仗的第二年（1142），岳飞被秦桧以「莫须有」的罪名害死。「莫须有」，意思是「也许有吧」。","en":"In 1142, two years after the victory, Qin Hui had Yue Fei put to death on a charge of 'mo xu you' — 'perhaps there was something'."}}]}],"right":[{"t":"row","p":["p082","p084"]},{"t":"note","txt":{"zh":"紧接着无缝连接看了岳飞·郾城大捷表演（道具场景设计都很用心，我们也很幸运的最佳c位看完全场，沉浸式体验💯，弟弟说这是他最喜欢的节目。）又是满满的一天😎","en":"and went straight on to Yue Fei at Yancheng (the props and sets are so carefully done, and we were lucky enough to watch the whole thing from the best seats, dead centre — fully immersive 💯; our younger boy says it's his favourite show). Another full day 😎"}},{"t":"row","p":["p088","p090"]},{"t":"row","p":["p099","p102"]},{"t":"photo","p":"p107","r":-1.5,"w":"70%"},{"t":"photo","p":"p114","r":1,"w":"46%","cap":{"zh":"散场了","en":"Show's over"}},{"t":"tip","txt":{"zh":"《郾城大捷》在大宋·校场，夜场一场，约 30 分钟。那天的节目表上==打铁花 21:10、郾城大捷 21:30==，前后脚，看完打铁花直接去校场。","en":"Yancheng plays once a night in the Song Drill Ground, about 30 minutes. That day's programme had ==iron flowers at 21:10 and Yancheng at 21:30== — go straight from one to the other."}},{"t":"end"}],"cuts":[],"lat":34.8125262,"lon":114.3365361}],"voices":[],"vr":0.71,"view":[-134,174,1400],"days":[{"n":"Day 1","cur":true},{"n":"Day 2","url":"#day2"}]},"G":{"local":" M413.7,340.2 L406.1,346.3 L400.6,351.2 L392.9,360.5 L388.9,367.2 L385.7,372.5 L342.8,461.4 L340.4,467.2 L339.1,471.8 L337.6,477.9 L307.8,610.1 L300.9,640.9 L277.4,755.2 L275.8,762.9 L274.8,767.2 L273.4,774.3 L260.0,839.6 L224.4,1026.7 L222.2,1035.5 L219.6,1042.0 L217.2,1046.4 L208.6,1057.3 L202.6,1063.2 L192.5,1073.0 L188.0,1078.3 L184.8,1083.2 L183.4,1087.2 L182.4,1091.4 L177.6,1140.5 L177.1,1145.3 M276.2,319.2 L275.0,325.5 L256.6,405.0 L255.9,408.2 L203.4,632.3 L176.4,753.1 L153.8,846.2 L152.5,851.6 L129.4,951.6 L102.3,1069.2 L99.4,1082.1 L89.6,1126.5 M526.2,-367.3 L523.7,-353.9 L521.5,-342.6 L516.5,-317.8 L513.4,-302.5 L506.4,-267.7 L501.8,-241.8 L499.1,-228.2 L496.2,-216.3 L492.9,-201.3 L489.5,-190.5 L485.2,-177.2 L480.8,-165.0 L477.9,-156.5 L466.9,-127.7 L457.2,-104.8 L450.0,-89.5 L434.7,-59.7 L403.4,1.2 L376.0,53.2 L344.8,111.8 L330.4,140.8 L320.6,164.2 L316.0,177.1 L311.6,189.6 L305.8,207.5 L278.5,298.0 L277.2,302.5 L276.2,319.2 M276.2,319.2 L285.9,308.5 L287.4,303.7 L288.2,300.9 L315.4,210.5 L321.2,192.9 L325.5,180.5 L330.1,167.9 L339.6,145.0 L353.8,116.4 L384.9,58.0 L412.3,5.8 L443.7,-55.1 L459.0,-85.0 L466.5,-100.6 L476.3,-123.9 L487.4,-152.9 L490.4,-161.4 L494.7,-174.0 L499.1,-187.3 L501.0,-194.2 L502.4,-198.8 L505.8,-214.1 L508.6,-226.1 L511.5,-239.9 L516.2,-265.6 L524.0,-305.2 L524.3,-306.8 L526.1,-315.9 L531.1,-341.8 L533.2,-353.0 L535.6,-366.5 M764.6,285.8 L762.6,306.9 M1031.8,-28.9 L1017.5,-30.1 L1013.8,-30.3 L1003.8,-31.0 L986.7,-30.0 L954.2,-26.2 L943.2,-26.2 L917.6,-27.3 L852.3,-30.2 L837.5,-29.7 L834.3,-7.7 L830.4,18.1 L823.3,56.7 L822.2,63.0 L820.1,73.0 L813.6,95.4 L812.6,99.1 L811.4,103.7 L807.5,120.5 L804.0,129.3 L800.1,136.9 L780.2,168.7 L778.5,171.3 L765.7,190.1 L749.1,209.6 L745.5,215.4 L742.5,222.9 L738.2,23 pin, or a name below, to turn to its page. Zoom with the buttons, a two-finger pinch, or Ctrl/⌘ + scroll; on a computer, drag to pan. A one-finger swipe simply scrolls the page."},"back":{"zh":"回地图","en":"Back to map"},"notesTag":{"zh":"小知识","en":"Background"},"feelTag":{"zh":"攻略","en":"Tips"},"dayTag":{"zh":"那天","en":"That day"},"next":{"zh":"下一页 →","en":"Next →"},"home":{"zh":"酒店","en":"Hotel"},"end":{"zh":"— Day 2 · 完 —","en":"— end of Day 2 —"},"fab":{"zh":"回地图","en":"Map"},"tobook":{"zh":"往下看这一天的手账 ↓","en":"Read the day's journal ↓"},"day":"Day 2","badge":"汴","maphead":{"zh":"City Walk","en":"City Walk"}},"areas":{"m":{"color":"#3d6f8f","zh":"上午 · 清明上河园","en":"Morning · in the park","box":[258,284,501]},"a":{"color":"#b3261e","zh":"下午 · 午饭、回酒店","en":"Afternoon · lunch, hotel","box":[909,832,203]},"n":{"color":"#5b4a7a","zh":"晚上 · 再进园","en":"Evening · back to the park","box":[235,447,360]},"d":{"color":"#6f6a64","zh":"第二天中午 · 去大同","en":"Next day · on to Datong","box":[-10,109,160]}},"home":[34.8035,114.3442],"hops":[{"from":"home","to":"a","q":[700,900],"t":[560,880,-30],"fs":24,"txt":{"zh":"早上走进园","en":"walking in, morning"}},{"from":"d","to":"e","q":[760,520],"t":[700,560,35],"fs":24,"txt":{"zh":"出园吃午饭","en":"out for lunch"}},{"from":"home","to":"f","q":[560,1060],"t":[420,1010,-12],"fs":24,"txt":{"zh":"傍晚再进园","en":"back in at dusk"}},{"from":"home","to":"i","q":[420,1250],"t":[470,905,12],"fs":24,"txt":{"zh":"打车去开封北站","en":"taxi to Kaifeng North"}}],"places":[{"id":"a","L":"A","area":"m","kind":"sight","time":"09:52","name":{"zh":"走进画里","en":"Into the painting"},"pinName":{"zh":"入园","en":"In we go"},"lab":{"dx":-18,"dy":26,"a":"end"},"notes":{"zh":"《清明上河图》是北宋张择端画的，绢本长卷，五米多长，二十几厘米高，现藏北京故宫。画的是东京汴河两岸：从郊外的小路，到河上的大船、虹桥，再到城门里的街市。画里有几百个人物（数法不一，从五百多到八百多），还有二十多条船。找彩蛋最好玩：虹桥下一条大船正在放倒桅杆，眼看要撞上桥，船上桥上的人都在喊；城门口一队骆驼正走出城；街上的「孙羊店」「正店」都是真实的酒楼招牌——园里也照着盖了一座孙羊正店。","en":"Along the River During the Qingming Festival was painted by Zhang Zeduan in the Northern Song: a silk handscroll over five metres long and about 25 cm high, now in the Palace Museum in Beijing. It follows the Bian River through Dongjing — country lanes, then boats and the great Rainbow Bridge, then the streets inside the city gate. There are several hundred people (counts range from about 500 to over 800) and more than twenty boats. The fun is in the details: under the bridge a big boat is lowering its mast just in time, with everyone on deck and bridge shouting; a camel train walks out of the city gate; the Sun Yang wine house signs are real Song restaurants — and the park has built a Sun Yang wine house too."},"left":[{"t":"label","zh":"清明上河图","en":"THE QINGMING SCROLL"},{"c":"matou","w":"44%","r":-1.5,"a":"r","wrap":1,"mt":4,"t":"deco"},{"t":"notes"},{"t":"photo","p":"p119","r":-1,"w":"54%","cap":{"zh":"进门，头顶是一片青绿的波浪","en":"Overhead at the entrance: a sea of blue-green waves"}},{"t":"row","p":["p126","p129"],"cap":[null,{"zh":"骑在肩上看热闹","en":"On someone's shoulders for a better view"}]},{"t":"row","p":["p138","p149"],"cap":[{"zh":"「牌」字摊","en":"The 'Cards' stall"},null]}],"right":[{"t":"photo","p":"p153","r":1,"w":"70%"},{"t":"photo","p":"p174","r":-1,"w":"56%","cap":{"zh":"王员外家门前","en":"Outside Squire Wang's house"}},{"t":"note","txt":{"zh":"继续。先是看了飞刀和变脸的表演，（清明上河图里的）王员外招婿给我们路人甲们赏了喜糖，","en":"Carrying on. First we watched the flying knives and the face-changing; Squire Wang's son-in-law contest (from the Qingming scroll) treated all of us passers-by to wedding sweets;"}},{"t":"row","p":["p182","p186"]},{"t":"photo","p":"p191","r":1.5,"w":"72%"},{"t":"tip","txt":{"zh":"园里一天上百场演出，抢不过来。==先挑两三场必看的==，其他的顺路看。==早上开园就进==；夏天正午很晒，帽子、伞、防晒都要带。","en":"With about a hundred shows a day you can't see them all. ==Pick two or three must-sees== and catch the rest on the way. ==Get in when the gates open==; the summer midday sun is fierce — bring hats, umbrellas, sunscreen."}}],"cuts":[],"lat":34.8087774,"lon":114.3320453},{"id":"b","L":"B","area":"m","kind":"sight","time":"11:03","name":{"zh":"《岳飞枪挑小梁王》","en":"Yue Fei and the Little Prince of Liang"},"pinName":{"zh":"大宋·校场","en":"Song Drill Ground"},"lab":{"dx":18,"dy":-10,"a":"start"},"notes":{"zh":"《岳飞枪挑小梁王》是清明上河园的招牌马战，2013 年国庆首演，二十分钟左右：先是马术特技，再演比武，用的都是真马。故事出自清代小说《说岳全传》第十二回，不是正史：武举考场上，小梁王柴桂仗着主考官张邦昌撑腰，想夺武状元；岳飞要求两人立下「生死状」，一枪把小梁王挑下马。另一位主考宗泽替岳飞说话，考生们大闹武场，岳飞趁乱离开。头天晚上看的郾城大捷是真打过的仗，这一场是小说——同一个岳飞。","en":"The Yue Fei joust is the park's signature horse show, running since 2013: about twenty minutes of trick riding and then the duel, all on real horses. The story comes from a Qing-dynasty novel, The Complete Tale of Yue Fei, not from the histories: at the military exam, the arrogant Little Prince of Liang, backed by the corrupt examiner Zhang Bangchang, wants the top prize; Yue Fei insists they both sign a 'life-and-death pledge' and knocks him off his horse with one thrust of the spear. The other examiner, Zong Ze, speaks up for him, the candidates riot, and Yue Fei slips away. Last night's Yancheng was a real battle; this one's a novel — same Yue Fei."},"left":[{"t":"label","zh":"枪挑小梁王","en":"THE JOUST"},{"t":"notes"},{"t":"photo","p":"p206","r":-1,"w":"90%"},{"t":"row","p":["p217","p218"]},{"t":"kbox","title":{"zh":"小知识 · 真的岳飞","en":"Field notes · the real Yue Fei"},"intro":{"zh":"小说是小说，人是真的。","en":"The novel is fiction; the man was real."},"rows":[{"h":{"zh":"1103–1142","en":"1103–1142"},"t":{"zh":"相州汤阴人，农家出身，二十岁左右从军，后来成了南宋名将。","en":"Born to a farming family in Tangyin, Henan; joined the army at about twenty and became one of the great generals of the Southern Song."}},{"h":{"zh":"背上四个字","en":"Four words on his back"},"t":{"zh":"《宋史》记载，岳飞背上刺着「尽忠报国」四个大字。「岳母刺字」是后来戏曲、小说里的故事。","en":"The official history records 'serve the country with utmost loyalty' tattooed on his back. His mother doing the tattoo comes from later plays and novels."}},{"h":{"zh":"纪律","en":"Discipline"},"t":{"zh":"岳家军有句话：「冻杀不拆屋，饿杀不掳掠」——冻死也不拆百姓的房子烧火，饿死也不抢。","en":"His army's motto: 'freeze to death but don't tear down houses for firewood; starve but don't plunder.'"}}]}],"right":[{"t":"row","p":["p209","p210"]},{"t":"note","txt":{"zh":"热浪中又观战了岳飞枪挑小梁王（演员们好敬业啊还有🐎也是）","en":"then in the heat we watched Yue Fei and the Little Prince of Liang (the actors are so dedicated — and so are the 🐎)"}},{"t":"photo","p":"p211","r":1,"w":"62%"},{"t":"note","txt":{"zh":"中午35度的高温下，演员们穿着盔甲演《岳飞枪挑小梁王》，还要马上作战，真是佩服他们的敬业。","en":"At noon, in 35°C heat, the actors played the Yue Fei joust in full armour, fighting on horseback. I really admire their dedication."},"by":"dad"},{"t":"row","p":["p219","p223"],"cap":[{"zh":"祝记老冰棍","en":"Old-style ice lollies"},null]},{"t":"tip","txt":{"zh":"《枪挑小梁王》上午、下午各一场，约 20 分钟。==校场开演就封门==，晚了进不去，平时提前一小时左右排队。","en":"The joust runs once in the morning and once in the afternoon, about 20 minutes. ==The arena doors close when it starts== — queue about an hour early on an ordinary day."}}],"cuts":[],"lat":34.8120427,"lon":114.3365823},{"id":"c","L":"C","area":"m","kind":"sight","time":"12:03","name":{"zh":"《大宋 · 东京保卫战》","en":"The Defence of Dongjing"},"pinName":{"zh":"九龙桥西南水面","en":"Nine Dragon Bridge"},"lab":{"dx":-18,"dy":6,"a":"end"},"notes":{"zh":"九龙桥西南的水面上，对岸是一段城墙和水门。演的是靖康元年（1126）金兵围攻东京：金兵驾着火船、架起云梯攻城，宰相李纲指挥守军用挠钩钩住火船、烧掉云梯，守住了城。这一段真有记载：李纲在《靖康传信录》里写，正月初十夜里，金人用大船攻西水门，他招了两千敢死士，「以长钩摘就岸，投石碎之」——用长钩把船拖到岸边，再砸碎。这一仗史称第一次东京保卫战。只是这一次守住了，第二年东京还是被攻破，就是靖康之变。","en":"On the water southwest of Nine Dragon Bridge, facing a stretch of city wall and a water gate, the show replays the Jin siege of Dongjing in 1126: fire-ships and scaling ladders, and the minister Li Gang's defenders hooking the burning boats and torching the ladders until the city holds. This part is on record. In his own account Li Gang wrote that on the night of the tenth of the first month the Jin attacked the West Water Gate with big boats; he raised two thousand volunteers, who 'hooked them to the bank with long poles and smashed them with stones.' This is known as the first Defence of Dongjing. The city held that time; the next year it fell — the Jingkang Incident."},"left":[{"t":"label","zh":"西水门","en":"THE WEST WATER GATE"},{"c":"chengmen","w":"44%","r":1.5,"a":"r","wrap":1,"mt":4,"t":"deco"},{"t":"notes"},{"t":"photo","p":"p227","r":-1,"w":"90%"},{"t":"row","p":["p231","p233"]}],"right":[{"t":"photo","p":"p425","r":1,"w":"88%","cap":{"zh":"火船攻城","en":"Fire-ships at the gate"}},{"t":"note","txt":{"zh":"以及大宋东京保卫战（实战水景，真·大炮烟火，城墙攻防）","en":"and the Defence of Dongjing (a real battle on the water — actual cannon smoke and fire, the city walls attacked and defended)"}},{"t":"note","txt":{"zh":"《郾城大捷》和第一次东京保卫战，小哥俩看得非常过瘾，尤其是哥哥这个战争史爱好者；","en":"Yancheng, and the first Defence of Dongjing, thrilled both boys — especially the older one, our war-history buff;"},"by":"dad"},{"t":"photo","p":"p237","r":-1,"w":"50%"},{"t":"row","p":["p239","p243"]},{"t":"tip","txt":{"zh":"看台前几排会被水溅到。最佳位置是正对西水门的台阶。","en":"The front rows get splashed. The best seats face the West Water Gate head-on."}}],"cuts":[],"lat":34.8100657,"lon":114.3334018},{"id":"d","L":"D","area":"m","kind":"sight","time":"12:30","name":{"zh":"正午的园子 · 机甲武士","en":"Midday · the mecha warrior"},"pinName":{"zh":"机甲武士","en":"Mecha warrior"},"lab":{"dx":-18,"dy":-6,"a":"end"},"notes":{"zh":"清明上河园里不只有宋朝。节目单上有一项「机甲武士展演」，地点写着「大宋沉浸式体验馆」：比人高出一大截的铠甲武士站在宋式大殿前，孩子们围上去合影。正午最热的时候，我们在树荫下歇脚、吃东西，再从那片青绿的波浪底下出园。","en":"The park isn't all Song dynasty. The programme lists a 'mecha warrior show' at the 'Great Song Immersive Hall': armoured warriors far taller than a person stand before a Song-style hall while children crowd in for photos. In the midday heat we rested and snacked in the shade, then left under that canopy of blue-green waves."},"left":[{"t":"label","zh":"机甲武士","en":"MECHA WARRIOR"},{"c":"huolang","w":"38%","r":0,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"row","p":["p251","p255"]},{"t":"row","p":["p290","p296"]},{"t":"photo","p":"p261","r":1,"w":"64%","cap":{"zh":"大宋菊花茶","en":"Song-style chrysanthemum tea"}}],"right":[{"t":"row","p":["p265","p274","p277"]},{"t":"photo","p":"p271","r":-1,"w":"56%"},{"t":"photo","p":"p302","r":1,"w":"72%"}],"cuts":[],"lat":34.811752,"lon":114.33309},{"id":"e","L":"E","area":"a","kind":"food","time":"13:30","name":{"zh":"开封菜","en":"Lunch: Kaifeng food"},"pinName":{"zh":"午饭","en":"Lunch"},"lab":{"dx":18,"dy":-8,"a":"start"},"notes":{"zh":"开封人自己说，灌汤包北宋就有，那时叫「灌浆馒头」，东京最有名的酒楼之一王楼，「山洞梅花包子」号称东京第一。今天的灌汤包，是上世纪二三十年代名厨黄继善改出来的：死面薄皮、小笼现蒸，形容它「提起像灯笼，放下似菊花」。吃法要记住：先咬一个小口，吸汤，再吃馅。","en":"Kaifeng people say soup dumplings go back to the Northern Song, when the famous Wang wine house sold 'mountain-cave plum-blossom buns', the best in the capital. Today's version was perfected in the 1920s–30s by the chef Huang Jishan: thin unleavened skin, steamed fresh in small baskets — 'lift it and it's a lantern, set it down and it's a chrysanthemum.' The rule: bite a little hole, sip the soup, then eat."},"left":[{"t":"label","zh":"开封味道","en":"TASTES OF KAIFENG"},{"t":"notes"},{"t":"wall","cols":3,"p":[["p328",{"zh":"灌汤包","en":"Soup dumplings"}],["p320",{"zh":"炒凉粉","en":"Fried bean jelly"}],["p314",{"zh":"桶子鸡","en":"Barrel chicken"}],["p332",{"zh":"炸八块","en":"Eight-piece chicken"}],["p312",{"zh":"杏仁茶","en":"Almond tea"}],["p310",{"zh":"蒸菜","en":"Steamed greens"}],["p316",{"zh":"烩面","en":"Braised noodles"}],["p319",{"zh":"锅贴豆腐","en":"Pan-fried tofu"}],["p349",{"zh":"汴京啤酒","en":"Bianjing beer"}]]},{"t":"photo","p":"p324","r":1,"w":"72%"},{"c":"chaguan","w":"40%","r":1,"a":"r","wrap":1,"t":"deco"},{"t":"kbox","title":{"zh":"小知识 · 这一桌","en":"Field notes · the table"},"intro":{"zh":"每样都有来历。","en":"Every dish has a story."},"rows":[{"h":{"zh":"桶子鸡","en":"Barrel chicken"},"t":{"zh":"老字号马豫兴，清咸丰年间在开封鼓楼开店。手指从一个小口伸进去，把内脏整套掏出来，鸡就成了一个「桶」，再用老汤煨。","en":"Ma Yuxing, founded in the 1850s by the Drum Tower. The innards come out whole through one small opening, leaving the bird a 'barrel', then it's simmered in old stock."}},{"h":{"zh":"炸八块","en":"Eight pieces"},"t":{"zh":"一斤半左右的小公鸡，连骨剁成八块，腌过下锅炸，蘸花椒盐。上世纪二十年代开封「又一村」饭庄做出了名。","en":"A young rooster of about 750 g, chopped bone-in into eight, marinated, fried and dipped in pepper salt; made famous in the 1920s by Kaifeng's Youyicun restaurant."}},{"h":{"zh":"炒凉粉","en":"Fried bean jelly"},"t":{"zh":"绿豆加红薯粉做的凉粉，在铁鏊上炒，外面一层焦脆的壳。","en":"Jelly of mung bean and sweet-potato starch, fried on a griddle until a crisp crust forms."}},{"h":{"zh":"杏仁茶","en":"Almond tea"},"t":{"zh":"杏仁粉用龙凤大铜壶里的开水冲开，再撒上芝麻、花生、枸杞、果脯十几样。","en":"Almond powder whisked up with boiling water from a big dragon-and-phoenix copper kettle, topped with sesame, peanuts, goji and a dozen more."}},{"h":{"zh":"蒸菜","en":"Steamed greens"},"t":{"zh":"河南的家常：时令青菜、野菜拌上油盐、裹一层面粉蒸熟，蘸蒜汁吃。","en":"Henan home cooking: seasonal greens tossed in oil and salt, coated in flour, steamed, and dipped in garlic sauce."}}]}],"right":[{"t":"photo","p":"p305","r":-1,"w":"52%"},{"t":"note","txt":{"zh":"然后果断午后离开园子，打卡了豫菜系里其他特色菜，养精蓄锐晚上再战。","en":"Then, decisively, we left the park after noon, tried more of Henan cuisine's signature dishes, and rested up for round two in the evening."}},{"t":"photo","p":"p334","r":1,"w":"86%"},{"t":"photo","p":"p427","r":-1,"w":"72%","cap":{"zh":"我的拼图：这一桌","en":"My collage of the table"}},{"t":"photo","p":"p352","r":1.5,"w":"44%","cap":{"zh":"回酒店点的眷茶：荆芥柠檬","en":"Back at the hotel: jingjie lemon tea"}},{"t":"note","txt":{"zh":"ps，打卡了河南特色的荆芥系列（荆芥柠檬茶🥤和荆芥灌汤包）都挺不错的（荆芥原来也是罗勒的一种啊）","en":"PS: we tried Henan's jingjie specialities (jingjie lemon tea 🥤 and jingjie soup dumplings) — both pretty good (turns out jingjie is a kind of basil)"}},{"t":"tip","txt":{"zh":"灌汤包==先咬小口、吸汤，再吃馅==，别一口塞进去，烫。","en":"Soup dumplings: ==bite a hole and sip first==, don't pop one whole — it's scalding."}}],"cuts":[],"lat":34.8054093,"lon":114.3424161},{"id":"f","L":"F","area":"n","kind":"sight","time":"18:35","name":{"zh":"夜里的东京 · 交子","en":"Dongjing by night · paper money"},"pinName":{"zh":"交子","en":"Jiaozi"},"lab":{"dx":-18,"dy":-14,"a":"end"},"notes":{"zh":"晚上园里用「大宋交子」玩：跟穿宋装的 NPC 猜拳、对诗、摇骰子，赢了就发交子；攒够了，照着「交子兑换规则」去换小吃、游船、游乐项目。真的交子是世界上第一种官方纸币，天圣二年（1024）在四川成都由益州交子务发行。四川当时用铁钱，又重又不值钱，买一匹绢要背一百多斤铁钱，商人们才想出用纸来代替。","en":"At night the park runs on 'Great Song jiaozi': play rock-paper-scissors, swap poems or roll dice with the costumed NPCs and win notes, then trade them, by the posted exchange rules, for snacks, boat trips and fairground rides. The real jiaozi was the world's first government paper money, issued in Chengdu in 1024. Sichuan used iron coins then — heavy and nearly worthless; a bolt of silk cost over sixty kilos of them — so merchants started using paper instead."},"left":[{"t":"label","zh":"交子","en":"JIAOZI · PAPER MONEY"},{"c":"jiulou","w":"44%","r":-1,"a":"r","wrap":1,"mt":4,"t":"deco"},{"t":"notes"},{"t":"row","p":["p357","p359"],"cap":[{"zh":"抢交子","en":"Grabbing for jiaozi"},null]},{"t":"photo","p":"p362","r":-1.5,"w":"44%","cap":{"zh":"「壹萬貫」","en":"'Ten thousand strings of cash'"}}],"right":[{"t":"photo","p":"p363","r":1,"w":"46%"},{"t":"photo","p":"p415","r":1,"w":"56%","cap":{"zh":"交子兑换规则","en":"The jiaozi exchange rules"}},{"t":"tip","txt":{"zh":"交子靠跟 NPC 互动、做任务赢，按园里「交子兑换规则」换小吃、游船、游乐项目等，==各家标准不同，换之前先看规则牌==。","en":"You win jiaozi from NPC games and tasks and trade them, by the park's posted exchange rules, for snacks, boat trips, rides and more — ==each stall sets its own rate, so check the board first==."}}],"cuts":[],"lat":34.8089904,"lon":114.3317127},{"id":"g","L":"G","area":"n","kind":"sight","time":"19:13","name":{"zh":"夜里的游乐场","en":"The playground at dusk"},"pinName":{"zh":"游乐场","en":"Playground"},"lab":{"dx":18,"dy":-10,"a":"start"},"notes":{"zh":"","en":""},"left":[{"t":"label","zh":"游乐场","en":"THE PLAYGROUND"},{"t":"photo","p":"p2001","r":-1,"w":"46%","cap":{"zh":"一层叠一层的攀爬架（视频截图）","en":"Climbing frames, level on level (video still)"}},{"t":"photo","p":"p371","r":1,"w":"70%"}],"right":[{"t":"row","p":["p2002","p2003"],"cap":[{"zh":"视频截图","en":"Video still"},null]},{"t":"note","txt":{"zh":"晚上playground娃玩疯（设计的很棒）又跑各npc那里赢了不少交子，算是心满意足结束开封的中华文化主题乐园之行。120元门票🎫，真的是超值啊👍","en":"In the evening the kids went wild in the playground (really well designed) and ran from NPC to NPC winning lots of jiaozi — a happy end to our Chinese-culture theme park in Kaifeng. A 120-yuan ticket 🎫, such good value 👍"}},{"t":"note","txt":{"zh":"园里还有各种游戏，赢了可以拿“交子”，再加上一个超大的儿童游乐场，哥俩玩得停不下来。120元三天有效，真是太值回票价了。","en":"There are all kinds of games in the park — win and you get 'jiaozi' — plus a huge children's playground; the two boys couldn't stop playing. 120 yuan, valid for three days: worth every bit."},"by":"dad"},{"t":"note","txt":{"zh":"游乐场很大，进门的那道门倒是古香古色的，一进去，满眼是滑梯和攀爬架。最贴心的是头顶装着喷水雾的装置，隔一会儿就噗地喷一阵。大人们站在底下等孩子，热还是热，可身上凉丝丝的，好受多了。这样的小地方也想得这么周到，叫人看了高兴。如今国内的这些设计，是真用心。","en":"The playground is big, and the gate you walk in through is handsomely old-style; inside, it's slides and climbing frames as far as you can see. The thoughtful part is overhead: misting sprayers that puff out a cool cloud every little while. The grown-ups waiting underneath are still hot, but it feels a good deal better. Someone thought this through, right down to the small things, and it made us happy. Design in China these days really is done with care."}}],"cuts":[],"lat":34.809247,"lon":114.334517},{"id":"h","L":"H","area":"n","kind":"sight","time":"20:00","name":{"zh":"夜里的东京 · 灯笼和小游戏","en":"Lanterns and little games by night"},"pinName":{"zh":"夜游","en":"Night walk"},"lab":{"dx":16,"dy":22,"a":"start"},"notes":{"zh":"","en":""},"left":[{"t":"label","zh":"灯笼","en":"LANTERNS"},{"t":"kbox","title":{"zh":"小知识 · 宋朝人的夜","en":"Field notes · a Song night out"},"intro":{"zh":"唐朝长安有宵禁，北宋东京慢慢放开了。","en":"Tang Chang'an had a curfew; Song Dongjing gradually let it go."},"rows":[{"h":{"zh":"夜市","en":"Night markets"},"t":{"zh":"乾德三年（965）宋太祖下诏：京城三更以前，夜市不得禁止。《东京梦华录》写东京的夜市：「夜市直至三更尽，才五更又复开张」。","en":"In 965 Emperor Taizu ruled that night markets in the capital could not be stopped before the third watch. The memoir Dreams of Splendour of the Eastern Capital: 'the night market runs to the end of the third watch, and opens again at the fifth.'"}},{"h":{"zh":"关扑","en":"Guanpu"},"t":{"zh":"宋朝流行的街头赌戏：掷铜钱看正反面，赢了就用很低的价钱拿走东西。平时禁止，开封府只在正月初一、寒食、冬至各放三天。","en":"A Song street gamble: toss coins for heads or tails, and if you win you take the goods for a song. Normally banned; Kaifeng allowed it only three days each at New Year, the Cold Food festival and the winter solstice."}}]},{"t":"row","p":["p394","p405"],"cap":[{"zh":"红灯笼下套酒瓶","en":"Ring toss under the red lanterns"},null]},{"t":"note","txt":{"zh":"满屋子挂着红灯笼，原来是个游戏摊：拿一个铁圈去套酒瓶，要把躺着的瓶子带着立起来，谁先立起来谁赢。说来简单，可铁圈一套上，瓶子就跟着打转，总是不肯站直。大家都上去试了试，都说好玩。","en":"The room hung with red lanterns turned out to be a game: hook an iron ring over a beer bottle lying on the floor and pull it upright — first to stand it up wins. Simple enough, except that once the ring is on, the bottle just spins and won't stand. Everyone had a go, and everyone said it was fun."}}],"right":[{"t":"row","p":["p377","p385"]},{"t":"row","p":["p409","p412"],"cap":[null,{"zh":"摇骰子赢交子","en":"Rolling dice for jiaozi"}]},{"t":"photo","p":"p419","r":-1,"w":"74%"}],"cuts":[],"lat":34.808779,"lon":114.3341535},{"id":"i","L":"I","area":"d","kind":"sight","time":"13:18","lat":34.815,"lon":114.3272,"name":{"zh":"开封北站 · 再见开封","en":"Kaifeng North · Goodbye, Kaifeng"},"pinName":{"zh":"← 开封北站","en":"← Kaifeng North Sta."},"lab":{"dx":18,"dy":-8,"a":"start"},"notes":{"zh":"第二天中午退房，打车去开封北站。下一站大同：开封到郑州，再到太原，再到大同，一路换两次车，五六个钟头，是古都走廊最长的一段。","en":"At noon the next day we checked out and took a taxi to Kaifeng North. Next stop, Datong: Kaifeng to Zhengzhou, then Taiyuan, then Datong — two changes and five or six hours, the longest leg of the whole trip."},"left":[{"t":"label","zh":"开封北站","en":"KAIFENG NORTH"},{"t":"notes"},{"t":"photo","p":"p431","r":-1,"w":"80%","cap":{"zh":"最后一个上午，在酒店","en":"The last morning, at the hotel"}}],"right":[{"t":"photo","p":"p434","r":1,"w":"62%","cap":{"zh":"候车，去大同","en":"Waiting for the Datong train"}},{"t":"note","txt":{"zh":"历史教育、商业运营和娱乐体验，完全可以并存，而且可以融合得很好。对小朋友们来说，历史教育不一定只能是严肃讲解和正襟危坐。它也可以很好玩。","en":"History education, commercial operation and entertainment can coexist, and blend very well. For children, learning history doesn't have to mean serious lectures and sitting up straight. It can be great fun."},"by":"dad"},{"t":"tip","txt":{"zh":"这一段坐得久，==带够零食、平板和充电宝==。","en":"It's a long ride: ==bring snacks, tablets and power banks==."}},{"t":"end"}],"cuts":[]}],"voices":[],"vr":0.852,"view":[-133,-10,1400],"days":[{"n":"Day 1","url":"#day1"},{"n":"Day 2","cur":true}]},"G":{"local":" M413.7,340.2 L406.1,346.3 L400.6,351.2 L392.9,360.5 L388.9,367.2 L385.7,372.5 L342.8,461.4 L340.4,467.2 L339.1,471.8 L337.6,477.9 L307.8,610.1 L300.9,640.9 L277.4,755.2 L275.8,762.9 L274.8,767.2 L273.4,774.3 L260.0,839.6 L224.4,1026.7 L222.2,1035.5 L219.6,1042.0 L217.2,1046.4 L208.6,1057.3 L202.6,1063.2 L192.5,1073.0 L188.0,1078.3 L184.8,1083.2 L183.4,1087.2 L182.4,1091.4 L177.6,1140.5 L177.1,1145.3 M192.8,421.7 L162.1,418.6 L153.9,418.3 L153.1,418.3 L78.5,416.2 L73.7,416.0 L70.4,417.7 L65.8,504.4 L65.3,547.6 L65.8,567.6 L69.5,628.7 L69.4,663.8 L69.1,671.8 L69.2,674.1 L70.1,675.7 L75.9,678.3 L105.2,682.8 L115.8,684.4 L106.0,739.2 M276.2,319.2 L275.0,325.5 L256.6,405.0 L255.9,408.2 L203.4,632.3 L176.4,753.1 L153.8,846.2 L152.5,851.6 L129.4,951.6 L102.3,1069.2 L99.4,1082.1 L89.6,1126.5 M526.2,-367.3 L523.7,-353.9 L521.5,-342.6 L516.5,-317.8 L513.4,-302.5 L506.4,-267.7 L501.8,-241.8 L499.1,-228.2 L496.2,-216.3 L492.9,-201.3 L489.5,-190.5 L485.2,-177.2 L480.8,-165.0 L477.9,-156.5 L466.9,-127.7 L457.2,-104.8 L450.0,-89.5 L434.7,-59.7 L403.4,1.2 L376.0,53.2 L344.8,111.8 L330.4,140.8 L320.6,164.2 L316.0,177.1 L311.6,189.6 L305.8,207.5 L278.5,298.0 L277.2,302.5 L276.2,319.2 M276.2,319.2 L285.9,308.5 L287.4,303.7 L288.2,300.9 L315.4,210.5 L321.2,192.9 L325.5,180.5 L330.1,167.9 L339.6,145.0 L353.8,116.4 L384.9,58.0 L412.3,5.8 L443.7,-55.1 L459.0,-85.0 L466.5,-100.6 L476.3,-123.9 L487.4,-152.9 L490.4,-161.4 L494.7,-174.0 L499.1,-187.3 L501.0,-194.2 L502.4,-198.8 L505.8,-214.1 L508.6,-226   <g filter="url(#rw)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${M.minor}" stroke="#c9c1b0" stroke-width="1.6"/><path d="${M.major}" stroke="#9c9383" stroke-width="3"/>
  <path d="${M.route}" stroke="#c4554b" stroke-width="4.5" stroke-dasharray="1 9" /></g>
  <path d="${M.route}" fill="none" stroke="#c4554b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85" filter="url(#rw)"/>`;
  LB.forEach(([p,[lx,ly,a],t],i)=>{const n=i===LB.length-1?'終':(i===0?'起':String(i));
    if(Math.hypot(lx-p[0],ly-p[1])>40)g+=`<path d="M${p[0]},${p[1]} L${lx+(a==='end'?6:a==='start'?-6:0)},${ly-6}" stroke="#3a3530" stroke-width="1" stroke-dasharray="3 3" fill="none"/>`;
    g+=`<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="${i===0||i===LB.length-1?'#3a3530':'#fff'}" stroke="#3a3530" stroke-width="2"/><text x="${p[0]}" y="${p[1]+4.5}" text-anchor="middle" font-family="${ff},cursive" font-size="13" fill="${i===0||i===LB.length-1?'#fff':'#3a3530'}">${n}</text>
    <text x="${lx}" y="${ly}" text-anchor="${a}" font-family="${ff},cursive" font-size="19" fill="#2b2622" paint-order="stroke" stroke="#fbf7ec" stroke-width="5">${T(t)}</text>`});
  g+=`<g transform="translate(${M.W-40} ${M.H-70})" font-family="Architects Daughter,cursive"><circle r="20" fill="none" stroke="#3a3530" stroke-width="2"/><path d="M0 -17 V17 M0 -17 L-6 -4 M0 -17 L6 -4" stroke="#3a3530" stroke-width="2" fill="none"/><text y="-26" text-anchor="middle" font-size="18" fill="#3a3530">N</text></g>
  <text x="${M.W-8}" y="${M.H-8}" text-anchor="end" font-family="${ff},cursive" font-size="17" fill="#6b635a">${LANG==='en'?'about 2.2 km · north in, south out':'约 2.2 km · 北进南出，不走回头路'}</text>
  <text x="6" y="${M.H-8}" font-family="${ff},cursive" font-size="17" fill="#c4554b">${LANG==='en'?'④ Waguriya or Himitsudō: pick the shorter line':'④ 和栗や / 秘密堂 看队伍二选一'}</text></svg>`;
  return `<figure class="rmap"><figcaption>${LANG==='en'?'Our afternoon route':'下午的散步路线'}</figcaption>${g}</figure>`}
 case 'sticker':return `<figure class="stk" style="width:${b.w}"><img src="${IMG['c_'+b.c]}" alt="" style="transform:rotate(${b.r}deg)"><figcaption>${T(b.cap)}</figcaption></figure>`;
 case 'callout':return `<div class="callout"><p>${T(b.txt)}</p></div>`;
 case 'deco':return `<img class="deco-st" src="${IMG['c_'+b.c]}" alt="" style="width:${b.w||'40%'};align-self:${b.a==='l'?'flex-start':b.a==='c'?'center':'flex-end'};--r:${b.r||0}deg;margin-top:${b.mt||0}px;margin-bottom:${b.mb||0}px">`;
 case 'big':return `<div class="big">${b.w}</div>`;
 case 'circles':return `<div class="circles">${b.items.map(([id,c,col])=>`<div class="dot ${col} "><p>${T(c)}</p><img class="cc" src="${IMG[id]}" alt="" loading="lazy"></div>`).join('')}</div>`;
 case 'slip':return `<figure class="slip "><img src="${IMG[b.p]}" alt="" loading="lazy"><figcaption>${T(b.cap)}</figcaption></figure>`;
 case 'film':return `<div class="film ">${b.p.map(id=>`<img src="${IMG[id]}" alt="" loading="lazy">`).join('')}</div>`;
 case 'belt':return `<div class="belt">${b.p.map(id=>`<img src="${IMG[id]}" alt="" loading="lazy">`).join('')}</div>`;
 case 'end':return `<div class="endmark">${T(UI.end)}</div>`;
} return ''}
function buildBook(){
  const VO=(D.voices||[]);const vtxt=v=>T(v.txt).split('\n').map(x=>x.startsWith('- ')?`<p class="hand vli">${md(x.slice(2))}</p>`:/^\d+\. /.test(x)?`<p class="hand vli vnum">${md(x)}</p>`:`<p class="hand">${md(x)}</p>`).join('');
  const BACK=`<button class="backmap" data-back><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>${T(UI.back)}</button>`;
  const vpage=(v,i)=>`<div class="pg vpg"><div class="pghead">${i?BACK:`<span>${D.ui.day}</span>`}<span class="tag vtag"><b>✎</b>${T(v.tag)}</span></div><div class="feelwrap vwrap">${vtxt(v)}</div>${(v.rows||[]).map(r=>block(r,{})).join('')}${v.credit?`<p class="vcredit">${T(v.credit)}</p>`:''}</div>`;
  const voice=pos=>{const vs=VO.filter(v=>v.pos===pos);if(!vs.length)return'';const wide=vs.filter(v=>v.wide).map(v=>`<figure class="vwide"><img src="${IMG[v.wide.p]}" alt=""><figcaption>${T(v.wide.cap)}<small>${T(v.wide.src||'')}</small></figcaption></figure>`).join('');return `<article class="spread vsp" id="sp-his">${vs.map(vpage).join('')}${vs.length===1?'<div class="pg"></div>':''}${wide}</article>`};
  $('#book').innerHTML=voice('start')+PL.map((p,i)=>{const col=p.kind==='food'?'#d9822b':'#24211e',ac=AR[p.area].color,nx=PL[i+1];
    const cut=side=>p.cuts.filter(c=>c.side===side).map(c=>`<img class="cut " src="${IMG['c_'+c.c]}" alt="" style="${c.s}">`).join('');
    return `<article class="spread" id="sp-${p.id}" aria-label="${p.L} ${T(p.name)}">${p.wide?`<figure class="vwide vtop"${p.wide.mx?` style="--wmx:${p.wide.mx}px"`:''}><img src="${IMG[p.wide.p[LANG]||p.wide.p.zh]}" alt="${T(p.wide.cap||'')}">${p.wide.cap?`<figcaption>${T(p.wide.cap)}</figcaption>`:''}</figure>`:''}
     <div class="pg"><div class="pghead"><span>${D.ui.day}</span><span class="tag"><b style="background:${col};box-shadow:0 0 0 3px ${ac}">${p.L}</b>${T(p.name)}</span></div>${blocks(p.left,p)}${cut('left')}</div>
     <div class="pg"><div class="pghead"><button class="backmap" data-back><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>${T(UI.back)}</button><span style="color:${ac}">${T(AR[p.area])}</span></div>${blocks(p.right,p)}${cut('right')}
      ${nx?`<button class="nextp" data-next="${nx.id}">${T(UI.next)} ${nx.L} · ${T(nx.name)}</button>`:''}</div></article>`}).join('')+voice('end');
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>$('#mapsheet').scrollIntoView({behavior:'smooth'}));
  document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>jump(b.dataset.next));
}
function jump(id){const el=$('#sp-'+id);if(!el)return;el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}

/* ---------------- text / language ---------------- */
function renderAll(){
  document.documentElement.lang=LANG==='en'?'en':'zh-CN';
  if(typeof INDEXURL!=='undefined'){const h=$('#t-home');h.href=INDEXURL;h.hidden=false;h.textContent=LANG==='en'?'← All trips':'← 全部旅行'}$('#t-title').textContent=T(UI.title);if(UI.badge)$('#t-badge').textContent=UI.badge;if(UI.maphead)$('#t-maphead').textContent=T(UI.maphead);$('#t-sub').textContent=T(UI.sub);$('#t-dayline').textContent=T(UI.dayline);$('#t-dayno').textContent=UI.day;$('#daynav').innerHTML=(D.days||[]).map(x=>x.url?`<a href="${x.url}" ${x.url.startsWith("#")?"":"target=\"_top\""} ${x.cur?'aria-current="page"':''}>${x.n}</a>`:`<button ${x.cur?'aria-pressed="true"':'disabled'}>${x.n}</button>`).join('');$('#t-hint').textContent=T(UI.hint);
  $('#legend').innerHTML=`<span><i style="background:var(--m)"></i>${T(UI.legendM)}</span><span><i style="background:var(--a)"></i>${T(UI.legendA)}</span><span><i style="background:var(--n)"></i>${T(UI.legendN)}</span><span><b style="background:#24211e">A</b>${T(UI.sight)}</span><span><b style="background:#d9822b">B</b>${T(UI.food)}</span>`;
  $('#chips').innerHTML=`<button class="chip" data-z="all">${T(UI.all)}</button>`+Object.entries(AR).map(([a,o])=>`<button class="chip ${a}" data-z="${a}">${T(o)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>zoomTo(c.dataset.z));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  $('#stops').innerHTML=PL.map(p=>`<button class="stopbtn" data-go="${p.id}"><b style="background:${p.kind==='food'?'#d9822b':'#24211e'};box-shadow:0 0 0 2px ${AR[p.area].color}">${p.L}</b>${T(p.name)}</button>`).join('');
  document.querySelectorAll('.stopbtn').forEach(b=>b.onclick=()=>jump(b.dataset.go));
  $('#tobook').textContent=T(UI.tobook);$('#t-fab').textContent=T(UI.fab);
  const keep={...vb};buildMap();vb=keep;applyVB();buildBook();
}
$('#tobook').onclick=()=>jump(PL[0].id);
$('#fab').onclick=()=>$('#mapsheet').scrollIntoView({behavior:'smooth'});
if('IntersectionObserver' in window){new IntersectionObserver(es=>{{const f=$('#fab');if(f)f.hidden=es[0].isIntersecting}},{threshold:0}).observe($('#mapsheet'))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('walk-lang',LANG)}catch(e){}renderAll()});
renderAll();
if(location.hash.startsWith('#sp-'))setTimeout(()=>jump(location.hash.slice(4)),300);
if(location.hash==='#zm')zoomTo('a');

/* tap a photo to see it large; tap again anywhere to close */
document.addEventListener('click',e=>{const im=e.target.closest('.book figure img');if(!im)return;const d=document.createElement('div');d.className='lbox fit';d.innerHTML=`<img src="${im.src}" alt=""><p>${LANG==='en'?'Tap anywhere to close':'点一下关闭'}</p>`;d.onclick=()=>d.remove();document.body.appendChild(d)});
</script>
