<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>旅行手帐 · 梦之城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{
  /* Layout: full-bleed WebGL diorama; glass UI floats on the edges — brand top-left, directory top-right, toolbar bottom-centre, district card on the right (bottom sheet on phones) */
  --bg-top:#ece7ee; --bg-bot:#d8d0c6;
  --glass:rgba(255,255,255,.74); --glass-line:rgba(40,36,48,.10); --glass-strong:rgba(255,255,255,.92);
  --ink:#24212b; --ink-soft:#6a6473; --accent:#b8402c; --gold:#b98a3c; --chip:rgba(36,33,43,.06);
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-title:"Noto Serif SC","Songti SC","SimSun",serif;
  color-scheme: light;
}
body[data-tod="night"]{
  --glass:rgba(22,26,44,.72); --glass-line:rgba(255,255,255,.10); --glass-strong:rgba(28,33,56,.94);
  --ink:#eef0f8; --ink-soft:#a7accb; --accent:#ff8a6a; --gold:#e8c27a; --chip:rgba(255,255,255,.08);
  color-scheme: dark;
}
body[data-tod="dusk"]{ --glass:rgba(255,246,240,.70); --gold:#a8742c; }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:linear-gradient(var(--bg-top),var(--bg-bot));color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(20,16,30,.18) 100%)}
.glass{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-radius:16px;box-shadow:0 10px 30px rgba(20,16,30,.10)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.label:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* brand */
.brand{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 16px);padding:12px 16px 12px 12px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.seal{width:40px;height:40px;flex:none;border-radius:8px;background:var(--accent);color:#fff;font:700 22px/40px var(--f-title);text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.brand h1{margin:0;font:700 22px/1.1 var(--f-title);letter-spacing:.06em}
.brand p{margin:3px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}

/* directory */
.dir{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);padding:6px;width:228px;max-width:calc(100vw - 32px)}
.dir.collapsed{width:auto}
.dirtoggle{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:500;white-space:nowrap}
.dirtoggle:hover{background:var(--chip)}
.dirtoggle svg{width:16px;height:16px;flex:none}.dirtoggle .chev{margin-left:auto;transition:transform .2s}
.dir:not(.collapsed) .dirtoggle .chev{transform:rotate(180deg)}
.dir.collapsed ul{display:none}
.dir ul{margin-top:4px!important}
.dir ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.dir button{width:100%;display:flex;align-items:center;gap:10px;padding:7px 8px;border:0;border-radius:10px;background:transparent;text-align:left}
.dir button:hover,.dir button[aria-current="true"]{background:var(--chip)}
.dot{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;font:700 13px var(--f-title);color:#fff;background:var(--c,#888)}
.dir .nm{font-weight:500;font-size:14px}
.dir .st{margin-left:auto;font-size:11px;color:var(--ink-soft);white-space:nowrap}

/* toolbar */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar .sep{width:1px;height:22px;background:var(--glass-line);flex:none;margin:0 2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:0;border-radius:10px;background:transparent;font-size:13px;white-space:nowrap;flex:none}
.btn:hover{background:var(--chip)}
a.btn{color:inherit;text-decoration:none}
.btn[aria-pressed="true"]{background:var(--glass-strong);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn.primary[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn svg{width:16px;height:16px;flex:none}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 66px);font-size:11px;letter-spacing:.06em;color:var(--ink-soft);white-space:nowrap;pointer-events:none;transition:opacity .4s}

/* edit banner */
.editbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 16px);padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;max-width:min(640px,calc(100vw - 32px))}
.editbar p{margin:0;font-size:13px;line-height:1.45;min-width:0}
.editbar b{color:var(--accent);font-weight:700}
.editbar .acts{display:flex;gap:6px;flex:none}
.editbar .btn{background:var(--chip)}
.editbar .btn.done{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.label{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:0 4px 14px rgba(20,16,30,.14);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:opacity .25s,transform .2s;will-change:transform}
.label .dot{width:22px;height:22px;border-radius:999px;font-size:12px}
.label small{font-weight:400;color:var(--ink-soft);font-size:11px}
.label.hov{box-shadow:0 0 0 2px var(--gold),0 6px 18px rgba(20,16,30,.2)}
.label.dim{opacity:0;pointer-events:none}
.hot{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;border:0;background:rgba(255,255,255,.95);color:#24212b;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:nowrap}
.hot i{width:18px;height:18px;border-radius:999px;background:#e9b54a;position:relative;flex:none}
.hot i::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid #e9b54a;animation:pulse 1.6s infinite}
@keyframes pulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}

/* card */
.card{position:fixed;right:16px;top:50%;transform:translateY(-50%);width:300px;max-height:calc(100% - 140px);overflow:auto;padding:20px}
.card .close{position:absolute;right:10px;top:10px;width:30px;height:30px;border:0;border-radius:999px;background:var(--chip);font-size:16px;line-height:30px}
.card .eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.card h3{margin:0;font:700 30px/1.15 var(--f-title);letter-spacing:.04em}
.card .en{margin:2px 0 12px;font-size:13px;color:var(--ink-soft)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--chip)}
.pill.st-done{background:#2f7d5b;color:#fff}.pill.st-wip{background:#c98a2b;color:#fff}.pill.st-todo{background:var(--chip)}
.card .line{margin:0 0 14px;font-size:13px;line-height:1.7}
.card .conn{margin:0 0 16px;font-size:12px;line-height:1.6;color:var(--ink-soft);padding:10px 12px;border-radius:10px;background:var(--chip)}
.card .conn b{color:var(--ink);font-weight:500}
.card .open{width:100%;height:42px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:500;font-size:14px}
.card .tip{margin:10px 0 0;font-size:11px;color:var(--ink-soft);text-align:center}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 84px);transform:translateX(-50%) translateY(-8px);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.has-card .dir{display:none}
.fallback{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 32px));padding:20px;display:grid;gap:10px;z-index:5}
.fallback h2{margin:0;font:700 20px var(--f-title)}.fallback p{margin:0 0 4px;font-size:13px;color:var(--ink-soft)}
.fallback a{display:block;padding:12px 14px;border-radius:12px;background:var(--glass-strong);color:var(--ink);text-decoration:none;font-weight:500}
.btn.sea{padding:0 10px;min-width:34px;justify-content:center}
.btn#bMusic[aria-pressed="true"]{color:var(--accent)}
.mpanel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 66px);width:min(360px,calc(100vw - 32px));padding:14px;z-index:4;max-height:60vh;overflow:auto}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mplay{width:44px;height:44px;flex:none;border:0;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center}
.mplay svg{width:20px;height:20px}
.mnow{min-width:0}.mnow small{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:.06em}.mnow b{display:block;font-weight:500;font-size:14px;line-height:1.35}
.mlist{display:grid;gap:2px}
.mlist button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:13px}
.mlist button:hover{background:var(--chip)}
.mlist button[aria-checked="true"]{background:var(--chip);font-weight:500}
.mlist i{width:8px;height:8px;border-radius:999px;border:1.5px solid var(--ink-soft);flex:none}
.mlist button[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}
.mlist span{min-width:0}.mlist small{display:block;color:var(--ink-soft);font-size:11px}
.mcred{margin:10px 2px 0;font-size:10.5px;line-height:1.55;color:var(--ink-soft)}
.mcred a{color:inherit}
body.showing .card{opacity:0;pointer-events:none;transition:opacity .4s}
.loading{position:fixed;inset:0;display:grid;place-items:center;font:500 14px var(--f-ui);color:var(--ink-soft);letter-spacing:.2em;transition:opacity .6s;pointer-events:none}

@media (max-width:760px){
  .brand{padding:8px 12px 8px 8px}.seal{width:32px;height:32px;font-size:18px;line-height:32px}
  .brand h1{font-size:17px}.brand p{font-size:9px}
  .dir{top:calc(env(safe-area-inset-top,0px) + 76px);width:210px}
  .dir .st{display:none}
  .hint{display:none}
  .card{left:16px;right:16px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:none;width:auto;max-height:52%}
  .card h3{font-size:24px}
  .editbar{flex-direction:column;align-items:stretch;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 66px)}
  .editbar .acts{justify-content:flex-end}
  body.has-card .bar{display:none}
}
@media (prefers-reduced-motion:reduce){.hot i::after{animation:none}}
</style>
</head>

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

function cnv(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
function ctex(c, srgb = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; }
