<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>旅行手帐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&family=Shippori+Mincho+B1:wght@800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
@font-face{font-family:"WenKai";src:url(wenkai-index.woff2) format("woff2");font-display:swap}
:root{--desk:#1d1a17;--paper:#fbfaf6;--ink:#24211e;--ink-soft:#6b635a;--a:#c4554b;--yellow:#e6b93a;--cream:#f5edda;
  --f-hand:"WenKai","Kaiti SC","KaiTi",cursive;--f-enhand:"Patrick Hand",cursive;--f-map:"Architects Daughter",cursive;
  --f-ui:"Zen Maru Gothic","PingFang SC","Microsoft YaHei",sans-serif;--f-serif:"Shippori Mincho B1","Songti SC",serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--desk);color:var(--cream);font-family:var(--f-ui);padding:22px 16px 60px;min-height:100vh;
  background-image:radial-gradient(ellipse at 50% 0%,#2b2621 0%,#1d1a17 55%,#151311 100%)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:34px}
.top h1{margin:0;font-family:var(--f-hand);font-weight:700;font-size:clamp(30px,5vw,46px);letter-spacing:.12em;line-height:1.1}
html[lang="en"] .top h1{font-family:var(--f-enhand);letter-spacing:.04em}
.top p{margin:6px 0 0;font-family:var(--f-map);font-size:14px;letter-spacing:.16em;color:#b7ab95}
.lang{display:flex;border:1.5px solid var(--cream);border-radius:20px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 12px;font-size:13px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:34px 30px}
.card{position:relative;display:block;background:var(--paper);color:var(--ink);text-decoration:none;padding:16px 16px 20px;
  box-shadow:0 22px 50px #000a;transform:rotate(var(--r,-.6deg));transition:none}
.card:hover .days a.go{background:var(--a);border-color:var(--a)}
.card .ph{background:#fff;padding:8px 8px 10px;box-shadow:0 5px 14px #0003;transform:rotate(1deg)}
.card .ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.badge{position:absolute;right:14px;top:-16px;width:58px;height:58px;border-radius:50%;background:var(--a);color:var(--cream);
  display:grid;place-items:center;font-family:var(--f-serif);font-weight:800;font-size:24px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--a);z-index:2}
.card h2{margin:16px 0 2px;font-family:var(--f-hand);font-size:28px;letter-spacing:.06em}
html[lang="en"] .card h2{font-family:var(--f-enhand);font-size:30px;letter-spacing:0}
.card .sub{font-family:var(--f-map);font-size:13px;letter-spacing:.14em;color:var(--ink-soft)}
.card .line{margin:10px 0 0;font-family:var(--f-hand);font-size:17px;line-height:1.6;color:#3a3530}
html[lang="en"] .card .line{font-family:var(--f-enhand);font-size:18px}
.days{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.days a{border:1.5px solid var(--ink);border-radius:14px;padding:2px 11px;font-family:var(--f-map);font-size:14px;color:var(--ink);text-decoration:none;background:#fff}
.days a:hover{background:var(--yellow)}
.days a.go{margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink);border-radius:14px;padding:3px 12px;font-size:13px;font-weight:700;letter-spacing:.06em}
.soon{background:transparent;border:2px dashed #6b6155;color:#b7ab95;box-shadow:none;display:grid;place-items:center;min-height:300px;text-align:center}
.soon .badge{background:#3a342e;box-shadow:0 0 0 3px var(--desk),0 0 0 5px #6b6155;color:#b7ab95}
.soon h2{color:var(--cream)}
.soon .sub{color:#b7ab95}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<header class="top"><div><h1 id="t1"></h1><p id="t2"></p></div>
<div class="lang" role="group" aria-label="Language"><button data-l="zh">中</button><button data-l="en">EN</button></div></header>
<main class="grid" id="grid"></main>
</div>
<script>
const C={"title": {"zh": "旅行手帐", "en": "Travel Journals"}, "sub": {"zh": "走过的城市", "en": "CITIES WE'VE WALKED"}, "trips": [{"slug": "tokyo-2026", "badge": "東", "title": {"zh": "东京散步手帐", "en": "Tokyo Walk Journal"}, "sub": {"zh": "TOKYO · 夏 · 4 天", "en": "TOKYO · SUMMER · 4 DAYS"}, "line": {"zh": "浅草 · 筑地 · 谷根千 · 涩谷 · 表参道 · 丸之内", "en": "Asakusa · Tsukiji · Yanesen · Shibuya · Omotesandō · Marunouchi"}, "cover": "tokyo-2026/img/p063.webp", "days": 4}, {"slug": "xian-2026", "badge": "長", "title": {"zh": "古都走廊 · 西安", "en": "Ancient Capitals · Xi'an"}, "sub": {"zh": "XI'AN · 夏 · 4 天", "en": "XI'AN · SUMMER · 4 DAYS"}, "line": {"zh": "永兴坊 · 城墙 · 大雁塔 · 碑林 · 赳赳大秦 · 兵马俑", "en": "Yongxingfang · City Wall · Wild Goose Pagoda · Stele Forest · Mighty Qin · Terracotta Army"}, "cover": "xian-2026/img/p169.webp", "days": 4}]};
let LANG='zh';try{LANG=localStorage.getItem('walk-lang')||'zh'}catch(e){}
const T=o=>o?(o[LANG]??o.zh??''):'';
function render(){
  document.documentElement.lang=LANG==='en'?'en':'zh-CN';
  document.getElementById('t1').textContent=T(C.title);document.getElementById('t2').textContent=T(C.sub);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  document.getElementById('grid').innerHTML=C.trips.map((t,i)=>{
    const r=(i%2?.7:-.6);
    if(t.status==='soon')return `<div class="card soon" style="--r:${r}deg"><div class="badge">${t.badge||''}</div><div><h2>${T(t.title)}</h2><div class="sub">${LANG==='en'?'IN THE MAKING':'制作中'}</div></div></div>`;
    const days=Array.from({length:t.days||0},(_,k)=>`<a href="${t.slug}/#day${k+1}">Day ${k+1}</a>`).join('');
    return `<article class="card" style="--r:${r}deg"><div class="badge">${t.badge||''}</div>
      <a href="${t.slug}/" style="color:inherit;text-decoration:none"><div class="ph"><img src="${t.cover}" alt=""></div>
      <h2>${T(t.title)}</h2><div class="sub">${T(t.sub)}</div>${t.line?`<p class="line">${T(t.line).split(' · ').map(s=>`<span style="white-space:nowrap">${s}</span>`).join(' · ')}</p>`:''}</a>
      <div class="days">${days}<a class="go" href="${t.slug}/">${LANG==='en'?'Open →':'翻开 →'}</a></div></article>`}).join('');
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('walk-lang',LANG)}catch(e){}render()});
render();
</script>
</body></html>
