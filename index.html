<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#202d40"><meta name="description" content="把旅行记忆拼成一个可以探索的小世界"><title>温蒂的无何有之乡 · Wendy’s Neverland</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./neverland/style.css"><script type="importmap">{"imports":{"three":"./neverland/vendor/three.module.js"}}</script></head>
<body><main id="app"><div id="stage"></div><div class="grain" aria-hidden="true"></div>
<header><a class="brand" href="./"><span class="mark">W<span>✦</span></span><span class="brand-text"><span id="brandName">温蒂的无何有之乡</span><small id="brandSub">WENDY’S NEVERLAND</small></span></a><nav class="world-tools" aria-label="地图操作"><button id="returnMap" hidden>← 返回地图</button><button id="overview">全景 ↗</button><button id="editLayout" aria-pressed="false">调整布局</button></nav></header>
<section class="intro"><p class="eyebrow"><span></span> THE PLACES WE KEEP</p><h1>把回忆，<em>拼成世界</em></h1><p class="verse">每一座城市，都藏着我们一起走过的时光</p></section>
<div id="mapLabels" aria-label="选择旅行城市"></div><div id="loading"><span class="load-ring"></span><p>正在搭建我们的世界…</p></div>
<div id="editActions" hidden><span>移动选中的城市</span><div class="move-buttons"><button data-move="-1,0" aria-label="向左移动">←</button><button data-move="0,-1" aria-label="向后移动">↑</button><button data-move="0,1" aria-label="向前移动">↓</button><button data-move="1,0" aria-label="向右移动">→</button></div><button id="rotateTile">旋转 90°</button><button id="resetLayout">重置布局</button></div>
<nav id="xianViews" class="detail-views" aria-label="西安细节视角" hidden><button data-shot="all" aria-pressed="true">长安全景</button><button data-shot="pagoda">大雁塔</button><button data-shot="pit">兵马俑</button><button data-shot="wall">城墙</button></nav>
<section class="performance-control" aria-label="这座城市的小互动"><div class="selected-caption"><div><b id="selectedName">开封</b><span id="selectedPlace">虹桥 · 打铁花</span></div><button id="resetView">重置视角 ↗</button></div><p id="showStatus" aria-live="polite"></p><button id="ironFlower" data-state="idle"><span class="flower-icon" aria-hidden="true">✦</span><span id="showLabel">一起看打铁花</span><span class="duration">7 秒</span></button><button id="wallWalk" hidden>在城墙上散步 · 8 秒</button><button id="stopShow" hidden>结束这次互动</button><a id="journalLink" hidden>翻开这座城市的旅行手账 ↗</a></section>
<footer><span class="rail-symbol" aria-hidden="true">● ── ●</span><p id="hint" aria-live="polite">点击城市放大 · 拖动旋转 · 调整城市位置，列车跟着改道</p><small>6 座城市 · 一张属于我们的地图</small></footer>
<aside id="error" hidden><h2>小世界暂时没有加载成功</h2><p>请刷新页面，再试一次</p><button onclick="location.reload()">重新加载</button></aside>
</main><script type="module" src="./neverland/main.mjs"></script></body></html>
