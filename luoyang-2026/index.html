<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>古都走廊 · 洛阳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;700&family=Patrick+Hand&family=Courier+Prime&family=Long+Cang&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&family=Long+Cang&family=Noto+Serif+SC:wght@600&display=swap">
<style>
@font-face{font-family:"WenKai";src:url(wenkai.woff2) format("woff2");font-display:swap}
/* Layout: one big hand-drawn day map (three colored routes, pan/zoom) → a stack of journal spreads, one per stop, in the white-paper scrapbook style. */
:root{
  --desk:#1d1a17; --paper:#fbfaf6; --ink:#24211e; --ink-soft:#6b635a;
  --m:#2f7fb0; --a:#c4554b; --n:#6a4c9c; --food:#d9822b;
  --mark:#f6e48a; --green:#3d7a4a; --yellow:#e6b93a; --kraft:#6d4d3a; --cream:#f5edda;
  --f-hand:"WenKai","Kaiti SC","KaiTi",cursive;
  --f-enhand:"Patrick Hand","Comic Sans MS",cursive;
  --f-map:"Architects Daughter","Caveat",cursive;
  --f-ui:"Zen Maru Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  --f-type:"Courier Prime","Courier New",monospace;
  --f-serif:"Shippori Mincho B1","Songti SC",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--cream);font-family:var(--f-ui);padding:18px 16px 70px;
  background-image:radial-gradient(ellipse at 50% 0%,#2b2621 0%,#1d1a17 55%,#151311 100%)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto}
html[lang="en"] .hand{font-family:var(--f-enhand);font-size:1.2em;line-height:1.5}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand .badge{width:50px;height:50px;border-radius:50%;background:var(--a);color:var(--cream);display:grid;place-items:center;font-family:var(--f-serif);font-weight:800;font-size:20px;box-shadow:0 0 0 3px var(--desk),0 0 0 5px var(--a)}
.brand h1{margin:0;font-weight:900;font-size:clamp(22px,4vw,34px);letter-spacing:.1em;line-height:1.1}
.brand p{margin:3px 0 0;font-family:var(--f-map);font-size:13px;letter-spacing:.14em;color:#b7ab95}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.days{display:flex;gap:6px}
.days button,.days a{border:1.5px solid #6b6155;background:none;padding:5px 11px;font-family:var(--f-map);font-size:15px;color:#b7ab95;text-decoration:none}.days a:hover{border-color:var(--yellow);color:var(--yellow)}
.days button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.days button[disabled]{opacity:.4;cursor:not-allowed}
.homelink{border:1.5px solid #6b6155;padding:5px 11px;font-family:var(--f-map);font-size:15px;color:#b7ab95;text-decoration:none;white-space:nowrap}.homelink:hover{border-color:var(--yellow);color:var(--yellow)}
.lang{display:flex;border:1.5px solid var(--cream);border-radius:20px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 12px;font-size:13px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}

/* ---------- map sheet ---------- */
.sheet{background:#efeee9;color:var(--ink);border-radius:3px;padding:16px clamp(10px,2vw,22px) 18px;box-shadow:0 28px 60px #000a;position:relative;
  background-image:linear-gradient(90deg,#0000 49.7%,#0000000c 50%,#ffffff60 50.2%,#0000 50.6%),linear-gradient(180deg,#0000 49.7%,#0000000a 50%,#ffffff50 50.2%,#0000 50.6%)}
.sheethead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 18px;margin-bottom:10px}
.sheethead h2{margin:0;font-family:var(--f-map);font-weight:400;font-size:clamp(24px,3.4vw,36px);letter-spacing:.03em;line-height:1}
.sheethead h2 small{display:block;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--ink-soft);margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:26px;height:5px;border-radius:3px}
.legend b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;color:#fff;font-size:10px;font-family:var(--f-map)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:2px solid var(--ink);background:#fff;padding:4px 12px;border-radius:18px;font-size:13px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.m{border-color:var(--m)}.chip.a{border-color:var(--a)}.chip.n{border-color:var(--n)}
.chip.m[aria-pressed="true"]{background:var(--m)}.chip.a[aria-pressed="true"]{background:var(--a)}.chip.n[aria-pressed="true"]{background:var(--n)}
.mapbox{position:relative;border:2px solid #8e897f;background:#e6e5df;overflow:hidden;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.mapbox svg{display:block;width:100%;height:auto;cursor:grab}
.mapbox svg:active{cursor:grabbing}
.zoombtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombtns button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:20px;font-weight:900;line-height:1}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--ink-soft)}
.pin{cursor:pointer}
.pin:focus{outline:none}
#map .deco{transition:opacity .35s}
.pin:focus .ring,.pin:hover .ring{stroke:var(--yellow);stroke-width:5}

/* ---------- spreads ---------- */
.book{margin-top:44px;display:flex;flex-direction:column;gap:46px}
.spread{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:3px;box-shadow:0 26px 60px #000a;position:relative;scroll-margin-top:16px;color:var(--ink)}
.spread::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:60px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,#0000,#00000010 40%,#00000028 50%,#00000010 60%,#0000)}
.pg{position:relative;min-width:0;padding:26px 38px 34px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.pghead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-map);font-size:19px}
.pghead .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:900;font-size:15px;letter-spacing:.06em}
.pghead .tag b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-family:var(--f-map);font-size:14px}
.notes{background:#fff;border:1px solid #d9d4c8;padding:10px 14px 12px;position:relative;font-family:var(--f-hand);font-size:16.5px;line-height:1.7;color:#3a3530;max-width:36em;box-shadow:2px 2px 0 #0000000d;z-index:2}
.notes::before{content:attr(data-tag);position:absolute;top:-10px;left:12px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.14em;padding:1px 8px}
html[lang="en"] .notes{font-family:var(--f-enhand);font-size:17.5px;line-height:1.5}
.hand{font-family:var(--f-hand);font-size:21px;line-height:1.62;margin:0;max-width:34em;position:relative;z-index:2}
.feelwrap{position:relative;z-index:2}
.deco-st{display:block;max-width:280px;transform:rotate(var(--r));filter:drop-shadow(0 3px 5px #0003);position:relative;z-index:4;pointer-events:none}
@media (max-width:760px){.deco-st{max-width:170px}}
.deco-wrap{position:relative;z-index:4;max-width:230px;shape-image-threshold:.35;shape-margin:8px;transform:rotate(var(--r));filter:drop-shadow(0 3px 5px #0003);pointer-events:none}
.deco-wrap.right{float:right;margin:0 -6px 4px 10px}.deco-wrap.left{float:left;margin:0 10px 4px -6px}
[data-wrap]{display:flow-root}
@media (max-width:760px){.deco-wrap{max-width:150px}}

.callout{position:relative;align-self:center;margin:8px 0 18px;padding:16px 26px;background:#fff;border:2px solid var(--ink);border-radius:26px;transform:rotate(-2deg);box-shadow:4px 4px 0 #24211e22;max-width:88%}
.callout::after{content:"";position:absolute;left:38px;bottom:-14px;width:22px;height:22px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.callout p{margin:0;font-family:var(--f-hand);font-size:24px;line-height:1.4;color:var(--a)}
html[lang="en"] .callout p{font-family:var(--f-enhand);font-size:26px}
.vcredit{margin:-6px 0 0;font-size:11px;color:#9a8f84;text-align:right}
.vwide{grid-column:1/-1;margin:0;padding:6px 38px 34px;position:relative;z-index:30;background:var(--paper)}.vwide img{display:block;width:100%;height:auto;border:8px solid #fff;box-shadow:0 6px 16px #0003}.vwide figcaption{font-family:var(--f-hand);font-size:16px;color:#2f3f63;margin-top:8px}.vwide figcaption small{display:block;font-family:var(--f-ui);font-size:11px;color:#9a8f84;margin-top:2px}@media (max-width:760px){.vwide{padding:6px 12px 24px}}
.vtag b{background:#34405a;box-shadow:0 0 0 3px #c9d3e6}
.vwrap .hand{color:#2f3f63}
.vwrap .hand+.hand{margin-top:.55em}
.vli{padding-left:1.1em;text-indent:-1.1em}.vli:not(.vnum)::before{content:"· "}.vnum{padding-left:1.35em;text-indent:-1.35em}
.vwrap .vli+.vli{margin-top:.3em}
.lettersp::before,.lettersp::after{display:none!important}.lettersp{grid-template-columns:1fr;background:transparent;box-shadow:none;padding:6px 0}.lettersp+.lettersp .letter{transform:rotate(.5deg)}
.letter{--blue:#34405a;position:relative;max-width:760px;margin:0 auto;background:#efe4cc;background-image:radial-gradient(#0000 60%,#b8955a22),linear-gradient(#ffffff18,#ffffff18);padding:34px 48px 34px;box-shadow:0 18px 40px #0008,inset 0 0 0 1px #d9c8a4;border-radius:2px;transform:rotate(-.6deg);color:var(--blue)}
.letter::before{content:"";position:absolute;inset:12px;border:1px solid #c8b38a;pointer-events:none}
.letter::after{content:"";position:absolute;top:-12px;left:50%;width:110px;height:26px;transform:translateX(-50%) rotate(2deg);background:#d7c8a6cc}
.ltag{font-family:var(--f-map);font-size:14px;letter-spacing:.08em;color:#8a6a3a;border-bottom:1.5px solid #8a6a3a;display:inline-block;margin-bottom:12px}
.lt{font-family:var(--f-hand);font-size:20px;line-height:1.75;margin:0;color:var(--blue)}
.lt+.lt{margin-top:.5em}
.lt.li{padding-left:1.2em;text-indent:-1.2em}.lt.li:not(.num)::before{content:"· ";}.lt.num{padding-left:1.4em;text-indent:-1.4em}
.lt.li+.lt.li{margin-top:.25em}
html[lang="en"] .lt{font-family:var(--f-enhand);font-size:23px;line-height:1.5}
@media (max-width:760px){.letter{padding:26px 22px;transform:none}.lt{font-size:18px}html[lang="en"] .lt{font-size:21px}}

.feelwrap .ft{font-family:var(--f-map);font-size:14px;color:var(--a);letter-spacing:.06em}
mark{background:linear-gradient(100deg,#0000 1%,var(--mark) 3%,var(--mark) 97%,#0000 99%) no-repeat 0 60%/100% 72%;color:inherit;padding:0 .1em}
.row{display:grid;gap:6px;position:relative;z-index:1}
.row figure,.wall figure{margin:0;overflow:hidden;position:relative;background:#ddd}
.row figure{aspect-ratio:var(--ar,4/3)}
.row img{object-position:center 30%}
.row img,.wall img{width:100%;height:100%;object-fit:cover;display:block}
.photo{margin:0;align-self:center;width:88%;background:#fff;padding:8px;box-shadow:0 6px 16px #0003;position:relative;z-index:1}
.photo img{display:block;width:100%;max-height:420px;object-fit:cover}
.pcap{font-family:var(--f-hand);font-size:15px;color:#4a4038;padding:8px 2px 0;line-height:1.45}.credit{position:absolute;right:14px;top:14px;background:#fffdf7e6;color:#5a4f45;font-family:var(--f-enhand);font-size:13px;padding:1px 7px;border-radius:3px;transform:rotate(1.5deg);box-shadow:0 1px 3px #0002}.pcap small{display:block;font-family:var(--f-ui,sans-serif);font-size:10.5px;color:#9a8f84;margin-top:2px}
.wall{display:grid;gap:5px}
.wall figure{aspect-ratio:1}
.wall figcaption,.row figcaption{position:absolute;left:5px;right:5px;bottom:3px;font-family:var(--f-hand);font-size:15px;color:#fff;text-shadow:0 1px 3px #000d;line-height:1.2}
html[lang="en"] .wall figcaption{font-family:var(--f-enhand);font-size:17px}
.pghead{position:relative;z-index:6}
.cut{position:absolute;z-index:4;filter:drop-shadow(0 4px 6px #0003);pointer-events:none;transform:rotate(var(--r,0deg))}
.sketch{width:70%;align-self:flex-end;opacity:.9;mix-blend-mode:multiply}
.big{font-family:var(--f-serif);font-weight:800;font-size:clamp(48px,7vw,86px);line-height:.9;color:var(--green);letter-spacing:.01em;margin-top:auto}
/* station sign */
.ekimei{align-self:flex-start;width:min(300px,78%);background:#fff;border:1.5px solid var(--ink);box-shadow:3px 3px 0 #0000001c;position:relative;z-index:2;transform:rotate(-1.5deg)}
.em-main{text-align:center;padding:8px 10px 4px}
.em-main small{display:block;font-size:13px;letter-spacing:.4em;color:#555}
.em-main b{display:block;font-size:40px;font-weight:900;letter-spacing:.2em;line-height:1.1}
.em-main i{display:block;font-style:normal;font-family:var(--f-map);font-size:15px;letter-spacing:.1em}
.em-num{position:absolute;left:10px;top:12px;width:44px;height:44px;border:4px solid var(--line);border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:16px;line-height:.9;text-align:center}
.em-num span{display:block;font-size:11px}
.em-bar{display:flex;justify-content:space-between;gap:6px;background:var(--line);color:#fff;font-size:10.5px;padding:3px 8px;font-weight:700}
.ekimei.metro{--line:#9a9a92}.ekimei.metro .em-num{border-radius:50%}
.ekimei.jr{--line:#80c241}
.label{align-self:flex-start;background:var(--kraft);color:var(--cream);font-family:var(--f-serif);font-weight:800;font-size:26px;letter-spacing:.12em;padding:8px 16px;line-height:1.15;transform:rotate(-1deg);box-shadow:3px 3px 0 #0000001c;position:relative;z-index:2}
.label small{display:block;font-family:var(--f-map);font-weight:400;font-size:12px;letter-spacing:.14em}
.stamp{align-self:flex-start;width:122px;height:122px;border-radius:50%;border:3px solid #c0453d;color:#c0453d;display:grid;place-items:center;text-align:center;transform:rotate(-10deg);mix-blend-mode:multiply;position:relative;z-index:2}
.stamp::before{content:"";position:absolute;inset:6px;border:1.5px solid #c0453d;border-radius:50%}
.stamp b{display:block;font-family:var(--f-serif);font-size:32px;line-height:1}
.stamp small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;max-width:84px}
.match{align-self:flex-start;width:178px;height:110px;background:var(--a);color:var(--cream);border:5px solid var(--cream);outline:2px solid var(--a);transform:rotate(-4deg);display:grid;place-items:center;text-align:center;box-shadow:0 5px 10px #0003;position:relative;z-index:2}
.match b{display:block;font-weight:900;font-size:22px;letter-spacing:.08em}
.match small{display:block;font-family:var(--f-serif);font-size:11px;letter-spacing:.04em;margin-top:3px}
.price{align-self:flex-start;background:#fff8d9;border:1.5px dashed var(--ink);padding:4px 14px 4px 22px;font-family:var(--f-map);font-size:18px;transform:rotate(3deg);position:relative;z-index:2;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.price b{font-family:var(--f-ui);font-size:20px;margin-left:8px}
.circles{position:relative;height:600px}
.circles .dot{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;padding:13%}
.circles .dot.g{background:var(--green);color:#fffbe8}.circles .dot.y{background:var(--yellow);color:var(--ink)}
.circles .dot:nth-child(1){left:0;top:0}.circles .dot:nth-child(2){right:0;top:30%}.circles .dot:nth-child(3){left:4%;top:60%}
.circles .dot p{margin:0;font-family:var(--f-hand);font-size:27px;line-height:1.25;text-align:center;position:relative;z-index:1}
html[lang="en"] .circles .dot p{font-family:var(--f-enhand);font-size:24px}
.circles .cc{position:absolute;z-index:3;width:40%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid var(--paper);box-shadow:0 4px 8px #0003}
.circles .dot:nth-child(1) .cc{right:-20%;top:-2%}.circles .dot:nth-child(2) .cc{right:-8%;bottom:-18%}.circles .dot:nth-child(3) .cc{right:-34%;bottom:4%}
.slip{align-self:flex-end;width:44%;margin:0;background:#fff;padding:6px 6px 24px;box-shadow:0 4px 10px #0003;transform:rotate(4deg);position:relative;z-index:3}
.slip img{display:block;width:100%}
.slip figcaption{position:absolute;bottom:3px;left:8px;font-family:var(--f-hand);font-size:15px}
.film{background:#191714;padding:16px 38px;margin:0 -38px;position:relative;display:flex;gap:6px;overflow:hidden}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:9px;background:repeating-linear-gradient(90deg,#0000 0 7px,#e9e2cf 7px 15px,#0000 15px 22px)}
.film::before{top:3px}.film::after{bottom:3px}
.film img{height:150px;width:auto;flex:none;display:block}
.belt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;background:repeating-linear-gradient(90deg,#c9c3b6 0 2px,#ddd7ca 2px 26px);border-radius:12px;border:3px solid #9a9184}
.belt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 6px #0003;display:block}
.endmark{font-family:var(--f-map);font-size:22px;text-align:center;margin-top:auto;color:var(--ink-soft)}
.nextp{align-self:flex-end;margin-top:auto;background:var(--paper);border:0;box-shadow:0 0 0 6px var(--paper);border-bottom:1.5px solid var(--a);color:var(--a);font-weight:700;font-size:13px;padding:2px 0;position:relative;z-index:6}
.draft{font-size:12px;color:#8a8278;margin:0}

@media (max-width:860px){
  .spread{grid-template-columns:1fr}
  .spread::after{display:none}
  .pg{padding:20px 18px 26px}
  .film{margin:0 -18px;padding:14px 18px}
  .film img{height:104px}
  .circles{height:auto;display:flex;flex-direction:column}
  .circles .dot{position:relative;left:auto!important;right:auto!important;top:auto!important;width:74%}
  .circles .dot:nth-child(2){align-self:flex-end;margin-top:-12%}
  .circles .dot:nth-child(3){margin-top:-12%}
  .hand{font-size:19px}
  .photo{width:100%}
}

.stops{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.stopbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid #cfc9bd;border-radius:20px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700;color:var(--ink)}
.stopbtn b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-family:var(--f-map);font-size:13px}
.stopbtn:hover{border-color:var(--ink)}
.tobook{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:12px;background:var(--ink);color:#fff;border:0;border-radius:6px;font-weight:900;font-size:15px;letter-spacing:.1em}
.backmap{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:5px 12px 5px 9px;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.06em}
.backmap:hover{background:var(--a)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:26px;padding:10px 16px 10px 12px;font-weight:900;font-size:15px;letter-spacing:.06em;box-shadow:0 6px 16px #0007}
.fab:hover{background:#f1cb55}

.feelwrap .hand+.hand{margin-top:.55em}
.duo{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start}
.duo .photo{width:100%;margin:0}
.duo .photo img{max-height:330px}

const INDEXURL='../';const ALL={"1":{"D":{"ui":{"title":{"zh":"古都走廊 · 洛阳","en":"Ancient Capitals · Luoyang"},"sub":{"zh":"LUOYANG · 神都","en":"LUOYANG · THE DIVINE CAPITAL"},"dayline":{"zh":"水席 · 白马寺 · 十字街夜市","en":"Water Banquet · White Horse Temple · Night Market"},"legendM":{"zh":"中午","en":"Midday"},"legendA":{"zh":"下午","en":"Afternoon"},"legendN":{"zh":"晚上","en":"Evening"},"sight":{"zh":"名所","en":"Sights"},"food":{"zh":"吃的","en":"Food"},"all":{"zh":"全图","en":"Whole map"},"hint":{"zh":"点圆点或下面的地名翻到那一页。缩放：按钮、双指，或 Ctrl/⌘ + 滚轮；电脑上可拖动地图。单指上下滑照常翻页。","en":"Tap a pin, or a name below, to turn to its page. Zoom with the buttons, a two-finger pinch, or Ctrl/⌘ + scroll; on a computer, drag to pan. A one-finger swipe simply scrolls the page."},"back":{"zh":"回地图","en":"Back to map"},"notesTag":{"zh":"小知识","en":"Background"},"feelTag":{"zh":"攻略","en":"Tips"},"dayTag":{"zh":"那天","en":"That day"},"next":{"zh":"下一页 →","en":"Next →"},"home":{"zh":"酒店","en":"Hotel"},"end":{"zh":"— Day 1 · 完 —","en":"— end of Day 1 —"},"fab":{"zh":"回地图","en":"Map"},"tobook":{"zh":"往下看这一天的手账 ↓","en":"Read the day's journal ↓"},"day":"Day 1","badge":"洛","maphead":{"zh":"City Walk","en":"City Walk"}},"areas":{"m":{"color":"#3d6f8f","zh":"中午 · 到洛阳，吃水席","en":"Midday · Arrival & Water Banquet","box":[379,529,160]},"a":{"color":"#b3261e","zh":"下午 · 白马寺","en":"Afternoon · White Horse Temple","box":[1190,184,160]},"n":{"color":"#5b4a7a","zh":"晚上 · 十字街夜市","en":"Evening · Shizi Street Night Market","box":[384,508,183]}},"home":[34.6736,112.4656],"hops":[{"from":"a","to":"b","q":[860,300],"t":[760,350,-22],"fs":24,"txt":{"zh":"打车往东约 12 公里","en":"taxi, 12 km east"}},{"from":"c","to":"home","q":[900,640],"t":[820,590,-24],"fs":24,"txt":{"zh":"打车回酒店","en":"taxi back to the hotel"}}],"places":[{"id":"a","L":"A","area":"m","kind":"food","time":"14:17","name":{"zh":"到洛阳 · 杏花村水席","en":"Arriving · Xinghuacun Water Banquet"},"pinName":{"zh":"杏花村水席","en":"Water Banquet"},"lab":{"dx":-18,"dy":-14,"a":"end"},"wide":{"p":{"zh":"p3001","en":"p3002"},"mx":620,"cap":{"zh":"根据我们行前做的背景资料整理 · 点图放大","en":"From the background notes we made before the trip · tap to enlarge"}},"notes":{"zh":"从西安坐高铁一个半小时，就到了古都走廊的第二站。洛阳和西安是一对老搭档：长安是西京，洛阳是东都，唐朝的皇帝常常在两边来回住。武则天更偏爱洛阳，把它改名叫「神都」。到洛阳的第一顿，吃的是洛阳最有名的一桌菜——水席。店叫杏花村，据说是因为当年门口种着一棵杏花树。","en":"An hour and a half on the fast train from Xi'an brought us to the second stop on the corridor. Luoyang and Xi'an are an old pair: Chang'an was the Western Capital, Luoyang the Eastern, and Tang emperors often moved between the two. Empress Wu liked Luoyang best and renamed it the Divine Capital. Our first meal here was the city's most famous spread, the Water Banquet, at a restaurant called Xinghuacun — 'apricot-blossom village' — said to be named for an apricot tree that once stood by its door."},"left":[{"t":"label","zh":"洛阳水席","en":"WATER BANQUET · 洛阳水席"},{"c":"shuixi","w":"42%","r":-2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"note","txt":{"zh":"西安瞬移到洛阳。第二个千年古都怎么都得来一趟吧。它在13个朝代中当了超过1500年的首都——比西安还久。","en":"Teleported from Xi'an to Luoyang. A second thousand-year capital — we had to come. It served as capital for thirteen dynasties and more than 1,500 years, longer even than Xi'an."}},{"t":"note","txt":{"zh":"继续带小孩们古都之行，第二站洛阳。今天才从父母那知道，我小时候那次西安/洛阳/开封之行，正好是在我10岁的时候——跟哥哥现在一样大。28年后再走这一线，真正是人生的循环啊。","en":"On with the kids' tour of the old capitals: stop two, Luoyang. Only today did my parents tell me that my own childhood trip to Xi'an, Luoyang and Kaifeng happened when I was ten — exactly the age our older boy is now. Twenty-eight years later I'm walking the same line again. Life really does come full circle."},"by":"dad"},{"t":"kbox","title":{"zh":"小知识 · 为什么叫「水席」","en":"Field notes · why 'water' banquet"},"intro":{"zh":"一桌菜，两个「水」。","en":"One feast, two kinds of water."},"rows":[{"h":{"zh":"汤汤水水","en":"Soup in everything"},"t":{"zh":"洛阳四面环山，气候干燥，当地人爱喝汤，所以水席里大多数菜都带汤。","en":"Luoyang sits in a ring of hills and the air is dry, so people love soup — most dishes in the banquet come in broth."}},{"h":{"zh":"像流水一样上菜","en":"Dishes that flow"},"t":{"zh":"吃完一道撤一道，再上一道，一道接一道像流水，老洛阳人叫它「滴溜水儿席」。整桌一共 24 道：8 道凉菜、16 道热菜。","en":"One dish is cleared, the next arrives, like running water — old Luoyang folk call it the 'trickling-water banquet'. A full table has 24 dishes: 8 cold and 16 hot."}},{"h":{"zh":"牡丹燕菜","en":"Peony 'bird's nest'"},"t":{"zh":"燕菜本来要用燕窝，洛阳人却用最便宜的萝卜：切得像头发丝一样细，拌粉蒸过，吃起来有燕窝汤的味道。1973 年秋天，周恩来陪加拿大总理特鲁多来洛阳，厨师用蛋黄蒸糕雕了一朵牡丹浮在汤上。周总理说：「洛阳牡丹甲天下，菜中也能生出牡丹花。」从此它就叫牡丹燕菜。","en":"Bird's-nest soup should be made with bird's nest. Luoyang uses the humblest radish instead, cut as fine as hair, dusted with flour and steamed until it tastes like the real thing. In autumn 1973 Zhou Enlai brought Canada's Prime Minister Pierre Trudeau here, and the chef floated a peony carved from steamed egg yolk on top. 'Luoyang's peonies are the finest under heaven,' Zhou said, 'and now a peony grows in a dish.' It has been Peony Yancai ever since."}},{"h":{"zh":"压轴的五谷丰登","en":"Five Grains to finish"},"t":{"zh":"最后上桌的主食叫「五谷丰登」：一笼蒸红薯、山药、白玉米、黑玉米和大枣。五谷杂粮一端上来，这桌水席就到头了。","en":"The last course, the staple, is called 'Five Grains, Good Harvest': a steamer of sweet potato, yam, white and black corn, and red dates. When it arrives, the banquet is done."}}]},{"t":"photo","p":"p001","r":-1,"w":"50%","cap":{"zh":"高铁窗外，往洛阳去","en":"From the train window, on the way to Luoyang"}},{"t":"photo","p":"p377","r":-1,"w":"78%"},{"t":"note","txt":{"zh":"百年老店杏花村的洛阳水席还挺好吃的，很有特色。","en":"The Luoyang water banquet at Xinghuacun, a century-old restaurant, was really good — very distinctive."}}],"right":[{"t":"photo","p":"p026","r":1,"w":"90%","cap":{"zh":"杏花村水席旗舰店","en":"Xinghuacun Water Banquet"}},{"t":"row","p":["p009","p021"],"cap":[{"zh":"黄河鲤鱼","en":"Yellow River carp"},{"zh":"压轴主食「五谷丰登」","en":"The finale: 'Five Grains'"}]},{"t":"photo","p":"p030","r":1,"w":"56%"},{"t":"row","p":["p004","p012"],"cap":[{"zh":"开席四小碗","en":"Four small bowls to start"},{"zh":"牡丹燕菜","en":"Peony yancai"}]},{"t":"tip","txt":{"zh":"水席菜多，==人少可以点套餐或半份==，牡丹燕菜和连汤肉片是必点。","en":"A full banquet is a lot of food — ==small groups can order a set or half portions==. Don't skip the peony yancai or the sliced-pork soup."}}],"cuts":[],"lat":34.6804,"lon":112.4647071},{"id":"b","L":"B","area":"a","kind":"sight","time":"15:55","name":{"zh":"白马寺","en":"White Horse Temple"},"pinName":{"zh":"白马寺","en":"White Horse Temple"},"lab":{"dx":-18,"dy":4,"a":"end"},"notes":{"zh":"公元 64 年，汉明帝夜里梦见一个金色的人在宫殿上空飞。大臣说，那是西方的「佛」。皇帝派人往西去求法，他们在大月氏遇到两位印度高僧，用白马驮着经书和佛像，回到洛阳。第二年，也就是公元 68 年，这座寺建成了，叫白马寺——佛教传进中国以后第一座官办的寺院，所以被称为「释源」「祖庭」。这比唐僧去西天取经，早了五百多年。","en":"In AD 64 Emperor Ming of Han dreamed of a golden figure flying over his palace. His ministers said it must be the Buddha of the West. He sent envoys west; in Central Asia they met two Indian monks, and together they came back to Luoyang with scriptures and images loaded on a white horse. In AD 68 this temple was built for them and named after the horse — the first state-built Buddhist temple in China, which is why it's called the 'source' and the 'ancestral home'. That was more than five hundred years before Xuanzang's journey west."},"left":[{"t":"stamp","y":"68","era":{"zh":"东汉 · 永平十一年","en":"Eastern Han, AD 68"}},{"c":"baimasi","w":"46%","r":1.5,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"kbox","title":{"zh":"小知识 · 白马寺","en":"Field notes · White Horse Temple"},"intro":{"zh":"中国第一座官办佛寺，名字里藏着三个故事。","en":"China's first state-founded Buddhist temple, with three stories in its name."},"rows":[{"h":{"zh":"为什么叫「寺」","en":"Why 'si'"},"t":{"zh":"两位高僧刚来时，住在接待外宾的官署「鸿胪寺」。「寺」原来是官府的意思，从此以后，和尚住的地方也叫「寺」了。","en":"The two monks first stayed at the Honglu Si, the office that received foreign guests. 'Si' meant a government office — and from then on, it also meant a Buddhist temple."}},{"h":{"zh":"第一部汉文佛经","en":"The first sutra in Chinese"},"t":{"zh":"两位高僧在这里译出了《四十二章经》，被认为是第一部译成汉文的佛经。","en":"Here the two monks translated the Sutra in Forty-Two Sections, held to be the first Buddhist scripture in Chinese."}},{"h":{"zh":"门口的石马","en":"The stone horses"},"t":{"zh":"山门外的两匹石马，相传原本是宋代一位驸马墓前的石刻，后来才搬到这里守门。","en":"The two stone horses outside the gate are said to have come from the tomb of a Song-dynasty imperial son-in-law, moved here later to stand guard."}},{"h":{"zh":"屋檐上的铃铛","en":"Bells on the eaves"},"t":{"zh":"檐角挂的铃叫风铎，风一吹就响，能把来屋檐下筑巢的鸟吓走。一千五百年前的《洛阳伽蓝记》写洛阳的寺：「微风渐发，则宝铎和鸣。」","en":"The bells under the eaves ring in the wind and scare off birds that want to nest there. A book about Luoyang's temples written 1,500 years ago says: 'When a breeze rises, the precious bells ring together.'"}}]},{"t":"row","p":["p042","p057"],"cap":[{"zh":"山门和石马","en":"The gate and its horses"},null]},{"t":"note","txt":{"zh":"下午打卡白马寺，中国第一个官办寺院。也是全世界唯一一座拥有中、印、缅、泰4国风格佛殿的寺院。建立与公元68年，同一时期，罗马正准备建立斗兽场，庞贝还欣欣向荣着。","en":"Afternoon: the White Horse Temple, China's first state-founded temple — and the only one in the world with halls in four national styles: Chinese, Indian, Burmese and Thai. It was founded in AD 68, around the time Rome was getting ready to build the Colosseum and Pompeii was still thriving."}},{"t":"row","p":["p067","p071","p085"],"cap":[{"zh":"天王殿","en":"Hall of the Heavenly Kings"},null,null]},{"t":"row","p":["p123","p129"],"cap":[null,{"zh":"地上的莲花","en":"Lotus in the paving"}]},{"t":"photo","p":"p064","r":-1,"w":"84%","cap":{"zh":"上香","en":"Lighting incense"}},{"t":"photo","p":"p379","r":1,"w":"62%"}],"right":[{"t":"photo","p":"p046","r":-1,"w":"90%"},{"t":"photo","p":"p034","r":1,"w":"52%","cap":{"zh":"下了车，往白马寺走","en":"Off the car, walking to the temple"}},{"t":"note","txt":{"zh":"白马寺号称中国第一座官办佛寺，走到它门口却不容易。滴滴只能停在老远的地方，下了车还得走上好几百米。直线明明没多远，路偏偏拐来拐去，非要从一条商业街里穿过去，才放你进山门。盛夏的太阳毒，一路也没个遮阴的地方，老人孩子都只好顶着晒。修这条路的人，大概只算了生意经，忘了算一算爷爷奶奶的年纪。","en":"The White Horse Temple is said to be China's first state-built Buddhist temple — but getting to its gate is another matter. The ride-hail car could only drop us a long way off, and from there it was several hundred meters on foot. The temple was close as the crow flies, yet the path wound back and forth, steering everyone through a shopping street before it would let you near the gate. The midsummer sun was fierce and there was no shade anywhere; grandparents and kids alike just had to bake. Whoever laid out that route did the shopkeepers' sums and forgot to count the grandparents' years."}},{"t":"row","p":["p092","p143"],"cap":[{"zh":"大佛殿","en":"Great Buddha Hall"},{"zh":"《四十二章经》碑","en":"The Forty-Two Sections stele"}]},{"t":"row","p":["p103","p107"],"cap":[{"zh":"殿前遇到僧人","en":"Monks by the hall"},null]},{"t":"photo","p":"p901","r":1,"w":"90%","cap":{"zh":"僧人列队进殿（视频截图）","en":"Monks filing into the hall (video still)"}},{"t":"note","txt":{"zh":"偶遇高僧们诵经，佛音挺好听，领唱的麦克风举着，身后是“乐器团”成员（有木鱼，铜磬也就是颂钵，别的就不认识了）","en":"We happened upon the monks chanting — it sounded lovely. The lead chanter held up a microphone, with the 'band' behind him (a wooden fish, a bronze bowl bell — basically a singing bowl — and other things I couldn't name)"}},{"t":"note","txt":{"zh":"白马寺被称为“释源祖庭”，始于汉明帝时代。只是今天看到的白马寺，早已不是东汉旧貌，现存建筑多为元明清以来遗存和后世修复。比如摄摩腾祖师墓碑，便是崇祯七年重立。正好赶上师父们做法事，哥俩也新鲜地看了一回。","en":"The White Horse Temple is called the 'source and ancestral home' of Chinese Buddhism, dating back to Emperor Ming of Han. But what you see today is long past its Eastern Han form: most of the buildings survive from the Yuan, Ming and Qing, or are later restorations — the memorial stele of the monk Kasyapa Matanga, for instance, was re-erected in the seventh year of Chongzhen (1634). We arrived just as the monks were holding a ceremony, and the two boys got a first look at one."},"by":"dad"},{"t":"photo","p":"p157","r":1,"w":"50%","cap":{"zh":"檐角的风铎","en":"A bell on the eaves"}},{"t":"tip","txt":{"zh":"门票 ¥35（≈ $5），==12 岁及以下或 1.4 米以下免票==。只在「洛阳白马寺」公众号实名购票。夏天 18:00 停止售票。","en":"Tickets ¥35 (≈ $5); ==children 12 and under, or under 1.4 m, free==. Buy only through the temple's official WeChat account. In summer, ticket sales stop at 18:00."}}],"cuts":[],"lat":34.7225366,"lon":112.5995368},{"id":"c","L":"C","area":"a","kind":"sight","time":"17:02","name":{"zh":"白马寺 · 国际佛殿区","en":"White Horse Temple · International Halls"},"pinName":{"zh":"国际佛殿","en":"International Halls"},"lab":{"dx":-16,"dy":-12,"a":"end"},"notes":{"zh":"白马寺的西边，是一片很特别的园子：泰国、印度、缅甸三个国家各在这里建了一座佛殿，用的都是自己国家的样子。走进泰国殿是金色尖顶，走进缅甸殿是一座白金色的大塔，再往前，是红砂岩的印度圆塔。佛教从印度传到中国，第一站就是这里；两千年后，这些国家又回到「释源」来盖了佛殿。不出白马寺，就把三个国家走了一遍。","en":"On the west side of the temple is a remarkable garden: Thailand, India and Myanmar have each built a Buddhist hall here in their own national style. Golden spires in the Thai hall, a great white-and-gold pagoda for Myanmar, and a round red-sandstone stupa from India. Buddhism reached China from India, and this was its first stop; two thousand years later these countries came back to the 'source' to build. Three countries, without leaving the temple."},"left":[{"t":"label","zh":"国际佛殿区","en":"INTERNATIONAL HALLS"},{"c":"thai","w":"40%","r":-2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"c":"india","w":"32%","r":2,"a":"l","wrap":1,"mt":2,"t":"deco"},{"t":"kbox","title":{"zh":"小知识 · 三座外国佛殿","en":"Field notes · three foreign halls"},"intro":{"zh":"按落成的先后：","en":"In the order they were finished:"},"rows":[{"h":{"zh":"泰国佛殿 · 1997","en":"Thai hall · 1997"},"t":{"zh":"1992 年奠基，1997 年落成，后来又扩建过，是第一座。","en":"Foundation laid in 1992, finished in 1997 and enlarged later — the first of the three."}},{"h":{"zh":"印度佛殿 · 2010","en":"Indian hall · 2010"},"t":{"zh":"照着印度的桑奇大塔建造，2010 年落成，是印度政府在海外捐建的第一座佛殿。","en":"Modelled on the Great Stupa at Sanchi and finished in 2010 — the first Buddhist hall the Indian government has built abroad."}},{"h":{"zh":"缅甸佛殿 · 2014","en":"Myanmar hall · 2014"},"t":{"zh":"大金塔以仰光的大金塔为蓝本，2014 年落成。","en":"Its golden pagoda is modelled on the Shwedagon in Yangon; finished in 2014."}}]},{"t":"photo","p":"p381","r":-1,"w":"70%"},{"t":"row","p":["p176","p178"],"cap":[null,{"zh":"缅甸殿里","en":"Inside the Myanmar hall"}]},{"t":"photo","p":"p902","r":1,"w":"58%","cap":{"zh":"印度殿的圆顶下（视频截图）","en":"Under the Indian hall's dome (video still)"}},{"t":"note","txt":{"zh":"印度殿最妙的是正中间那一小块地方。站在那儿说一句话，声音撞上圆顶又落回来，嗡嗡的，像在音乐厅里开嗓。可只要往旁边挪一两步，那点回声就没了，好像它只肯给站对了地方的人听。","en":"The best thing in the Indian hall is one small spot right in the middle. Say something there and your voice hits the dome and falls back around you, humming, as if you were warming up in a concert hall. Take a step or two to the side and it's gone — as though the echo only plays for whoever stands in exactly the right place."}}],"right":[{"t":"photo","p":"p165","r":1,"w":"90%","cap":{"zh":"泰国佛殿","en":"The Thai hall"}},{"t":"row","p":["p180","p181"],"cap":[{"zh":"缅甸大金塔","en":"The Myanmar pagoda"},null]},{"t":"note","txt":{"zh":"佛殿区有免费茶水，心意是好的。只是三十几度的天，壶里倒出来的是滚烫的热茶。捧在手里，像又多晒了一回太阳。","en":"The halls offer free tea, which is a kind thought. But in mid-thirties heat, what came out of the urn was scalding. Holding the cup felt like a second round in the sun."}},{"t":"row","p":["p193","p198"],"cap":[{"zh":"印度殿门口","en":"At the Indian hall"},null]},{"t":"photo","p":"p202","r":-1,"w":"70%","cap":{"zh":"仿桑奇大塔的印度佛殿","en":"The Indian hall, after the Sanchi stupa"}},{"c":"myanmar","w":"34%","r":-1.5,"a":"r","wrap":1,"mt":-40,"t":"deco"},{"t":"tip","txt":{"zh":"国际佛殿区在寺的西侧，==中国寺院部分可以走快一点，把时间留给这里==。傍晚光线最好看。","en":"The international halls are on the west side — ==move briskly through the Chinese halls and save time for these==. Late afternoon light is the prettiest."}}],"cuts":[],"lat":34.7243904,"lon":112.5988874},{"id":"d","L":"D","area":"n","kind":"food","time":"19:24","name":{"zh":"老城十字街夜市","en":"Old Town Shizi Street Night Market"},"pinName":{"zh":"十字街夜市","en":"Shizi Street"},"lab":{"dx":18,"dy":-10,"a":"start"},"notes":{"zh":"从酒店往北走十来分钟，就到了老城十字街。脚下这条街，一千四百年前是隋唐洛阳城宣仁门外的大街，金元时代是城东的主街。现在一到晚上，一百七十多家摊子把两百多种小吃摆满一条街。我们的吃法是：一样买一份，一家人分着吃，谁都别吃饱。","en":"Ten-odd minutes' walk north of the hotel is Shizi Street in the old town. Fourteen hundred years ago this was the avenue outside the Xuanren Gate of Sui-Tang Luoyang; under the Jin and Yuan it was the main street of the eastern city. Now every evening some 170 stalls line it with more than 200 kinds of snack. Our rule: buy one of each, share it round the family, and nobody gets full."},"left":[{"t":"label","zh":"十字街","en":"SHIZI STREET · 十字街"},{"c":"lijingmen","w":"40%","r":1.5,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"kbox","title":{"zh":"小知识 · 夜市里的「外来户」","en":"Field notes · the night market's out-of-towners"},"intro":{"zh":"有两样，其实不是洛阳本地的。","en":"Two of them aren't from Luoyang at all."},"rows":[{"h":{"zh":"门钉肉饼","en":"Door-stud meat pies"},"t":{"zh":"原本是老北京的清真小吃，圆鼓鼓的，像旧时城门上的门钉，因此得名。「老洛阳」三个字是招牌。后天去关林，可以数一数大门上真正的门钉。","en":"Originally an old-Beijing halal snack, round and fat like the studs on old city gates — hence the name. 'Old Luoyang' is just the shop sign. At Guanlin in two days, count the real studs on the gate."}},{"h":{"zh":"镜糕","en":"Mirror cakes"},"t":{"zh":"发源在西安：糯米粉装进小木笼里蒸，蒸熟的时候蒸汽冲出来，会发出长长的一声鸣响。","en":"From Xi'an: glutinous-rice flour is steamed in tiny wooden moulds, and when it's done the steam escapes with a long whistle."}}]},{"t":"photo","p":"p382","r":-1,"w":"70%"},{"t":"wall","cols":3,"p":[["p241",{"zh":"王三饼卷面筋","en":"Wang San's gluten wraps"}],["p263",{"zh":"巨霸酸奶","en":"Jumbo yogurt"}],["p282",{"zh":"甘梅薯条","en":"Plum-dusted fries"}],["p292",{"zh":"冰镇茅根雪梨","en":"Iced pear & cogongrass-root drink"}],["p310",{"zh":"烤羊肉","en":"Lamb skewers"}],["p325",{"zh":"门钉肉饼","en":"Door-stud meat pies"}]]},{"t":"photo","p":"p307","r":1,"w":"62%","cap":{"zh":"一人一杯","en":"One cup each"}}],"right":[{"t":"photo","p":"p250","r":1,"w":"88%","cap":{"zh":"红灯笼下的十字街","en":"Shizi Street under red lanterns"}},{"t":"wall","cols":3,"p":[["p329",{"zh":"镜糕","en":"Mirror cakes"}],["p352",{"zh":"牡丹饼","en":"Peony cakes"}],["p359",{"zh":"洛阳牡丹酒","en":"Luoyang peony wine"}],["p363",{"zh":"炸活蝎","en":"Fried scorpions"}],["p369",{"zh":"「昆虫记」：炸昆虫","en":"'Insect Diary': fried bugs"}],["p371",{"zh":"烤串","en":"Grilled skewers"}]]},{"c":"nightstreet","w":"40%","r":-2,"a":"l","wrap":1,"t":"deco"},{"t":"note","txt":{"zh":"晚上是十字街小吃走一走。 哥哥弟弟勇敢的在爷爷的带领下尝试了炸昆虫。哥哥点评炸蝎子脆脆的好吃😋，炸蚕蛹软软的一般般🤷‍♂️。","en":"Evening: a stroll along Shizi Street for snacks. With Grandpa leading the charge, both boys bravely tried fried insects. The older one's verdict: fried scorpions, crunchy and tasty 😋; fried silkworm pupae, soft and so-so 🤷‍♂️."}},{"t":"row","p":["p314","p342"]},{"t":"photo","p":"p903","r":-1,"w":"46%","cap":{"zh":"「昆虫记」前（视频截图）","en":"At 'Insect Diary' (video still)"}},{"t":"note","txt":{"zh":"「昆虫记」的玻璃柜里，一串串蝎子、蚕蛹炸得金黄。哥哥跟着爷爷，第一次吃炸蝎子和蚕蛹。招牌上写的是「鲜炸活蝎」，其实下锅以后早就不动了。可要把一整只蝎子送进嘴里，还是得先给自己鼓一口气。他咬下去，嚼了两下，说：挺好吃的，脆脆的。我觉得他特别勇敢。","en":"In the glass case at \"Insect Diary,\" skewers of scorpions and silkworm pupae sat fried golden. Following Grandpa's lead, our older boy tried fried scorpion and silkworm for the first time. The sign said \"live scorpions, fried fresh\" — though once they've been in the oil, nothing moves. Still, putting a whole scorpion in your mouth takes a deep breath first. He bit, chewed twice, and said: \"Pretty good, actually. Crunchy.\" I thought he was very brave."}},{"t":"tip","txt":{"zh":"从应天门一带==步行十几分钟就到==；==晚上七点以后最热闹==，小吃多是小份，适合一样买一点分着吃。","en":"==A 10–15 minute walk== from the Yingtian Gate area; ==busiest after 7 pm==. Portions are small, so buy a little of everything and share."}},{"t":"end"}],"cuts":[],"lat":34.6839161,"lon":112.4722392}],"voices":[],"vr":0.62,"view":[287,57,1155],"days":[{"n":"Day 1","cur":true},{"n":"Day 2","url":"#day2"},{"n":"Day 3","url":"#day3"}]},"G":{"local":" M441.4,600.6 L438.2,601.6 L435.1,602.9 L434.9,603.0 L428.3,605.9 L425.1,607.2 L424.2,607.5 L422.6,608.1 L418.8,609.4 L417.7,609.8 L417.0,609.9 L415.5,610.3 L414.4,610.2 L413.4,610.1 L412.1,609.6 L410.7,608.8 L409.2,607.3 L406.5,601.9 L405.3,600.1 L403.7,598.0 M458.6,593.3 L463.6,604.4 M450.9,540.5 L451.7,540.4 L453.6,540.2 M471.1,537.2 L469.4,527.1 L469.2,525.8 L469.1,525.3 M419.8,631.5 L424. h":"打车回酒店","en":"taxi back to the hotel"}},{"from":"c","to":"d","q":[620,1000],"t":[600,900,82],"fs":24,"txt":{"zh":"打车往南约 13 公里","en":"taxi, 13 km south"}},{"from":"f","to":"home","q":[330,1000],"t":[330,1100,-82],"fs":24,"txt":{"zh":"打车回酒店","en":"taxi back"}}],"places":[{"id":"a","L":"A","area":"m","kind":"sight","time":"11:17","name":{"zh":"洛阳古墓博物馆 · 地下墓室","en":"Luoyang Ancient Tombs Museum · Underground"},"pinName":{"zh":"古墓博物馆","en":"Ancient Tombs Museum"},"lab":{"dx":18,"dy":-12,"a":"start"},"notes":{"zh":"洛阳地下埋着上万座古墓，多到被叫作「古墓之都」。这座博物馆从里面挑了 25 座，从西汉到宋金，横跨九个朝代，把每一块墓砖拆下来编好号，搬到这里，在地下约 6 米深的地方按原样一比一砌回去。所以在这里不是隔着玻璃看墓，而是弯腰钻进墓道，站在两千年前的墓室里，抬头看头顶的穹顶。1987 年开馆，号称世界上第一座古墓博物馆。","en":"There are tens of thousands of ancient tombs under Luoyang — enough to earn it the name 'capital of tombs'. This museum chose 25 of them, from the Western Han to the Song and Jin, nine dynasties in all, took them apart brick by numbered brick, and rebuilt them here at full size about six metres underground. So you don't look at a tomb through glass: you duck down the passage and stand inside a burial chamber two thousand years old, looking up at its vault. It opened in 1987 and calls itself the world's first museum of ancient tombs."},"left":[{"t":"label","zh":"古墓博物馆","en":"ANCIENT TOMBS MUSEUM"},{"t":"notes"},{"c":"chan","w":"32%","r":-3,"a":"r","wrap":1,"mt":2,"t":"deco"},{"t":"kbox","title":{"zh":"小知识 · 地下的家","en":"Field notes · homes underground"},"intro":{"zh":"古人把墓修得像家。","en":"The ancients built tombs like houses."},"rows":[{"h":{"zh":"墓顶的花样","en":"What's overhead"},"t":{"zh":"西汉的墓多用空心砖搭成人字顶；到了宋金，墓顶用砖砌出斗拱、门窗，像一间小小的木结构房子，只不过全是砖做的。","en":"Western Han tombs were often roofed with big hollow bricks set in an inverted V; by the Song and Jin, builders carved brackets, doors and windows out of brick, so the tomb looks like a little timber house made entirely of brick."}},{"h":{"zh":"洛阳铲","en":"The Luoyang spade"},"t":{"zh":"据记载，洛阳铲是马坡村一个外号「李鸭子」的农民发明的：半圆筒形的铲头往地下一戳，就能带出一管土，看土色就知道下面有没有墓。后来它成了全世界考古钻探的工具。","en":"According to local records, the Luoyang spade was invented by a farmer nicknamed 'Li the Duck' from Mapo village: drive its half-tube blade into the ground and it brings up a core of soil whose colour tells you whether a tomb lies below. It became an archaeologist's tool all over the world."}},{"h":{"zh":"一比一","en":"Full size"},"t":{"zh":"墓室的原砖原石按一比一复原，陈列着墓里出土的约 600 件文物。","en":"The chambers are rebuilt full size from their original brick and stone, with about 600 objects found inside them on display."}}]},{"t":"row","p":["p446","p450"],"cap":[{"zh":"抬头看墓顶","en":"Looking up at the vault"},{"zh":"砖砌的斗拱","en":"Brackets made of brick"}]},{"t":"row","p":["p407","p451"],"cap":[{"zh":"钻进墓道","en":"Into the passage"},null]},{"t":"row","p":["p801","p540"],"cap":[{"zh":"手中无剑，影中有刃","en":"No sword in hand, a blade in the shadow"},{"zh":"墓道里的石武士","en":"A stone warrior in the passage"}]},{"t":"row","p":["p393","p396"]},{"t":"note","txt":{"zh":"下到墓里，总能看见盗洞。北魏宣武帝的景陵，宋金和民国年间被盗过好几回，我们看到的地宫空空荡荡。那时候讲究薄葬，本来也没放什么，可盗墓的人哪里知道，还是一锹一锹挖了下去。站在空墓室里，我忽然想起《盗墓笔记》，回家也许该把它再翻出来看看。","en":"Down in the tombs you keep seeing robbers' tunnels. The Jingling tomb of Emperor Xuanwu of the Northern Wei was robbed several times — under the Song and Jin, and again in the Republican era — and the burial chamber we saw was bare. Burials then were meant to be modest, so there wasn't much inside to begin with; but the robbers couldn't know that, and dug their way down anyway. Standing in that empty chamber I suddenly thought of The Grave Robbers' Chronicles. Maybe it's time to pull it off the shelf again."}}],"right":[{"t":"photo","p":"p553","r":-1,"w":"88%","cap":{"zh":"博物馆门口","en":"At the museum gate"}},{"t":"note","txt":{"zh":"早上打卡了古墓博物馆。见到了网红“手中无剑，影中有刃“，以及妇人启门图和哼哈二将。","en":"Morning: the Ancient Tombs Museum. We saw the internet-famous 'no sword in his hand, a blade in his shadow', plus the woman-opening-the-door mural and the two door gods."}},{"t":"row","p":["p418","p422"],"cap":[{"zh":"跟着官方讲解员","en":"With the museum's guide"},null]},{"t":"note","txt":{"zh":"这地儿还真必须得有讲解，不然全是石头堆啥也看不明白稀里糊涂就走完了。官方讲解80分钟，小姐姐虽然语速超快，但好在内容很丰富，馆内布置也很用心，各个古墓的特色分明，北魏的简朴和唐宋的华丽精致鲜明对比，又一次反映了“经济基础决定上层建筑”。","en":"You really do need a guide here — otherwise it's all piles of stone and you'd drift through without understanding a thing. The official tour ran 80 minutes; our guide talked super fast, but she packed in a lot, and the displays are thoughtfully done. Each tomb has its own character: the plainness of the Northern Wei against the richness and refinement of the Tang and Song — 'the economic base determines the superstructure', once again."}},{"c":"sancai","w":"36%","r":2,"a":"l","wrap":1,"t":"deco"},{"t":"note","txt":{"zh":"古墓博物馆如果对历史有兴趣，真心强烈推荐。墓葬的形制，几乎就是时代精神的切片。两汉厚葬之风很盛，墓室布局、随葬器物，都体现着“事死如事生”的观念；魏晋南北朝世事动荡，丧葬观念和墓葬风格也转向薄葬；到了唐代，随葬明器和唐三彩又呈现出盛世气象；宋代墓葬则越来越生活化，砖雕、壁画、仿木结构里，能看到市井生活和审美趣味的兴起。","en":"If you're interested in history, I can't recommend the Ancient Tombs Museum highly enough. The form of a tomb is practically a slice of its age. Under the two Han dynasties lavish burial was the fashion, and the layout of the chambers and the grave goods all express the idea of 'serving the dead as the living'. In the turmoil of the Wei, Jin and Northern and Southern dynasties, ideas about death shifted toward simple burial. By the Tang, the grave figures and tri-colored glazed wares show the confidence of a golden age; and Song tombs grow ever more domestic — in their brick carvings, murals and imitation timberwork you can see the rise of city life and everyday taste."},"by":"dad"},{"t":"photo","p":"p542","r":1,"w":"56%","cap":{"zh":"地下的长廊","en":"The long corridor underground"}},{"t":"row","p":["p566","p567"],"cap":[{"zh":"出来见到太阳","en":"Back up into the sun"},{"zh":"歇一歇","en":"A rest"}]},{"t":"note","txt":{"zh":"古墓博物馆晚上还有一场夜游，叫《古墓探秘》：提一盏灯下墓，一路有 NPC 演戏、出题，做任务赚「银票」，最后换文创。官方说不吓人，小孩也能玩。这次带着小朋友白天来，没赶上。留个念想，下次晚上再来。","en":"The museum also runs a night tour called \"Tomb Quest\": you go down into the tombs carrying a lantern, actors play characters and set puzzles along the way, and you earn \"silver notes\" for each task to trade for souvenirs at the end. The museum says it isn't scary and kids can join. We came by day with the children and missed it. Something to come back for — at night, next time."}},{"t":"tip","txt":{"zh":"==免费，需在官方公众号或官网实名预约==，周一闭馆，夏季 16:30 停止入馆。==官方讲解约 80 分钟==。馆在邙山脚下，离市区打车约 20 分钟。夜游《古墓探秘》晚上 7 点半检票、10 点半结束，场次以官方公众号为准。","en":"==Free, but book with your ID on the official WeChat account or website==; closed Mondays, last entry 16:30 in summer. ==The official guided tour takes about 80 minutes==. It's at the foot of Mount Mang, about 20 minutes by taxi from town. The \"Tomb Quest\" night tour checks in at 7:30 pm and ends at 10:30 pm; dates are posted on the museum's official WeChat account."}}],"cuts":[],"lat":34.73436,"lon":112.40897},{"id":"b","L":"B","area":"m","kind":"sight","time":"12:07","name":{"zh":"《地府千秋》· 河南古墓壁画","en":"'A Thousand Autumns Below' · Henan Tomb Murals"},"pinName":{"zh":"古墓壁画","en":"Tomb murals"},"lab":{"dx":-16,"dy":18,"a":"end"},"notes":{"zh":"博物馆里还有一个大展：《地府千秋——河南古墓壁画大观》，从两汉到民国，一共 18 组、65 幅从墓里揭下来的壁画。古人相信人死后还要「过日子」，所以把墓墙画满：升天的路、守门的神、宴饮、出行、伺候的仆人。这些画在黑暗里藏了上千年，颜色反而保存了下来。","en":"The museum also holds a major exhibition, 'A Thousand Autumns Below: Tomb Murals of Henan' — 65 murals in 18 groups, lifted from tomb walls from the Han to the Republic. People believed life went on after death, so they covered the walls: the road up to heaven, gods guarding the door, banquets, processions, servants waiting. Hidden in the dark for a thousand years, the colours survived."},"left":[{"t":"label","zh":"地府千秋","en":"TOMB MURALS · 地府千秋"},{"t":"notes"},{"t":"kbox","title":{"zh":"小知识 · 最早的画","en":"Field notes · the oldest paintings"},"intro":{"zh":"卜千秋墓：一张两千年前的「升天地图」。","en":"The tomb of Bu Qianqiu: a two-thousand-year-old map to heaven."},"rows":[{"h":{"zh":"墓主是谁","en":"Whose tomb"},"t":{"zh":"1976 年在洛阳烧沟村发现，是西汉昭帝到宣帝年间（公元前 86–前 49 年）的墓。墓里出土了一枚「卜千秋印」，所以知道主人叫卜千秋。","en":"Found in 1976 at Shaogou village in Luoyang, from the reigns of Emperors Zhao and Xuan of Western Han (86–49 BC). A seal reading 'Bu Qianqiu' told archaeologists the owner's name."}},{"h":{"zh":"升天","en":"Going up"},"t":{"zh":"墓顶的脊上，画着墓主夫妇在伏羲、女娲、太阳月亮、九尾狐和玉兔的陪伴下，一路升上天去。","en":"Along the ridge of the ceiling, the couple ride up to heaven escorted by Fuxi and Nüwa, the sun and moon, a nine-tailed fox and the jade rabbit."}},{"h":{"zh":"打鬼","en":"Chasing demons"},"t":{"zh":"后墙上画的是方相氏驱傩——一位凶神恶煞的大力士在赶鬼，守着墓主人不被打扰。","en":"On the back wall is the Fangxiang exorcist, a fearsome strongman driving demons away so the dead can rest undisturbed."}}]},{"t":"photo","p":"p453","r":-1,"w":"54%"},{"t":"row","p":["p459","p462"]},{"t":"row","p":["p530","p532"]},{"t":"row","p":["p468","p470"]}],"right":[{"t":"photo","p":"p524","r":1,"w":"90%"},{"t":"row","p":["p493","p498"],"cap":[{"zh":"哼哈二将","en":"The two door gods"},null]},{"t":"row","p":["p484","p491"]},{"t":"kbox","title":{"zh":"小知识 · 门缝里的女子","en":"Field notes · the woman at the door"},"intro":{"zh":"这一幕叫「妇人启门」：门只开一半，一位女子从门缝里探出身来。","en":"It's called 'a woman opening the door': the door stands half open, and a woman leans out through the gap."},"rows":[{"h":{"zh":"两千年的老题材","en":"Two thousand years old"},"t":{"zh":"最早见于西汉晚期的石椁上，宋辽金时最流行，元以后慢慢少了。这座博物馆里迁来的一座北宋壁画墓（新安县李村），墓室的第四面墙上也画着这一幕。","en":"It first appears on a late Western Han stone coffin, was most popular under the Song, Liao and Jin, and faded after the Yuan. A Northern Song mural tomb moved into this museum, from Licun in Xin'an county, has the same scene on its fourth wall."}},{"h":{"zh":"门后面是什么","en":"What's behind the door"},"t":{"zh":"考古学家宿白说，它表示「假门之后尚有庭院或房屋」——墓室到这里并没有到头，后面还有一整座宅院。也有人说门后是墓主人向往的仙境，或者这位女子是在倚着门，等家人回来。","en":"The archaeologist Su Bai said it shows that 'behind the false door there are still courtyards and halls' — the tomb doesn't end here; a whole house lies beyond. Others think the door opens onto the paradise the dead hoped for, or that the woman is leaning on the door, waiting for her family to come home."}},{"h":{"zh":"半藏半露","en":"Half hidden"},"t":{"zh":"门开一半，人露一半，故意留给你去猜。学者郑岩说它「曲折含蓄，极富艺术感染力」。","en":"Half a door, half a person — left for you to imagine the rest. The scholar Zheng Yan called it 'subtle and indirect, and deeply moving'."}}]},{"t":"row","p":["p500","p513"],"cap":[{"zh":"妇人启门","en":"A woman opening the door"},{"zh":"和门里的她合个影","en":"A photo with the woman at the door"}]}],"cuts":[],"lat":34.734,"lon":112.40745},{"id":"c","L":"C","area":"a","kind":"food","time":"14:37","name":{"zh":"回酒店 · 午后歇脚","en":"Back at the hotel · An afternoon break"},"pinName":{"zh":"回酒店歇脚","en":"Hotel break"},"lab":{"dx":18,"dy":16,"a":"start"},"notes":{"zh":"六月底的洛阳，中午地面三十五度以上。上午在地下凉快了半天，下午干脆回酒店：叫了外卖的面，一家人在房间里吃，孩子们看平板、打闹、睡午觉。晚上还要去龙门，养足精神。酒店紧挨着应天门遗址——隋唐洛阳城宫城的正南门，武则天就是在这座门上登基称帝的。","en":"Late June in Luoyang means 35°C at midday. After a cool morning underground we simply went back to the hotel: takeaway noodles eaten in the room, the boys on their tablets, a scuffle, a nap. Longmen was waiting that evening. The hotel sits right beside the site of the Yingtian Gate, the main south gate of the Sui-Tang palace city — where Wu Zetian proclaimed herself emperor."},"left":[{"t":"label","zh":"午后","en":"AFTERNOON"},{"t":"notes"},{"c":"yingtianmen","w":"36%","r":-1.5,"a":"r","wrap":1,"mt":2,"t":"deco"},{"t":"kbox","title":{"zh":"小知识 · 应天门","en":"Field notes · the Yingtian Gate"},"intro":{"zh":"酒店隔壁，是女皇登基的大门。","en":"Next door to the hotel: the gate where an empress was crowned."},"rows":[{"h":{"zh":"隋朝建","en":"Built by the Sui"},"t":{"zh":"隋大业元年（605 年）开始修建，是宫城的正南门。","en":"Begun in 605, the first year of the Sui Daye era, as the main south gate of the palace city."}},{"h":{"zh":"改过名字","en":"Renamed"},"t":{"zh":"原名「则天门」。705 年为了避武则天的名讳，改叫应天门。","en":"Its original name was Zetian Gate; in 705 it was renamed Yingtian to avoid using Empress Wu's name."}},{"h":{"zh":"见过外国使节","en":"Where envoys came"},"t":{"zh":"武则天在这里登基；皇帝也在这里接见日本来的遣隋使、遣唐使。现在是应天门遗址博物馆，2019 年开放。","en":"Wu Zetian was enthroned here, and emperors received Japanese envoys at this gate. It is now the Yingtian Gate Site Museum, opened in 2019."}}]},{"t":"row","p":["p581","p582"],"cap":[{"zh":"外卖的面","en":"Takeaway noodles"},null]},{"t":"row","p":["p600","p602"]}],"right":[{"t":"photo","p":"p590","r":1,"w":"86%"},{"t":"row","p":["p610","p615"],"cap":[{"zh":"本地啤酒「洛阳牡丹」","en":"Local beer: Luoyang Peony"},null]},{"t":"row","p":["p598","p605"],"cap":[{"zh":"牡丹宫酿","en":"Peony yogurt"},null]},{"t":"note","txt":{"zh":"除了「洛阳牡丹」啤酒，还有一杯酸奶也好喝：本地老字号「白马寺」的「牡丹宫酿」，杯子上画着应天门。喝到一半，嘴里能尝到一小片牡丹花瓣。","en":"Besides the Luoyang Peony beer, there was a yogurt drink worth having: \"Peony Palace Brew\" from Baimasi, an old local brand, with Yingtian Gate drawn on the cup. Halfway down, you get a little peony petal on your tongue."}}],"cuts":[],"lat":34.6723957,"lon":112.4660086},{"id":"d","L":"D","area":"n","kind":"sight","time":"18:52","name":{"zh":"龙门石窟 · 西山","en":"Longmen Grottoes · West Hill"},"pinName":{"zh":"龙门石窟","en":"Longmen Grottoes"},"lab":{"dx":18,"dy":-6,"a":"start"},"notes":{"zh":"洛阳城南，伊河从两座山中间穿过。《水经注》说这里「两山相对，望之若阙」，所以古人叫它伊阙；后来人们说，只有神龙才越得过这道门，又叫它龙门——「鲤鱼跳龙门」的龙门，就是这里。公元 493 年前后，北魏孝文帝把都城从大同迁到洛阳，人们开始在伊河两岸的石壁上凿佛像，一直凿到唐朝，前后四百多年，在一公里长的山崖上凿出了蜂窝一样的石窟。2000 年列入世界遗产。","en":"South of Luoyang the Yi River cuts between two hills. An ancient geography says 'the two hills face each other like a gate', so it was called Yique, the Yi Gate; later people said only a dragon could pass it, and named it Longmen, Dragon Gate — the very gate the carp leaps in the old saying. Around 493, when Emperor Xiaowen of Northern Wei moved his capital from Datong to Luoyang, people began carving Buddhas into the cliffs on both banks, and kept going into the Tang — more than four hundred years — until a kilometre of cliff was honeycombed with caves. It became a World Heritage site in 2000."},"left":[{"t":"stamp","y":"493","era":{"zh":"北魏 · 太和十七年前后","en":"Northern Wei, c. 493"}},{"c":"longmen","w":"38%","r":2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"kbox","title":{"zh":"小知识 · 龙门的数字","en":"Field notes · Longmen by numbers"},"intro":{"zh":"中国四大石窟之一，和敦煌莫高窟、大同云冈、天水麦积山齐名。","en":"One of China's four great grottoes, alongside Mogao at Dunhuang, Yungang at Datong and Maijishan at Tianshui."},"rows":[{"h":{"zh":"2345 · 11 万 · 2800","en":"2,345 · 110,000 · 2,800"},"t":{"zh":"2345 个窟龛、11 万多尊造像、2800 多块碑刻题记，还有近 80 座佛塔。","en":"2,345 caves and niches, more than 110,000 statues, over 2,800 carved inscriptions and nearly 80 small pagodas."}},{"h":{"zh":"最大和最小","en":"Biggest and smallest"},"t":{"zh":"最大的是奉先寺的卢舍那大佛，通高 17.14 米；最小的在莲花洞南壁，只有 2 厘米。","en":"The biggest is the Vairocana Buddha at Fengxian, 17.14 m tall; the smallest, on the south wall of the Lotus Cave, is just 2 cm."}}]},{"t":"row","p":["p643","p650"],"cap":[{"zh":"洞里的大佛","en":"A Buddha in its cave"},null]},{"t":"row","p":["p656","p658"]},{"t":"row","p":["p664","p665"],"cap":[{"zh":"搭着脚手架的洞窟","en":"A cave in scaffolding"},{"zh":"我们去的时候，宾阳南洞临时封闭做研究","en":"When we visited, the South Binyang Cave was closed for research"}]},{"t":"row","p":["p685","p693"]}],"right":[{"t":"photo","p":"p637","r":-1,"w":"90%","cap":{"zh":"进景区","en":"Going in"}},{"t":"note","txt":{"zh":"下午日落前临时加场龙门石窟，同时get✅白天和夜景的卢舍那大佛。","en":"In the afternoon, before sunset, we squeezed in a bonus trip to the Longmen Grottoes — and got ✅ the Vairocana Buddha by day and by night."}},{"t":"kbox","title":{"zh":"小知识 · 西山名窟（从北往南）","en":"Field notes · famous caves of the West Hill, north to south"},"intro":{"zh":"夜里只开西山，正好按这个顺序走。","en":"Only the West Hill opens at night, and this is the order you walk it."},"rows":[{"h":{"zh":"潜溪寺","en":"Qianxi Temple"},"t":{"zh":"西山北头第一个大窟，唐高宗时开凿。主尊阿弥陀佛，左右是观音和大势至，合称「西方三圣」。寺下原有泉水涌出，所以叫潜溪。找一找：天王脚下踩着一个小鬼。","en":"The first big cave at the north end, carved under Emperor Gaozong of Tang. Amitabha sits in the middle between Guanyin and Mahasthamaprapta, the 'Three Sages of the West'. A spring once welled up below it, hence the name, 'hidden stream'. Look for the little demon under a heavenly king's foot."}},{"h":{"zh":"宾阳三洞","en":"The three Binyang Caves"},"t":{"zh":"「宾阳」是迎接初升的太阳。中洞是北魏宣武帝为父母开凿的，从 500 年到 523 年，用工 80 多万个，地面雕成一池莲花。洞里的《帝后礼佛图》浮雕在 20 世纪 30 年代被盗凿，卖到美国，现在分藏在纽约大都会艺术博物馆和堪萨斯城的纳尔逊-阿特金斯艺术博物馆。北洞、南洞北魏时没有完工，到隋唐才完成。","en":"'Binyang' means greeting the rising sun. The central cave was made by Emperor Xuanwu of Northern Wei for his parents, from 500 to 523, with over 800,000 days of labour; its floor is carved as a lotus pond. Its reliefs of the emperor and empress at worship were chiselled out in the 1930s and sold to America — now at the Met in New York and the Nelson-Atkins in Kansas City. The north and south caves were left unfinished by the Wei and completed under the Sui and Tang."}},{"h":{"zh":"万佛洞","en":"Ten-Thousand-Buddha Cave"},"t":{"zh":"窟顶题记写着 680 年完工、「一万五千尊像龛」：南北两壁排满了只有几厘米高的小佛。前室南壁那尊观音，一直被称为龙门最美的观世音。","en":"An inscription in the ceiling dates it to 680 and counts 'fifteen thousand Buddha niches' — the north and south walls are packed with Buddhas only a few centimetres tall. The Guanyin on the south wall of the antechamber has long been called the most beautiful in Longmen."}},{"h":{"zh":"莲花洞","en":"Lotus Cave"},"t":{"zh":"窟顶一朵高浮雕的大莲花，洞因此得名。龙门最小的那尊 2 厘米小佛就在这里。","en":"Named for the great lotus carved in high relief on its ceiling. Longmen's smallest Buddha, 2 cm tall, is here."}},{"h":{"zh":"古阳洞","en":"Guyang Cave"},"t":{"zh":"龙门开凿最早、题记最多的洞，在天然溶洞的基础上凿成。书法史上有名的「龙门二十品」，有十九品在这个洞里。","en":"The earliest cave at Longmen and the richest in inscriptions, cut from a natural limestone cavern. Nineteen of the 'Twenty Pieces of Longmen', famous in the history of calligraphy, are here."}},{"h":{"zh":"药方洞","en":"Prescription Cave"},"t":{"zh":"甬道两边刻着 140 多个唐代药方，能治 50 多种病，里面有绿豆粥，还有最早的「葱管导尿」——一座刻在石头上的药房。","en":"The passage walls carry more than 140 Tang prescriptions for over 50 illnesses — mung-bean porridge among them, and the earliest record of using a scallion stalk as a catheter. A pharmacy carved in stone."}}]},{"t":"row","p":["p671","p677"],"cap":[{"zh":"崖壁上的小洞","en":"Little niches in the cliff"},null]},{"t":"photo","p":"p694","r":1,"w":"60%"},{"t":"tip","txt":{"zh":"门票 ¥90（≈ $13），含西山、东山、香山寺、白园。==夏季有夜游==：2026 年从 3 月 30 日起，17:30–19:30 售票、18:00–20:00 检票、21:00 清场，但==夜里只开西山和香山寺==。在「龙门石窟」公众号预约；==从西北服务区可以步行进景区==。","en":"Tickets ¥90 (≈ $13), covering the West Hill, East Hill, Xiangshan Temple and Bai Garden. ==Summer night visits==: in 2026 from 30 March, tickets 17:30–19:30, entry 18:00–20:00, everyone out by 21:00 — ==but only the West Hill and Xiangshan Temple open at night==. Book on the official WeChat account; ==you can walk in from the northwest service area==."}}],"cuts":[],"lat":34.5595655,"lon":112.4712331},{"id":"e","L":"E","area":"n","kind":"sight","time":"19:43","name":{"zh":"奉先寺 · 卢舍那大佛","en":"Fengxian Temple · the Vairocana Buddha"},"pinName":{"zh":"卢舍那大佛","en":"Vairocana Buddha"},"lab":{"dx":-18,"dy":12,"a":"end"},"notes":{"zh":"爬上一段台阶，眼前突然开阔：一整面山崖被凿成一座露天的大佛龛，正中坐着卢舍那大佛，通高 17.14 米，按唐代碑记：672 年，皇后武氏「助脂粉钱二万贯」，675 年完工——当时的武则天还是皇后，后来才成了中国唯一的女皇帝。天黑以后灯亮起来，隔着伊河远远望去，大佛像浮在半空中。","en":"Up a flight of steps and the view suddenly opens: a whole cliff face carved into one great open-air shrine, with the Vairocana Buddha at its centre, 17.14 m tall. A Tang inscription records that in 672 'the Empress Wu contributed twenty thousand strings of cash from her rouge-and-powder money', and the work was finished in 675 — Wu was still empress then; later she became China's only female emperor. After dark the lights came on, and from across the Yi River the Buddha seemed to float in mid-air."},"left":[{"t":"label","zh":"奉先寺","en":"FENGXIAN TEMPLE · 奉先寺"},{"c":"fengxianwc","w":"52%","mx":320,"r":1,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"kbox","title":{"zh":"小知识 · 大佛","en":"Field notes · the great Buddha"},"intro":{"zh":"龙门最有名的一张脸。现场的牌子上写着：第 1280 窟（奉先寺）。","en":"Longmen's most famous face. The sign on site reads: Cave 1280 (Fengxian Temple)."},"rows":[{"h":{"zh":"17.14 米","en":"17.14 metres"},"t":{"zh":"通高 17.14 米，大约六层楼高；光头就高 4 米，耳朵长 1.9 米。","en":"17.14 m in all, about six storeys; the head alone is 4 m high and the ears 1.9 m long."}},{"h":{"zh":"九身大像","en":"Nine giants"},"t":{"zh":"一佛、二弟子（迦叶、阿难）、二菩萨（文殊、普贤，各约 13 米）、二天王、二力士，是龙门规模最大的摩崖像龛。","en":"One Buddha, two disciples (Kasyapa and Ananda), two bodhisattvas (Manjusri and Samantabhadra, each about 13 m), two heavenly kings and two guardians — the largest cliff shrine at Longmen."}},{"h":{"zh":"「卢舍那」","en":"'Vairocana'"},"t":{"zh":"意思是「光明遍照」，光照到每一个地方。","en":"The name means 'light shining everywhere'."}},{"h":{"zh":"「脂粉钱」","en":"'Rouge money'"},"t":{"zh":"武则天是「资助」，不是一个人出钱修成的。有人说大佛照着她的样子雕，这只是一种说法，没有证据。大佛嘴角微微上扬，所以常被叫作「东方蒙娜丽莎」。","en":"Wu Zetian contributed to the work; she didn't pay for it all. Some say the Buddha was carved in her likeness — a popular story, not a fact. The corners of the mouth turn gently up, which is why it's often called 'the Mona Lisa of the East'."}}]},{"t":"row","p":["p708","p712"],"cap":[{"zh":"和大佛合影","en":"With the great Buddha"},null]},{"t":"note","txt":{"zh":"上一次看龙门石窟，我 10 岁，和哥哥现在差不多大。","en":"The last time I saw the Longmen Grottoes, I was ten — about our older boy's age now."},"by":"dad"},{"t":"note","txt":{"zh":"两次龙门石窟之行之间，自己多读了很多历史书，这次再看，感受完全不一样。哥哥一路听了不少石窟故事，走到奉先寺卢舍那大佛前，一口就猜出这尊大佛和武则天有关。","en":"Between my two visits to Longmen I'd read a lot more history, and this time it felt completely different. Our older boy had heard plenty of cave stories along the way; when we reached the Vairocana Buddha at Fengxian, he guessed at once that it had something to do with Wu Zetian."},"by":"dad"},{"t":"row","p":["p722","p714"]},{"t":"photo","p":"p705","r":-1,"w":"58%"}],"right":[{"t":"photo","p":"p723","r":1,"w":"80%"},{"t":"photo","p":"p700","r":-1,"w":"76%","cap":{"zh":"全家在大佛前","en":"The whole family below the Buddha"}},{"t":"photo","p":"p746","r":1,"w":"78%","cap":{"zh":"天黑了，隔着伊河看西山","en":"After dark, the West Hill across the Yi River"}},{"t":"row","p":["p731","p736"]},{"t":"photo","p":"p758","r":-1,"w":"92%","cap":{"zh":"灯下的奉先寺","en":"Fengxian under the lights"}},{"t":"note","txt":{"zh":"亲眼见到，的确壮观，夜幕下更显庄重，感慨感慨时间长河以及可惜可惜被盗的佛头们。今日流水账完毕🫡","en":"Seeing it in person — truly magnificent, and even more solemn after dark. Moved by the long river of time, and sorry, so sorry, for all the stolen Buddha heads. End of today's log 🫡"}},{"t":"note","txt":{"zh":"从龙门出来，天已经黑透了，要坐摆渡车回去。排队的人很多，队伍拐了好几道弯。可车来得勤，一辆接一辆，队伍一直在往前挪，工作人员也有条不紊。比起白马寺的摆渡车，舒服太多了。车开起来，河对面的大佛还亮着灯。白天热得人发蔫，那晚却起了一点小风。坐在车上，看着大佛一点点远去，慢慢看不见了，真有点记忆里炎夏夜晚的味道。","en":"By the time we left Longmen it was fully dark, and we had to catch the shuttle back. The line was long and doubled back on itself several times — but the buses came one after another, the line kept moving, and the staff had it all well in hand. Much better than the shuttle at the White Horse Temple. As we pulled away, the great Buddha across the river was still lit. The day had been wilting hot, but that night a small breeze came up. We sat and watched the Buddha slip farther and farther away until it was gone. It tasted like the summer nights I remember."}},{"t":"tip","txt":{"zh":"奉先寺在西山南段，台阶不少。==日落前后上去最好==：先看清大佛，再等天黑看灯。","en":"Fengxian is at the south end of the West Hill, up plenty of steps. ==Arrive around sunset==: see the Buddha clearly first, then wait for the lights."}}],"cuts":[],"lat":34.5527254,"lon":112.4702838},{"id":"f","L":"F","area":"n","kind":"sight","time":"20:36","name":{"zh":"龙门古街","en":"Longmen Old Street"},"pinName":{"zh":"龙门古街","en":"Longmen Old Street"},"lab":{"dx":18,"dy":4,"a":"start"},"notes":{"zh":"从景区往北走回西北服务区，路边就是龙门古街：名字叫「古街」，其实是这几年新盖的仿唐商业街，晚上灯光一亮，牡丹花灯从头顶一路铺过去。不用门票，逛逛、拍拍照，就算给龙门的夜晚收个尾。","en":"Walking north from the grottoes back to the northwest service area, you pass Longmen Old Street. 'Old' only in style — it's a new Tang-themed shopping street built in the last few years. At night the lights come on and peony lanterns run overhead the whole way. No ticket needed; a stroll and a few photos to close out the Longmen night."},"left":[{"t":"label","zh":"龙门古街","en":"LONGMEN OLD STREET"},{"t":"notes"},{"t":"photo","p":"p787","r":-1,"w":"70%"}],"right":[{"t":"photo","p":"p765","r":1,"w":"66%","cap":{"zh":"牡丹花灯下","en":"Under the peony lanterns"}},{"t":"photo","p":"p773","r":1,"w":"62%"},{"t":"tip","txt":{"zh":"古街在龙门石窟西北服务区，==免费==，离景区入口约 800 米。","en":"The street is at the Longmen northwest service area, ==free==, about 800 m from the grottoes entrance."}},{"t":"end"}],"cuts":[],"lat":34.5679315,"lon":112.4677787}],"voices":[],"vr":1.136,"view":[-391,37,1400],"days":[{"n":"Day 1","url":"#day1"},{"n":"Day 2","cur":true},{"n":"Day 3","url":"#day3"}]},"G":{"local":" M458.6,593.3 L463.6,604.4 M419.8,631.5 L424.3,629.3 L431.5,626.3 L437.5,623.8 L446.9,620.2 L459.8,612.9 L460.6,612.5 L462.7,611.3 L479.7,601.6 L486.0,598.1 L491.3,598.6 L492.2,598.7 L499.2,601.4 L516.8,608.1 L521.0,609.4 L521.3,609.5 L532.4,613.3 L533.6,613.7 L541.4,616.2 L544.1,616.7 L546.7,616.9 L550.0,616.7 L590.7,609.8 L606.1,607.4 L609.9,605.3 L611.3,604.3 L611.8,603.4 M430.0,622.8 L437.7,619.8 L447.0,615.7 L479.8,597.1 L485.3,594.4 L488.0,594.5 L491.5,594.8 L493.3,594.9 L521.4,605.7 L533.6,609.9 L541.5,612.2 L544.3,612.8 L547.0,613.1 L550.0,612.8 L590.2,605.9 L605.6,603.4 L606.2,603.3 L610.6,602.6 M400.4,583.6 L401.3,583.3 L404.4,585.1 L407.0,585.8 L409.7,585.4 L417.3,584.0 L432.3,581.2 L434.5,580.8 L444.0,579.7 L458.2,578.1 M439.0,603.6 L440.4,606.8 L443.9,615.2 M433.7,591.3 L434.5,591.2 L437.9,590.8 L447.3,589.5 L458.4,588.0 M433.0,586.6 L458.3,583.5 M439.0,592.7 L442.9,590.9 M447.3,589.5 L450.3,596.4 M439.9,594.7 L444.2,592.8 M437.7,600.7 L441.8,598.9 L446.0,597.1 L444.9,594.6 L442.9,595.5 M437.9,590.8 L438.5,591.7 L439.0,592.7 L439.9,594.7 L441.8,598.9 L442.4,600.1 M474.1,586.1 L475.6,588.6 L479.5,590.0 L480.3,591.6 M464.0,604.2 L459.4,593.0 M458.3,581.2 L432.7,584.3 M432.9,585.4 L458.3,582.3 M458.3,580.2 L432.6,583.4 M432.5,582.4 L458.2,579.2 M433.2,587.7 L458.4,584.6 s":{"m":{"color":"#3d6f8f","zh":"上午 · 关林","en":"Morning · Guanlin","box":[453,994,160]},"a":{"color":"#b3261e","zh":"下午 · 洛阳龙门站","en":"Afternoon · Luoyang Longmen Station","box":[299,1091,160]}},"home":[34.6736,112.4656],"hops":[{"from":"home","to":"a","q":[580,830],"t":[575,760,82],"fs":24,"txt":{"zh":"退房，打车去关林","en":"check out, taxi to Guanlin"}},{"from":"a","to":"b","q":[420,1100],"t":[360,1095,-20],"fs":24,"txt":{"zh":"打车去高铁站","en":"taxi to the station"}}],"places":[{"id":"a","L":"A","area":"m","kind":"sight","time":"11:31","name":{"zh":"关林","en":"Guanlin"},"pinName":{"zh":"关林","en":"Guanlin"},"lab":{"dx":18,"dy":-8,"a":"start"},"notes":{"zh":"三国时，关羽败走麦城被杀。相传孙权把他的首级送给曹操，想嫁祸于人；曹操看穿了，用王侯的礼节把首级葬在洛阳城南——就是这里。民间有句话：关公「头枕洛阳，身卧当阳，魂归故里」，身子埋在湖北当阳，老家在山西解州，三个地方都说关公是自己的。明朝在这里重修了庙，清朝康熙皇帝封它为「关圣大帝林」。从此和曲阜的孔林并列：一个文圣，一个武圣。","en":"In the Three Kingdoms era, Guan Yu was defeated and killed. The story goes that Sun Quan sent his head to Cao Cao, hoping to shift the blame; Cao Cao saw through it and buried the head south of Luoyang with the honours due a prince — right here. People say Guan Yu's 'head rests in Luoyang, his body lies in Dangyang, and his spirit went home' to Xiezhou in Shanxi, so three places all claim him. The Ming rebuilt the temple, and the Kangxi Emperor of the Qing named it the 'Forest of the Holy Emperor Guan' — ranking it with the Confucius Forest at Qufu: one sage of letters, one sage of war."},"left":[{"t":"label","zh":"关林","en":"GUANLIN · 关林"},{"c":"guanlin","w":"40%","r":2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"kbox","title":{"zh":"小知识 · 为什么叫「林」","en":"Field notes · why a 'forest'"},"intro":{"zh":"关庙到处都有，叫「林」的只有这一座。","en":"There are Guan temples everywhere; only this one is a 'forest'."},"rows":[{"h":{"zh":"圣人的墓叫林","en":"A sage's tomb is a 'forest'"},"t":{"zh":"帝王的墓叫陵，圣人的墓叫林。康熙五年（1666 年）封了「关圣大帝林」以后，这里就和孔林一样称「林」，在全世界的关庙里独一份。","en":"An emperor's tomb is a ling, a sage's is a lin, a 'forest'. After 1666 this became the Forest of the Holy Emperor Guan — the only Guan temple in the world allowed the title, like the Confucius Forest."}},{"h":{"zh":"三合一","en":"Three in one"},"t":{"zh":"冢、庙、林三祀合一：前面是庙，后面是关羽首级所葬的关冢——八角形的大土冢，高约 17 米，墓门上写着「钟灵处」。","en":"Tomb, temple and forest in one: the temple in front, and behind it the mound where the head is said to lie — octagonal, about 17 m high, its door inscribed 'where the spirit gathers'."}},{"h":{"zh":"数门钉","en":"Count the studs"},"t":{"zh":"大门上有 81 颗门钉，是最高的等级；第二道仪门是 49 颗。还记得十字街的门钉肉饼吗？","en":"The main gate has 81 studs, the highest rank; the second gate has 49. Remember the door-stud meat pies on Shizi Street?"}},{"h":{"zh":"睡着的关公","en":"Guan Yu asleep"},"t":{"zh":"后面的春秋殿是寝殿，里面有关公夜读《春秋》像，还有一尊关公睡像。","en":"The Spring and Autumn Hall at the back is his bedchamber, with a statue of Guan Yu reading the Spring and Autumn Annals by night — and one of him asleep."}}]},{"t":"photo","p":"p826","r":1,"w":"88%"},{"t":"photo","p":"p808","r":-1,"w":"56%","cap":{"zh":"数门钉","en":"Counting the studs"}},{"t":"row","p":["p819","p832"],"cap":[{"zh":"拜关公","en":"Bowing to Guan Yu"},null]},{"t":"photo","p":"p841","r":1,"w":"70%","cap":{"zh":"春秋殿里的关公睡像","en":"Guan Yu asleep in the Spring and Autumn Hall"}}],"right":[{"t":"photo","p":"p802","r":-1,"w":"76%","cap":{"zh":"红灯笼长廊","en":"The red-lantern walk"}},{"t":"note","txt":{"zh":"洛阳最后一站打卡关林。这里据说是关羽葬首之处。作为三国迷，顶着39度酷热也得去一次，（代价是中暑体验➕1😭）","en":"Last stop in Luoyang: Guanlin, said to be where Guan Yu's head is buried. As Three Kingdoms fans we had to go, even in 39°C heat (the price: one more round of heatstroke 😭)"}},{"t":"note","txt":{"zh":"最后一天兵分两路：我们去关林，四位老人去了应天门，看武则天登基的地方。","en":"On the last day we split up: we went to Guanlin, and the four grandparents went to Yingtian Gate, where Wu Zetian was crowned."}},{"t":"row","p":["p866","p871","p876"],"cap":[{"zh":"比一比大刀","en":"Trying out the big blade"},{"zh":"哥俩一起扛","en":"Two brothers, one blade"},null]},{"t":"note","txt":{"zh":"洛阳最后一站关林。民间有“头枕洛阳，身卧当阳，魂归故里”的说法；洛阳关林相传为关羽首级埋葬之处，也是海内外重要关庙之一。哥哥因为玩《三国群英传》，对关羽背景知识很多，关羽也是他用得最熟的武将。哥俩还试图一起扛起关刀——毫无疑问扛不动，他们终于明白为什么三国演义里要安排周仓帮关公扛刀。","en":"Our last stop in Luoyang was Guanlin. There's a folk saying that Guan Yu's 'head rests in Luoyang, his body lies in Dangyang, and his spirit went home'; Guanlin is traditionally where his head is buried, and it's one of the most important Guan temples anywhere. Thanks to the game Heroes of the Three Kingdoms, our older boy knows a lot about Guan Yu — he's the general he plays best. The two of them tried to lift the great blade together. Of course they couldn't, and at last they understood why, in Romance of the Three Kingdoms, Zhou Cang is there to carry it for him."},"by":"dad"},{"t":"row","p":["p812","p833"]},{"t":"photo","p":"p893","r":-1,"w":"48%"},{"t":"photo","p":"p883","r":1,"w":"44%"},{"t":"row","p":["p847","p858"],"cap":[null,{"zh":"关冢前","en":"Before the tomb mound"}]},{"t":"tip","txt":{"zh":"门票 ¥40（≈ $6），==12 岁及以下或 1.4 米以下免票==，12–18 岁半价；8:30–18:00。小说里说青龙偃月刀八十二斤，那是《三国演义》，不是史书。","en":"Tickets ¥40 (≈ $6); ==free for children 12 and under or under 1.4 m==, half price aged 12–18; open 8:30–18:00. The 82-catty Green Dragon blade comes from the novel Romance of the Three Kingdoms, not from history."}}],"cuts":[],"lat":34.6085941,"lon":112.4772852},{"id":"b","L":"B","area":"a","kind":"sight","time":"15:42","name":{"zh":"洛阳龙门站 · 再见洛阳","en":"Luoyang Longmen Station · Goodbye, Luoyang"},"pinName":{"zh":"洛阳龙门站","en":"Longmen Station"},"lab":{"dx":-18,"dy":6,"a":"end"},"notes":{"zh":"洛阳龙门站原来叫洛阳南站，2010 年通车，在郑西高铁上。从这里坐高铁到开封北，最快一个多小时。两千多年的洛阳，三天只看了一角：白马寺、古墓、龙门、关林。下一站，北宋的东京——开封。","en":"Luoyang Longmen Station, once Luoyang South, opened in 2010 on the Zhengzhou–Xi'an high-speed line. The fastest trains reach Kaifeng North in just over an hour. Three days gave us only a corner of two thousand years of Luoyang: the White Horse Temple, the tombs, Longmen, Guanlin. Next stop: Dongjing of the Northern Song — Kaifeng."},"left":[{"t":"label","zh":"龙门站","en":"LONGMEN STATION"},{"t":"notes"},{"t":"photo","p"   const VO=(D.voices||[]);const vtxt=v=>T(v.txt).split('\n').map(x=>x.startsWith('- ')?`<p class="hand vli">${md(x.slice(2))}</p>`:/^\d+\. /.test(x)?`<p class="hand vli vnum">${md(x)}</p>`:`<p class="hand">${md(x)}</p>`).join('');
  const BACK=`<button class="backmap" data-back><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>${T(UI.back)}</button>`;
  const vpage=(v,i)=>`<div class="pg vpg"><div class="pghead">${i?BACK:`<span>${D.ui.day}</span>`}<span class="tag vtag"><b>✎</b>${T(v.tag)}</span></div><div class="feelwrap vwrap">${vtxt(v)}</div>${(v.rows||[]).map(r=>block(r,{})).join('')}${v.credit?`<p class="vcredit">${T(v.credit)}</p>`:''}</div>`;
  const voice=pos=>{const vs=VO.filter(v=>v.pos===pos);if(!vs.length)return'';const wide=vs.filter(v=>v.wide).map(v=>`<figure class="vwide"><img src="${IMG[v.wide.p]}" alt=""><figcaption>${T(v.wide.cap)}<small>${T(v.wide.src||'')}</small></figcaption></figure>`).join('');return `<article class="spread vsp" id="sp-his">${vs.map(vpage).join('')}${vs.length===1?'<div class="pg"></div>':''}${wide}</article>`};
  $('#book').innerHTML=voice('start')+PL.map((p,i)=>{const col=p.kind==='food'?'#d9822b':'#24211e',ac=AR[p.area].color,nx=PL[i+1];
    const cut=side=>p.cuts.filter(c=>c.side===side).map(c=>`<img class="cut " src="${IMG['c_'+c.c]}" alt="" style="${c.s}">`).join('');
    return `<article class="spread" id="sp-${p.id}" aria-label="${p.L} ${T(p.name)}">${p.wide?`<figure class="vwide vtop"${p.wide.mx?` style="--wmx:${p.wide.mx}px"`:''}><img src="${IMG[p.wide.p[LANG]||p.wide.p.zh]}" alt="${T(p.wide.cap||'')}">${p.wide.cap?`<figcaption>${T(p.wide.cap)}</figcaption>`:''}</figure>`:''}
     <div class="pg"><div class="pghead"><span>${D.ui.day}</span><span class="tag"><b style="background:${col};box-shadow:0 0 0 3px ${ac}">${p.L}</b>${T(p.name)}</span></div>${blocks(p.left,p)}${cut('left')}</div>
     <div class="pg"><div class="pghead"><button class="backmap" data-back><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>${T(UI.back)}</button><span style="color:${ac}">${T(AR[p.area])}</span></div>${blocks(p.right,p)}${cut('right')}
      ${nx?`<button class="nextp" data-next="${nx.id}">${T(UI.next)} ${nx.L} · ${T(nx.name)}</button>`:''}</div></article>`}).join('')+voice('end');
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>$('#mapsheet').scrollIntoView({behavior:'smooth'}));
  document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>jump(b.dataset.next));
}
function jump(id){const el=$('#sp-'+id);if(!el)return;el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}

/* ---------------- text / language ---------------- */
function renderAll(){
  document.documentElement.lang=LANG==='en'?'en':'zh-CN';
  if(typeof INDEXURL!=='undefined'){const h=$('#t-home');h.href=INDEXURL;h.hidden=false;h.textContent=LANG==='en'?'← All trips':'← 全部旅行'}$('#t-title').textContent=T(UI.title);if(UI.badge)$('#t-badge').textContent=UI.badge;if(UI.maphead)$('#t-maphead').textContent=T(UI.maphead);$('#t-sub').textContent=T(UI.sub);$('#t-dayline').textContent=T(UI.dayline);$('#t-dayno').textContent=UI.day;$('#daynav').innerHTML=(D.days||[]).map(x=>x.url?`<a href="${x.url}" ${x.url.startsWith("#")?"":"target=\"_top\""} ${x.cur?'aria-current="page"':''}>${x.n}</a>`:`<button ${x.cur?'aria-pressed="true"':'disabled'}>${x.n}</button>`).join('');$('#t-hint').textContent=T(UI.hint);
  $('#legend').innerHTML=`<span><i style="background:var(--m)"></i>${T(UI.legendM)}</span><span><i style="background:var(--a)"></i>${T(UI.legendA)}</span><span><i style="background:var(--n)"></i>${T(UI.legendN)}</span><span><b style="background:#24211e">A</b>${T(UI.sight)}</span><span><b style="background:#d9822b">B</b>${T(UI.food)}</span>`;
  $('#chips').innerHTML=`<button class="chip" data-z="all">${T(UI.all)}</button>`+Object.entries(AR).map(([a,o])=>`<button class="chip ${a}" data-z="${a}">${T(o)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>zoomTo(c.dataset.z));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  $('#stops').innerHTML=PL.map(p=>`<button class="stopbtn" data-go="${p.id}"><b style="background:${p.kind==='food'?'#d9822b':'#24211e'};box-shadow:0 0 0 2px ${AR[p.area].color}">${p.L}</b>${T(p.name)}</button>`).join('');
  document.querySelectorAll('.stopbtn').forEach(b=>b.onclick=()=>jump(b.dataset.go));
  $('#tobook').textContent=T(UI.tobook);$('#t-fab').textContent=T(UI.fab);
  const keep={...vb};buildMap();vb=keep;applyVB();buildBook();
}
$('#tobook').onclick=()=>jump(PL[0].id);
$('#fab').onclick=()=>$('#mapsheet').scrollIntoView({behavior:'smooth'});
if('IntersectionObserver' in window){new IntersectionObserver(es=>{{const f=$('#fab');if(f)f.hidden=es[0].isIntersecting}},{threshold:0}).observe($('#mapsheet'))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('walk-lang',LANG)}catch(e){}renderAll()});
renderAll();
if(location.hash.startsWith('#sp-'))setTimeout(()=>jump(location.hash.slice(4)),300);
if(location.hash==='#zm')zoomTo('a');

/* tap a photo to see it large; tap again anywhere to close */
document.addEventListener('click',e=>{const im=e.target.closest('.book figure img');if(!im)return;const d=document.createElement('div');d.className='lbox fit';d.innerHTML=`<img src="${im.src}" alt=""><p>${LANG==='en'?'Tap anywhere to close':'点一下关闭'}</p>`;d.onclick=()=>d.remove();document.body.appendChild(d)});
</script>

</body></html>
