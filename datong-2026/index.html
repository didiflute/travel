<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>古都走廊 · 大同</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;700&family=Patrick+Hand&family=Courier+Prime&family=Long+Cang&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&family=Long+Cang&family=Noto+Serif+SC:wght@600&display=swap">
<style>
@font-face{font-family:"WenKai";src:url(wenkai.woff2) format("woff2");font-display:swap}
/* Layout: one big hand-drawn day map (three colored routes, pan/zoom) → a stack of journal spreads, one per stop, in the white-paper scrapbook style. */
:root{
  --desk:#1d1a17; --paper:#fbfaf6; --ink:#24211e; --ink-soft:#6b635a;
  --m:#2f7fb0; --a:#c4554b; --n:#6a4c9c; --food:#d9822b;
  --mark:#f6e48a; --green:#3d7a4a; --yellow:#e6b93a; --kraft:#6d4d3a; --cream:#f5edda;
  --f-hand:"WenKai","Kaiti SC","KaiTi",cursive;
  --f-enhand:"Patrick Hand","Comic Sans MS",cursive;
  --f-map:"Architects Daughter","Caveat",cursive;
  --f-ui:"Zen Maru Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  --f-type:"Courier Prime","Courier New",monospace;
  --f-serif:"Shippori Mincho B1","Songti SC",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--cream);font-family:var(--f-ui);padding:18px 16px 70px;
  background-image:radial-gradient(ellipse at 50% 0%,#2b2621 0%,#1d1a17 55%,#151311 100%)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto}
html[lang="en"] .hand{font-family:var(--f-enhand);font-size:1.2em;line-height:1.5}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand .badge{width:50px;height:50px;border-radius:50%;background:var(--a);color:var(--cream);display:grid;place-items:center;font-family:var(--f-serif);font-weight:800;font-size:20px;box-shadow:0 0 0 3px var(--desk),0 0 0 5px var(--a)}
.brand h1{margin:0;font-weight:900;font-size:clamp(22px,4vw,34px);letter-spacing:.1em;line-height:1.1}
.brand p{margin:3px 0 0;font-family:var(--f-map);font-size:13px;letter-spacing:.14em;color:#b7ab95}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.days{display:flex;gap:6px}
.days button,.days a{border:1.5px solid #6b6155;background:none;padding:5px 11px;font-family:var(--f-map);font-size:15px;color:#b7ab95;text-decoration:none}.days a:hover{border-color:var(--yellow);color:var(--yellow)}
.days button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.days button[disabled]{opacity:.4;cursor:not-allowed}
.homelink{border:1.5px solid #6b6155;padding:5px 11px;font-family:var(--f-map);font-size:15px;color:#b7ab95;text-decoration:none;white-space:nowrap}.homelink:hover{border-color:var(--yellow);color:var(--yellow)}
.lang{display:flex;border:1.5px solid var(--cream);border-radius:20px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 12px;font-size:13px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}

/* ---------- map sheet ---------- */
.sheet{background:#efeee9;color:var(--ink);border-radius:3px;padding:16px clamp(10px,2vw,22px) 18px;box-shadow:0 28px 60px #000a;position:relative;
  background-image:linear-gradient(90deg,#0000 49.7%,#0000000c 50%,#ffffff60 50.2%,#0000 50.6%),linear-gradient(180deg,#0000 49.7%,#0000000a 50%,#ffffff50 50.2%,#0000 50.6%)}
.sheethead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 18px;margin-bottom:10px}
.sheethead h2{margin:0;font-family:var(--f-map);font-weight:400;font-size:clamp(24px,3.4vw,36px);letter-spacing:.03em;line-height:1}
.sheethead h2 small{display:block;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--ink-soft);margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:26px;height:5px;border-radius:3px}
.legend b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;color:#fff;font-size:10px;font-family:var(--f-map)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:2px solid var(--ink);background:#fff;padding:4px 12px;border-radius:18px;font-size:13px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.m{border-color:var(--m)}.chip.a{border-color:var(--a)}.chip.n{border-color:var(--n)}
.chip.m[aria-pressed="true"]{background:var(--m)}.chip.a[aria-pressed="true"]{background:var(--a)}.chip.n[aria-pressed="true"]{background:var(--n)}
.mapbox{position:relative;border:2px solid #8e897f;background:#e6e5df;overflow:hidden;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.mapbox svg{display:block;width:100%;height:auto;cursor:grab}
.mapbox svg:active{cursor:grabbing}
.zoombtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombtns button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:20px;font-weight:900;line-height:1}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--ink-soft)}
.pin{cursor:pointer}
.pin:focus{outline:none}
#map .deco{transition:opacity .35s}
.pin:focus .ring,.pin:hover .ring{stroke:var(--yellow);stroke-width:5}

/* ---------- spreads ---------- */
.book{margin-top:44px;display:flex;flex-direction:column;gap:46px}
.spread{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:3px;box-shadow:0 26px 60px #000a;position:relative;scroll-margin-top:16px;color:var(--ink)}
.spread::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:60px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,#0000,#00000010 40%,#00000028 50%,#00000010 60%,#0000)}
.pg{position:relative;min-width:0;padding:26px 38px 34px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.pghead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-map);font-size:19px}
.pghead .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:900;font-size:15px;letter-spacing:.06em}
.pghead .tag b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-family:var(--f-map);font-size:14px}
.notes{background:#fff;border:1px solid #d9d4c8;padding:10px 14px 12px;position:relative;font-family:var(--f-hand);font-size:16.5px;line-height:1.7;color:#3a3530;max-width:36em;box-shadow:2px 2px 0 #0000000d;z-index:2}
.notes::before{content:attr(data-tag);position:absolute;top:-10px;left:12px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.14em;padding:1px 8px}
html[lang="en"] .notes{font-family:var(--f-enhand);font-size:17.5px;line-height:1.5}
.hand{font-family:var(--f-hand);font-size:21px;line-height:1.62;margin:0;max-width:34em;position:relative;z-index:2}
.feelwrap{position:relative;z-index:2}
.deco-st{display:block;max-width:280px;transform:rotate(var(--r));filter:drop-shadow(0 3px 5px #0003);position:relative;z-index:4;pointer-events:none}
@media (max-width:760px){.deco-st{max-width:170px}}
.deco-wrap{position:relative;z-index:4;max-width:230px;shape-image-threshold:.35;shape-margin:8px;transform:rotate(var(--r));filter:drop-shadow(0 3px 5px #0003);pointer-events:none}
.deco-wrap.right{float:right;margin:0 -6px 4px 10px}.deco-wrap.left{float:left;margin:0 10px 4px -6px}
[data-wrap]{display:flow-root}
@media (max-width:760px){.deco-wrap{max-width:150px}}

.callout{position:relative;align-self:center;margin:8px 0 18px;padding:16px 26px;background:#fff;border:2px solid var(--ink);border-radius:26px;transform:rotate(-2deg);box-shadow:4px 4px 0 #24211e22;max-width:88%}
.callout::after{content:"";position:absolute;left:38px;bottom:-14px;width:22px;height:22px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.callout p{margin:0;font-family:var(--f-hand);font-size:24px;line-height:1.4;color:var(--a)}
html[lang="en"] .callout p{font-family:var(--f-enhand);font-size:26px}
.vcredit{margin:-6px 0 0;font-size:11px;color:#9a8f84;text-align:right}
.vwide{grid-column:1/-1;margin:0;padding:6px 38px 34px;position:relative;z-index:30;background:var(--paper)}.vwide img{display:block;width:100%;height:auto;border:8px solid #fff;box-shadow:0 6px 16px #0003}.vwide figcaption{font-family:var(--f-hand);font-size:16px;color:#2f3f63;margin-top:8px}.vwide figcaption small{display:block;font-family:var(--f-ui);font-size:11px;color:#9a8f84;margin-top:2px}@media (max-width:760px){.vwide{padding:6px 12px 24px}}
.vtag b{background:#34405a;box-shadow:0 0 0 3px #c9d3e6}
.vwrap .hand{color:#2f3f63}
.vwrap .hand+.hand{margin-top:.55em}
.vli{padding-left:1.1em;text-indent:-1.1em}.vli:not(.vnum)::before{content:"· "}.vnum{padding-left:1.35em;text-indent:-1.35em}
.vwrap .vli+.vli{margin-top:.3em}
.lettersp::before,.lettersp::after{display:none!important}.lettersp{grid-template-columns:1fr;background:transparent;box-shadow:none;padding:6px 0}.lettersp+.lettersp .letter{transform:rotate(.5deg)}
.letter{--blue:#34405a;position:relative;max-width:760px;margin:0 auto;background:#efe4cc;background-image:radial-gradient(#0000 60%,#b8955a22),linear-gradient(#ffffff18,#ffffff18);padding:34px 48px 34px;box-shadow:0 18px 40px #0008,inset 0 0 0 1px #d9c8a4;border-radius:2px;transform:rotate(-.6deg);color:var(--blue)}
.letter::before{content:"";position:absolute;inset:12px;border:1px solid #c8b38a;pointer-events:none}
.letter::after{content:"";position:absolute;top:-12px;left:50%;width:110px;height:26px;transform:translateX(-50%) rotate(2deg);background:#d7c8a6cc}
.ltag{font-family:var(--f-map);font-size:14px;letter-spacing:.08em;color:#8a6a3a;border-bottom:1.5px solid #8a6a3a;display:inline-block;margin-bottom:12px}
.lt{font-family:var(--f-hand);font-size:20px;line-height:1.75;margin:0;color:var(--blue)}
.lt+.lt{margin-top:.5em}
.lt.li{padding-left:1.2em;text-indent:-1.2em}.lt.li:not(.num)::before{content:"· ";}.lt.num{padding-left:1.4em;text-indent:-1.4em}
.lt.li+.lt.li{margin-top:.25em}
html[lang="en"] .lt{font-family:var(--f-enhand);font-size:23px;line-height:1.5}
@media (max-width:760px){.letter{padding:26px 22px;transform:none}.lt{font-size:18px}html[lang="en"] .lt{font-size:21px}}

.feelwrap .ft{font-family:var(--f-map);font-size:14px;color:var(--a);letter-spacing:.06em}
mark{background:linear-gradient(100deg,#0000 1%,var(--mark) 3%,var(--mark) 97%,#0000 99%) no-repeat 0 60%/100% 72%;color:inherit;padding:0 .1em}
.row{display:grid;gap:6px;position:relative;z-index:1}
.row figure,.wall figure{margin:0;overflow:hidden;position:relative;background:#ddd}
.row figure{aspect-ratio:var(--ar,4/3)}
.row img{object-position:center 30%}
.row img,.wall img{width:100%;height:100%;object-fit:cover;display:block}
.photo{margin:0;align-self:center;width:88%;background:#fff;padding:8px;box-shadow:0 6px 16px #0003;position:relative;z-index:1}
.photo img{display:block;width:100%;max-height:420px;object-fit:cover}
.pcap{font-family:var(--f-hand);font-size:15px;color:#4a4038;padding:8px 2px 0;line-height:1.45}.credit{position:absolute;right:14px;top:14px;background:#fffdf7e6;color:#5a4f45;font-family:var(--f-enhand);font-size:13px;padding:1px 7px;border-radius:3px;transform:rotate(1.5deg);box-shadow:0 1px 3px #0002}.pcap small{display:block;font-family:var(--f-ui,sans-serif);font-size:10.5px;color:#9a8f84;margin-top:2px}
.wall{display:grid;gap:5px}
.wall figure{aspect-ratio:1}
.wall figcaption,.row figcaption{position:absolute;left:5px;right:5px;bottom:3px;font-family:var(--f-hand);font-size:15px;color:#fff;text-shadow:0 1px 3px #000d;line-height:1.2}
html[lang="en"] .wall figcaption{font-family:var(--f-enhand);font-size:17px}
.pghead{position:relative;z-index:6}
.cut{position:absolute;z-index:4;filter:drop-shadow(0 4px 6px #0003);pointer-events:none;transform:rotate(var(--r,0deg))}
.sketch{width:70%;align-self:flex-end;opacity:.9;mix-blend-mode:multiply}
.big{font-family:var(--f-serif);font-weight:800;font-size:clamp(48px,7vw,86px);line-height:.9;color:var(--green);letter-spacing:.01em;margin-top:auto}
/* station sign */
.ekimei{align-self:flex-start;width:min(300px,78%);background:#fff;border:1.5px solid var(--ink);box-shadow:3px 3px 0 #0000001c;position:relative;z-index:2;transform:rotate(-1.5deg)}
.em-main{text-align:center;padding:8px 10px 4px}
.em-main small{display:block;font-size:13px;letter-spacing:.4em;color:#555}
.em-main b{display:block;font-size:40px;font-weight:900;letter-spacing:.2em;line-height:1.1}
.em-main i{display:block;font-style:normal;font-family:var(--f-map);font-size:15px;letter-spacing:.1em}
.em-num{position:absolute;left:10px;top:12px;width:44px;height:44px;border:4px solid var(--line);border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:16px;line-height:.9;text-align:center}
.em-num span{display:block;font-size:11px}
.em-bar{display:flex;justify-content:space-between;gap:6px;background:var(--line);color:#fff;font-size:10.5px;padding:3px 8px;font-weight:700}
.ekimei.metro{--line:#9a9a92}.ekimei.metro .em-num{border-radius:50%}
.ekimei.jr{--line:#80c241}
.label{align-self:flex-start;background:var(--kraft);color:var(--cream);font-family:var(--f-serif);font-weight:800;font-size:26px;letter-spacing:.12em;padding:8px 16px;line-height:1.15;transform:rotate(-1deg);box-shadow:3px 3px 0 #0000001c;position:relative;z-index:2}
.label small{display:block;font-family:var(--f-map);font-weight:400;font-size:12px;letter-spacing:.14em}
.stamp{align-self:flex-start;width:122px;height:122px;border-radius:50%;border:3px solid #c0453d;color:#c0453d;display:grid;place-items:center;text-align:center;transform:rotate(-10deg);mix-blend-mode:multiply;position:relative;z-index:2}
.stamp::before{content:"";position:absolute;inset:6px;border:1.5px solid #c0453d;border-radius:50%}
.stamp b{display:block;font-family:var(--f-serif);font-size:32px;line-height:1}
.stamp small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;max-width:84px}
.match{align-self:flex-start;width:178px;height:110px;background:var(--a);color:var(--cream);border:5px solid var(--cream);outline:2px solid var(--a);transform:rotate(-4deg);display:grid;place-items:center;text-align:center;box-shadow:0 5px 10px #0003;position:relative;z-index:2}
.match b{display:block;font-weight:900;font-size:22px;letter-spacing:.08em}
.match small{display:block;font-family:var(--f-serif);font-size:11px;letter-spacing:.04em;margin-top:3px}
.price{align-self:flex-start;background:#fff8d9;border:1.5px dashed var(--ink);padding:4px 14px 4px 22px;font-family:var(--f-map);font-size:18px;transform:rotate(3deg);position:relative;z-index:2;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.price b{font-family:var(--f-ui);font-size:20px;margin-left:8px}
.circles{position:relative;height:600px}
.circles .dot{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;padding:13%}
.circles .dot.g{background:var(--green);color:#fffbe8}.circles .dot.y{background:var(--yellow);color:var(--ink)}
.circles .dot:nth-child(1){left:0;top:0}.circles .dot:nth-child(2){right:0;top:30%}.circles .dot:nth-child(3){left:4%;top:60%}
.circles .dot p{margin:0;font-family:var(--f-hand);font-size:27px;line-height:1.25;text-align:center;position:relative;z-index:1}
html[lang="en"] .circles .dot p{font-family:var(--f-enhand);font-size:24px}
.circles .cc{position:absolute;z-index:3;width:40%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid var(--paper);box-shadow:0 4px 8px #0003}
.circles .dot:nth-child(1) .cc{right:-20%;top:-2%}.circles .dot:nth-child(2) .cc{right:-8%;bottom:-18%}.circles .dot:nth-child(3) .cc{right:-34%;bottom:4%}
.slip{align-self:flex-end;width:44%;margin:0;background:#fff;padding:6px 6px 24px;box-shadow:0 4px 10px #0003;transform:rotate(4deg);position:relative;z-index:3}
.slip img{display:block;width:100%}
.slip figcaption{position:absolute;bottom:3px;left:8px;font-family:var(--f-hand);font-size:15px}
.film{background:#191714;padding:16px 38px;margin:0 -38px;position:relative;display:flex;gap:6px;overflow:hidden}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:9px;background:repeating-linear-gradient(90deg,#0000 0 7px,#e9e2cf 7px 15px,#0000 15px 22px)}
.film::before{top:3px}.film::after{bottom:3px}
.film img{height:150px;width:auto;flex:none;display:block}
.belt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;background:repeating-linear-gradient(90deg,#c9c3b6 0 2px,#ddd7ca 2px 26px);border-radius:12px;border:3px solid #9a9184}
.belt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 6px #0003;display:block}
.endmark{font-family:var(--f-map);font-size:22px;text-align:center;margin-top:auto;color:var(--ink-soft)}
.nextp{align-self:flex-end;margin-top:auto;background:var(--paper);border:0;box-shadow:0 0 0 6px var(--paper);border-bottom:1.5px solid var(--a);color:var(--a);font-weight:700;font-size:13px;padding:2px 0;position:relative;z-index:6}
.draft{font-size:12px;color:#8a8278;margin:0}

@media (max-width:860px){
  .spread{grid-template-columns:1fr}
  .spread::after{display:none}
  .pg{padding:20px 18px 26px}
  .film{margin:0 -18px;padding:14px 18px}
  .film img{height:104px}
  .circles{height:auto;display:flex;flex-direction:column}
  .circles .dot{position:relative;left:auto!important;right:auto!important;top:auto!important;width:74%}
  .circles .dot:nth-child(2){align-self:flex-end;margin-top:-12%}
  .circles .dot:nth-child(3){margin-top:-12%}
  .hand{font-size:19px}
  .photo{width:100%}
}

.stops{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.stopbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid #cfc9bd;border-radius:20px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700;color:var(--ink)}
.stopbtn b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-family:var(--f-map);font-size:13px}
.stopbtn:hover{border-color:var(--ink)}
.tobook{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:12px;background:var(--ink);color:#fff;border:0;border-radius:6px;font-weight:900;font-size:15px;letter-spacing:.1em}
.backmap{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:5px 12px 5px 9px;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.06em}
.backmap:hover{background:var(--a)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:26px;padding:10px 16px 10px 12px;font-weight:900;font-size:15px;letter-spacing:.06em;box-shadow:0 6px 16px #0007}
.fab:hover{background:#f1cb55}

.feelwrap .hand+.hand{margin-top:.55em}
.duo{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start}
.duo .photo{width:100%;margin:0}
.duo .photo img{max-height:330px}

time":"20:54","lat":40.0508,"lon":113.2889,"nudge":[-60,-30],"name":{"zh":"到大同","en":"Arriving in Datong"},"pinName":{"zh":"到大同","en":"Arriving"},"lab":{"dx":-18,"dy":-8,"a":"end"},"wide":{"p":{"zh":"p3001","en":"p3002"},"mx":620},"notes":{"zh":"大同在山西最北边，挨着内蒙古，是这一路最北的一站。北魏时它叫平城，是鲜卑人的都城，前后将近一百年。「大同」这个名字要到辽代才有：1044 年，辽把这里升为西京大同府，名字来自附近的大同川。从西安、洛阳到开封，一路都是中原王朝的都城；到了大同，主角换成了从草原上来的鲜卑人。北魏的故事，在洛阳的龙门听过了后半段，前半段在这里。","en":"Datong sits at the very top of Shanxi, against Inner Mongolia — the northernmost stop of the trip. Under the Northern Wei it was Pingcheng, capital of the Xianbei for almost a hundred years. The name Datong only came with the Liao: in 1044 they made it their Western Capital, Datong Prefecture, after the nearby Datong River. Xi'an, Luoyang and Kaifeng were all capitals of the central-plains dynasties; in Datong the leading role goes to the Xianbei, horsemen from the grasslands. We had heard the second half of the Northern Wei story at Longmen in Luoyang; the first half is here."},"left":[{"t":"label","zh":"平城","en":"PINGCHENG · 平城"},{"c":"chengluo","w":"40%","r":-2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"photo","p":"p001","r":-1,"w":"86%","cap":{"zh":"山西境内，高铁窗外的黄土高原","en":"Somewhere in Shanxi: loess hills from the train"}},{"t":"row","p":["p007","p008"],"cap":[{"zh":"第二天一早，哥哥在酒店便签上写的歌词","en":"Next morning: song lyrics our older boy wrote on the hotel notepad"},null]}],"right":[{"t":"photo","p":"p003","r":1,"w":"62%","cap":{"zh":"到大同的第一顿晚饭","en":"First supper in Datong"}},{"t":"photo","p":"p004","r":-1.5,"w":"52%","cap":{"zh":"烧麦","en":"Shaomai"}},{"c":"shaomai","w":"34%","r":2,"a":"r","wrap":1,"mt":4,"t":"deco"},{"t":"kbox","title":{"zh":"小知识 · 大同烧麦","en":"Field notes · Datong shaomai"},"intro":{"zh":"和南方的糯米烧卖，是两回事。","en":"Nothing like the sticky-rice shaomai of the south."},"rows":[{"h":{"zh":"皮","en":"The wrapper"},"t":{"zh":"擀得极薄，几层面片撒上干淀粉叠在一起，用一种叫「走锤」的擀面杖压出一圈荷叶花边。蒸好了雪白透亮，隔着皮能看见馅。","en":"Rolled paper-thin: sheets are stacked with dry starch between them and pressed with a special rolling pin into frilly lotus-leaf edges. Steamed, they turn translucent — you can see the filling through the skin."}},{"h":{"zh":"馅","en":"The filling"},"t":{"zh":"羊肉配大葱，不放糯米。收口不封死，顶上开着口，像一朵花。","en":"Lamb and spring onion, no rice. The top is left open, like a flower."}},{"h":{"zh":"名字","en":"The name"},"t":{"zh":"一说叫「稍麦」：收口处沾着干面粉，像麦穗梢上的白霜；一说是「捎卖」：从前茶馆里顺带着卖的。吃完配一壶砖茶解腻。","en":"One story says 'wheat-tip', for the floury top like frost on an ear of wheat; another says 'sold on the side', in old teahouses. Wash it down with brick tea."}}]},{"t":"note","txt":{"zh":"这次古都之行的最后一站，大同。这是我第一次到山西，发现大同的确是古建筑和古雕刻爱好者的福地。","en":"The last stop of our ancient-capitals trip: Datong. It was my first time in Shanxi, and Datong really is a paradise for anyone who loves old buildings and old carving."},"by":"dad"},{"t":"tip","txt":{"zh":"开封到大同没有直达的高铁，==要在郑州东、太原南换两次车==，是这一路最长的一段。带够零食、平板和充电宝。","en":"There's no direct train from Kaifeng to Datong: ==change at Zhengzhou East and Taiyuan South==. It's the longest leg of the trip, so pack snacks, tablets and power banks."}}],"cuts":[]},{"id":"b","L":"B","area":"m","kind":"sight","time":"11:16","name":{"zh":"云冈石窟 · 进门和东头","en":"Yungang · the way in and the eastern caves"},"pinName":{"zh":"云冈石窟","en":"Yungang Grottoes"},"lab":{"dx":0,"dy":34,"a":"middle"},"notes":{"zh":"云冈的故事，要从一匹马说起。北魏太武帝灭过一次佛，到了孙子文成帝，佛教才重新抬起头。有个叫昙曜的和尚进京，路上正碰上皇帝出行——皇帝的马走过来，一口叼住了昙曜的衣襟，怎么也不松口。大家都说：「马认得好人。」皇帝从此拜他为师。昙曜趁机提了个大项目：在京城西边的武州山上，开五个大窟。这一开就停不下来了——今天的云冈东西绵延约一公里，主要洞窟 45 个，大大小小的佛像五万九千多尊（老说法是五万一千多）。窟号从东往西排，我们也从东头的第 1 窟开始，一路往西走。","en":"Yungang's story starts with a horse. Emperor Taiwu of the Northern Wei had once persecuted Buddhism; only under his grandson, Emperor Wencheng, did it lift its head again. A monk named Tanyao was on his way to the capital when he met the emperor's procession — and the emperor's horse walked up, took Tanyao's robe in its teeth and would not let go. 'The horse knows a good man,' everyone said, and the emperor made him his teacher. Tanyao seized the moment and proposed a big project: five great caves in Mount Wuzhou, west of the capital. Once begun, it never quite stopped. Today Yungang runs about a kilometre east to west, with 45 main caves and some 59,000 carved figures (the older count was 51,000). The caves are numbered from east to west, and so we started at Cave 1 and walked west."},"left":[{"t":"label","zh":"云冈","en":"YUNGANG · 云冈"},{"c":"yungang","w":"36%","r":2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"row","p":["p009","p011"],"cap":[{"zh":"进门的佛光大道","en":"The avenue in"},null]},{"t":"kbox","title":{"zh":"小知识 · 东头三窟","en":"Field notes · the first three caves"},"intro":{"zh":"进门那一路是新修的；从第 1 窟开始，是一千五百年前的。","en":"The approach is new; from Cave 1 on, it's fifteen centuries old."},"rows":[{"h":{"zh":"进门那一路","en":"The approach"},"t":{"zh":"佛光大道、浮雕墙、灵岩寺，都是 2008 年以后新建的，想重现郦道元《水经注》里写的「山堂水殿，烟寺相望」。","en":"The pillared avenue, the relief wall and Lingyan Temple were all built after 2008, to bring back the 'mountain halls and water pavilions' Li Daoyuan described in the sixth century."}},{"h":{"zh":"第 1、2 窟","en":"Caves 1 and 2"},"t":{"zh":"一对双窟，中间各立一根方形塔柱，人可以绕着塔柱走一圈——古人就是这样一边绕塔一边礼佛的。","en":"A pair, each with a square pagoda-pillar in the middle that you walk around — circling the pagoda was how people worshipped."}},{"h":{"zh":"第 3 窟","en":"Cave 3"},"t":{"zh":"云冈最大的窟，也是最大的「烂尾工程」：崖面上那一排方孔原来是插木梁的，北魏没修完。后室的一佛二菩萨脸特别圆润，很多学者认为是隋唐时补雕的。","en":"Yungang's biggest cave — and its biggest unfinished one: the row of square holes once held timber beams, and the Wei never completed it. The round-faced Buddha and bodhisattvas in the back chamber are thought by many to be later, Sui or Tang, additions."}}]},{"t":"row","p":["p012","p014"],"cap":[{"zh":"浮雕墙","en":"The relief wall"},null]},{"t":"photo","p":"p006","r":1,"w":"30%","cap":{"zh":"照着走的路线","en":"The route we followed"}},{"t":"row","p":["p040","p045","p047"]}],"right":[{"t":"note","txt":{"zh":"云冈石窟，本以为洛阳龙门石窟就足够震撼了，云冈石窟亲眼所见才更觉其权威性！太太太美了！","en":"Yungang Grottoes. I thought Longmen in Luoyang was as stunning as it gets, but seeing Yungang with my own eyes, I felt its authority even more! Sooo beautiful!"}},{"t":"row","p":["p021","p016"],"cap":[{"zh":"第 1、2 窟的中心塔柱","en":"The pagoda-pillars of Caves 1–2"},null]},{"t":"row","p":["p018","p019"]},{"t":"photo","p":"p029","r":-1,"w":"64%","cap":{"zh":"第 3 窟：崖面上一排插木梁的方孔","en":"Cave 3: the row of beam holes"}},{"t":"photo","p":"p034","r":1,"w":"56%","cap":{"zh":"第 3 窟后室：一佛二菩萨","en":"Cave 3: a Buddha and two bodhisattvas"}},{"t":"row","p":["p051","p053"],"cap":[{"zh":"头顶的开口透进一束光，落在佛身上","en":"Light falls through an opening overhead onto the Buddha"},null]},{"t":"note","txt":{"zh":"第3窟是云冈最大的窟，也是一个没凿完的窟。\n我们进去的时候，太阳正好从上面的开口斜着照进来，落在大佛头上，佛脸一半亮，一半暗。燕子在洞里飞进飞出，叽叽喳喳，不怕人，也不怕佛。佛是一千五百年前的佛，燕子是今年的燕子，有种奇妙的时空交错感。","en":"Cave 3 is Yungang's biggest cave, and an unfinished one.\nWhen we went in, the sun was slanting through the opening above and falling on the Buddha's head — half his face lit, half in shadow. Swallows flew in and out of the cave, chattering, unafraid of people, unafraid of the Buddha. The Buddha is fifteen hundred years old; the swallows are this year's. A strange, wonderful sense of time folding in on itself."}},{"t":"tip","txt":{"zh":"云冈门票旺季（4/1–10/31）¥120（≈ $18），半价 ¥60（≈ $9），以当日公示为准。==现场不卖票，要提前在小程序「云冈研究院」或「云冈文旅」预约==，可约 7 天内（不含当天）。","en":"Tickets in high season (Apr 1–Oct 31): ¥120 (≈ $18), half price ¥60 (≈ $9) — check on the day. ==No tickets at the gate: book ahead on the 'Yungang Research Institute' or 'Yungang Tourism' WeChat mini-programme==, up to 7 days ahead (not same-day)."}}],"cuts":[],"lat":40.1077912,"lon":113.1347011},{"id":"c","L":"C","area":"m","kind":"sight","time":"11:53","name":{"zh":"云冈石窟 · 木楼阁和佛传故事","en":"Yungang · the pavilions and the Buddha's life"},"pinName":{"zh":"第 5–8 窟","en":"Caves 5–8"},"lab":{"dx":20,"dy":-16,"a":"start"},"notes":{"zh":"从第 5 窟开始，进入云冈最豪华的一段。第 5、6 窟门口挂着两座四层的红木楼阁，是清顺治八年（1651）修的，一根铁钉都没用，全靠榫卯，像给石窟穿了件外套。第 5 窟坐着云冈最大的佛，高 17 米，五六层楼那么高。第 6 窟正中一根两层的大塔柱一直顶到窟顶，塔柱和四面墙上刻了三十多幅佛陀的一生：出生、出城看见生老病死、半夜骑马出家、坐在树下成佛……一圈走下来，就是一本石头刻的连环画。第 7、8 窟是一对双窟，窟前搭着三层木窟檐。","en":"From Cave 5 on, you enter Yungang's most lavish stretch. Two four-storey red timber pavilions hang over the mouths of Caves 5 and 6, built in 1651 without a single iron nail — all joinery — like a coat thrown over the caves. Cave 5 holds Yungang's biggest Buddha, 17 metres, as tall as a five- or six-storey building. In Cave 6 a two-tier pagoda-pillar rises right to the ceiling, and the pillar and four walls carry more than thirty scenes of the Buddha's life: his birth, the trip outside the palace where he meets old age, sickness and death, the midnight ride away from home, enlightenment under the tree. Walk round once and you've read a comic book in stone. Caves 7 and 8 are a pair, fronted by three-storey timber eaves."},"left":[{"t":"label","zh":"佛传故事","en":"THE BUDDHA'S LIFE IN STONE"},{"t":"notes"},{"t":"photo","p":"p134","r":-1,"w":"62%","cap":{"zh":"第 5、6 窟前的清代木楼阁","en":"The Qing pavilions over Caves 5 and 6"}},{"t":"kbox","title":{"zh":"小知识 · 云冈的三个时期","en":"Field notes · Yungang in three acts"},"intro":{"zh":"从「外国脸」到「中国脸」，六十多年。","en":"From foreign faces to Chinese faces in sixty-odd years."},"rows":[{"h":{"zh":"早期 460 年起","en":"Early, from 460"},"t":{"zh":"昙曜五窟。鲜卑人还没汉化，大佛高鼻深目、肩膀宽厚，衣服薄薄地贴在身上——印度、中亚的样子。","en":"Tanyao's five caves. The Xianbei are not yet Sinicized; the Buddhas are high-nosed and broad-shouldered, robes clinging thin — the look of India and Central Asia."}},{"h":{"zh":"中期 471–494","en":"Middle, 471–494"},"t":{"zh":"冯太后和孙子孝文帝一起掌权，时人称「二圣」，云冈也冒出一对一对的双窟。486 年改穿汉服，第 6 窟里的佛也换上了宽袍大袖的「褒衣博带」。最华丽的窟都在这一段。","en":"Empress Dowager Feng and her grandson Emperor Xiaowen rule together — 'the Two Sages' — and paired twin caves appear. In 486 the court adopts Chinese dress, and in Cave 6 the Buddha changes into loose Chinese robes too. The most splendid caves date from now."}},{"h":{"zh":"晚期 494–524","en":"Late, 494–524"},"t":{"zh":"迁都洛阳，皇家大工程停了。留下来的人在西头开中小窟，佛像变得清瘦，脖子细长——「秀骨清像」，到了洛阳龙门，就长成这个样子。","en":"The capital moves to Luoyang and the imperial works stop. Those left behind carve smaller caves in the west; the Buddhas grow slender, long-necked — the 'lean and elegant' look that Longmen would make famous."}}]},{"t":"row","p":["p059","p060"],"cap":[null,{"zh":"清代重画的彩绘","en":"Colours repainted under the Qing"}]},{"t":"row","p":["p092","p095"]},{"t":"kbox","title":{"zh":"小知识 · 颜色是哪一朝的","en":"Field notes · whose colours?"},"intro":{"zh":"红绿蓝金，不全是北魏的。","en":"Not all of the reds, greens, blues and gold are Northern Wei."},"rows":[{"h":{"zh":"北魏原彩","en":"Wei originals"},"t":{"zh":"北魏开窟时就上了色，今天还能找到的原彩，多半藏在中小佛龛的背光里。","en":"The Wei painted from the start; the original colour that survives hides mostly in the haloes of small niches."}},{"h":{"zh":"清代那一层","en":"The Qing layer"},"t":{"zh":"大佛脸上那种浓艳的颜色，多是清代给佛像包上泥、重新画的。有的地方泥皮掉了一半，露出底下北魏的石头脸——半张脸在北魏，半张脸在大清。","en":"The bright colours on the big Buddhas are mostly Qing: the statues were coated in clay and repainted. Where the clay has half fallen away, the Wei stone face shows underneath — half a face in the Wei, half in the Qing."}},{"h":{"zh":"今天怎么修","en":"How it's cared for"},"t":{"zh":"云冈的规矩是不剥清代泥皮，也不重新上色——北魏是历史，清朝也是历史。","en":"Yungang's rule is to neither strip the Qing clay nor repaint: the Wei is history, and so is the Qing."}}]},{"t":"note","txt":{"zh":"原本以为刚看过龙门石窟，再看云冈石窟，新鲜感多少会打点折扣。没想到云冈完全是另一种震撼：宏大、华丽、绚烂，很多洞窟里历经千年仍能看到残存的色彩。","en":"Having just seen Longmen, I assumed Yungang would feel a little less new. Not at all — it's a different kind of awe: vast, ornate, dazzling, and in many caves you can still see traces of colour after a thousand-odd years."},"by":"dad"},{"t":"photo","p":"p164","r":1,"w":"70%"}],"right":[{"t":"note","txt":{"zh":"第5窟、第6窟前面，贴着山崖盖了两座木头楼阁。红柱子，青绿的顶，一层叠一层，靠在石头上。这是清朝顺治八年（1651）盖的，三百多年了，在云冈还只能算“新”的。\n楼阁替佛挡了三百多年的风雨，所以第5窟里的彩画，是云冈保存得最好的一批。\n楼里也有燕子，在梁上、檐下飞来飞去。\n石窟是北魏凿的，楼是清朝盖的，燕子是今年飞来的。石头被风沙磨得粗粗的，木楼也旧了，燕子却不管这些，照样进进出出。隔着一千多年，它们凑在一处，谁也不打扰谁，倒像是早就约好了的。\n崖壁朝着南，太阳晒了一千五百年。站在楼下，总觉得下一刻，就会有一个人牵着一匹白马，从山道上转出来，在楼前站一站，抬头看一眼佛，什么也不说，又走了。","en":"In front of Caves 5 and 6, two wooden pavilions were built right against the cliff. Red pillars, a blue-green roof, storey upon storey, leaning on the stone. They went up in 1651, the eighth year of the Qing Shunzhi Emperor — more than three hundred years ago, and yet at Yungang they still count as 'new'.\nFor three hundred years the pavilions have kept the wind and rain off the Buddhas, which is why the paintings in Cave 5 are among the best preserved at Yungang.\nThere are swallows in the pavilion too, flitting about the beams and under the eaves.\nThe caves were cut under the Northern Wei, the pavilion was built under the Qing, the swallows flew in this year. The stone has been worn rough by wind and sand, the wooden pavilion has grown old, but the swallows pay no attention and go in and out as always. A thousand years apart, they have come together in one place, none disturbing the others, as if it had all been arranged long ago.\nThe cliff faces south; the sun has shone on it for fifteen hundred years. Standing below the pavilion, you can't help feeling that any moment now a man leading a white horse will come round the bend of the mountain path, stand a while before the pavilion, glance up at the Buddha, say nothing, and go on his way."}},{"t":"photo","p":"p061","r":1,"w":"60%","cap":{"zh":"中心塔柱，四面都是佛龛","en":"A pagoda-pillar, niches on every side"}},{"t":"row","p":["p066","p070","p073"]},{"t":"row","p":["p077","p080"]},{"t":"photo","p":"p081","r":-1,"w":"52%","cap":{"zh":"第 7、8 窟三层的木窟檐","en":"The three-storey eaves of Caves 7 and 8"}},{"t":"row","p":["p074","p094"]}],"cuts":[],"lat":40.1096335,"lon":113.1296236},{"id":"d","L":"D","area":"m","kind":"sight","time":"12:20","name":{"zh":"云冈石窟 · 五华洞","en":"Yungang · the Five Splendid Caves"},"pinName":{"zh":"五华洞","en":"Five Splendid Caves"},"lab":{"dx":0,"dy":34,"a":"middle"},"notes":{"zh":"第 9 到 13 窟合称「五华洞」，是云冈颜色最艳、花样最多的一段。第 9、10 窟是宦官钳耳庆时在 484 到 489 年主持开凿的一对双窟。窟口一排大柱子，柱脚趴着大象和狮子——印度来的；柱身上刻满小佛；头顶却是中国式的屋檐。往里走，墙上满是飞天、莲花、卷草，还有一种光着身子、胖乎乎的小娃娃，你一看就会想起欧洲教堂里的丘比特。没看错：这些胖娃娃的老祖宗，就是希腊罗马神话里的小爱神。他们跟着丝绸之路走到犍陀罗（今天的巴基斯坦一带），在那里加入了佛教，脱掉翅膀，戴上头光，再一路走到大同，给佛托起宝珠。同一面墙上，还有从印度来的飞天、汉朝传下来的博山炉、中国的龙——当年来云冈干活的工匠，有凉州人、西域人、中亚人，各人带着各人家乡的图样。","en":"Caves 9 to 13 are the Five Splendid Caves, the most colourful and most richly patterned stretch of Yungang. Caves 9 and 10, a pair, were cut between 484 and 489 under the court eunuch Qian'er Qingshi. Along their mouths stands a row of great columns resting on elephants and lions — from India — their shafts covered in tiny Buddhas, under Chinese-style eaves. Inside, the walls swarm with flying figures, lotuses and scrolling vines — and chubby little naked babies who will remind you of the cupids in a European church. Rightly so: their ancestors are the little love-gods of Greek and Roman myth. They followed the Silk Road to Gandhara (around today's Pakistan), joined Buddhism there, swapped their wings for haloes, and walked on to Datong to hold up jewels for the Buddha. On the same walls are flying apsaras from India, an incense burner shaped like the mountains of the immortals from Han China, and Chinese dragons. The craftsmen who came to work here were from Liangzhou, the Western Regions and Central Asia, each bringing the patterns of home."},"left":[{"t":"label","zh":"五华洞","en":"FIVE SPLENDID CAVES"},{"t":"notes"},{"t":"photo","p":"p098","r":-1,"w":"52%","cap":{"zh":"第 9 窟前室：颜色最艳的一面墙","en":"Cave 9, front chamber: the brightest wall"}},{"t":"kbox","title":{"zh":"小知识 · 满墙的花纹是什么意思","en":"Field notes · what the patterns mean"},"intro":{"zh":"走近看，每一种花纹都有来历。","en":"Look closely: every pattern has a story."},"rows":[{"h":{"zh":"忍冬纹","en":"Honeysuckle scroll"},"t":{"zh":"一路回旋的卷叶花边，从希腊经波斯、犍陀罗「爬」到中国。梁思成说，后来中国瓷器、衣服上的卷草花边，都是从这里长出来的。","en":"A curling vine border that crept from Greece through Persia and Gandhara to China. Liang Sicheng said every later Chinese scroll border grew from these."}},{"h":{"zh":"莲花","en":"Lotus"},"t":{"zh":"从泥里长出来却干干净净，所以佛坐在莲花上；窟顶正中常开一朵大莲花，像给佛国开的天窗。","en":"It rises clean from the mud, so the Buddha sits on it; a great lotus often blooms in the middle of the ceiling, like a skylight onto paradise."}},{"h":{"zh":"火焰纹","en":"Flames"},"t":{"zh":"佛身上一直在发光，可光没法雕，就雕一圈火苗。","en":"The Buddha is always giving off light; you can't carve light, so they carved flames."}},{"h":{"zh":"飞天","en":"Apsaras"},"t":{"zh":"在佛身边奏乐、散花的天人，没有翅膀，靠飘带飞。","en":"Heavenly beings who play music and scatter flowers around the Buddha — no wings, they fly by their scarves."}},{"h":{"zh":"化生童子","en":"Lotus-born babies"},"t":{"zh":"从莲花里「变」出来的胖娃娃，代表往生净土。","en":"Chubby babies born from lotuses — a sign of rebirth in paradise."}},{"h":{"zh":"金翅鸟和龙","en":"Garuda and dragons"},"t":{"zh":"印度神话里专吃毒龙的大鹏鸟，是佛的保镖；龛楣两头还常趴着中国的龙。","en":"The great bird of Indian myth that eats poisonous serpents, the Buddha's bodyguard; Chinese dragons often curl at the ends of the niche arches."}}]},{"t":"row","p":["p120","p124","p126"]},{"t":"note","txt":{"zh":"另一个迷人的是它多元文化交汇的痕迹，来自西方，中亚、印度、河西走廊和汉地的艺术因素，在这里融合重新塑造。古代交通当然慢，但旧大陆毕竟连在一起的，文化、宗教、技术与审美的交流，从来没有真正中断过。","en":"The other fascination is the trace of so many cultures meeting: elements from the West, Central Asia, India, the Hexi Corridor and the Han heartland, fused and reshaped here. Travel in those days was slow, of course, but the Old World was one connected landmass, and the exchange of culture, religion, technique and taste never really stopped."},"by":"dad"},{"t":"row","p":["p110","p114"]}],"right":[{"t":"note","txt":{"zh":"本来以为看过前面几个窟，后面的大概也差不多。不是，一窟比一窟好看。\n有佛，有菩萨，有飞天，还有各种动物。墙上、顶上、门楣上，没有一块空着的地方：莲花、祥云、火焰纹，一圈套着一圈。凑近了看，一朵小小的祥云，一瓣莲花，也刻得认认真真。\n佛大多带着笑，眉眼弯弯的，很温和，不是庙里那种让人不敢抬头的严肃。\n颜色红红绿绿。我一直在想：这是一千多年前的颜色，还是后来补的？回来查了，大多是清朝包上泥重新画的；北魏原来的颜色，只在一些小龛的背光上还留着一点。","en":"I'd thought that after the first few caves, the rest would be much the same. Not so — each cave was more beautiful than the last.\nBuddhas, bodhisattvas, flying apsaras, and all sorts of animals. Walls, ceilings, lintels — not a patch left bare: lotuses, auspicious clouds, flame patterns, ring within ring. Look closely, and even a tiny cloud or a single lotus petal is carved with care.\nMost of the Buddhas are smiling, eyes curved like crescents, very gentle — not the stern kind you see in temples, the kind you hardly dare look up at.\nThe colours are reds and greens. I kept wondering: are these colours over a thousand years old, or added later? I looked it up afterwards: most were repainted under the Qing, over a fresh skin of clay; the Northern Wei colours survive only in traces, on the haloes of some small niches."}},{"t":"photo","p":"p116","r":1,"w":"72%","cap":{"zh":"第 9 窟后室，回头看门：门楣上一排 11 尊小坐佛，飞天绕着飞；最上面的方窗顶上开着一朵大莲花","en":"Cave 9, looking back at the door: eleven little seated Buddhas ring the arch, apsaras fly round them, and a great lotus blooms in the window above"}},{"t":"row","p":["p119","p118"],"cap":[{"zh":"门拱顶上：四个胖娃娃托着如意宝珠","en":"Over the arch: four chubby babies holding up a wish-granting jewel"},null]},{"t":"row","p":["p103","p105"]},{"t":"photo","p":"p107","r":-1,"w":"60%"}],"cuts":[],"lat":40.1100806,"lon":113.1258454},{"id":"e","L":"E","area":"m","kind":"sight","time":"12:48","name":{"zh":"云冈石窟 · 音乐窟和托臂力士","en":"Yungang · the music cave and the strongman"},"pinName":{"zh":"第 11–13 窟","en":"Caves 11–13"},"lab":{"dx":-18,"dy":6,"a":"end"},"notes":{"zh":"第 11 窟东墙上，离地十一米高，刻着一篇 483 年的题记：54 个普通信徒凑钱，在这里刻了 95 尊小佛，还把自己的心愿写了下来——皇家的石窟里，也有老百姓「包」下的一面墙。第 12 窟叫「音乐窟」：前室最上面一排小龛里，每人抱一件乐器，排箫、琵琶、箜篌、腰鼓、海螺……这是一支一千五百年前的北魏宫廷乐队，到今天还在石头上演奏。第 13 窟的交脚弥勒高约 13 米，右胳膊肘底下站着一个小力士，憋足了劲往上托——好像怕大佛的胳膊累着。这里的佛和菩萨很多是笑着的：佛的笑庄严，菩萨的笑慈祥，飞天的笑欢喜，小童子的笑天真，不像别处那么板着脸。","en":"On the east wall of Cave 11, eleven metres up, is an inscription from 483: fifty-four ordinary believers pooled their money to carve 95 little Buddhas here, and wrote down their wishes — in the emperors' caves, ordinary people 'bought' a wall too. Cave 12 is the 'music cave': in the top row of niches in its front chamber, each figure holds an instrument — panpipes, pipa, harp, waist drum, conch — a Northern Wei court band still playing in stone after fifteen hundred years. Cave 13's cross-ankled Maitreya, about 13 metres tall, has a little strongman under his right elbow, pushing up with all his might, as if to keep the great arm from tiring. Many of the Buddhas and bodhisattvas here are smiling: the Buddhas solemnly, the bodhisattvas kindly, the apsaras gleefully, the little children innocently — none of the stern faces you see elsewhere."},"left":[{"t":"label","zh":"音乐窟","en":"THE MUSIC CAVE"},{"t":"notes"},{"t":"photo","p":"p152","r":-1,"w":"70%","cap":{"zh":"第 12 窟音乐窟前室：最上面一排拱龛里是北魏宫廷乐队，方窗是通往后室的明窗","en":"Cave 12, the music cave: the top row of arches holds the Wei court band; the square opening is the window into the back chamber"}},{"t":"kbox","title":{"zh":"小知识 · 同是北魏，为什么云冈比龙门繁复","en":"Field notes · why Yungang is so ornate"},"intro":{"zh":"在洛阳看过龙门，到云冈会觉得：怎么处处都是雕刻？","en":"After Longmen, Yungang feels carved everywhere. Why?"},"rows":[{"h":{"zh":"不是石头好雕","en":"Not the stone"},"t":{"zh":"云冈是砂岩，挖大洞快，其实不适合精雕细刻。满墙雕花，是有意这么做的。","en":"Yungang's sandstone is quick to dig but poor for fine detail. Carving every inch was a choice."}},{"h":{"zh":"倾一国之力","en":"A whole empire's effort"},"t":{"zh":"平城是都城，云冈是皇家工程。439 年北魏从凉州迁来三万多户，工匠来自凉州、西域、中亚。","en":"Pingcheng was the capital and Yungang an imperial project. In 439 the Wei moved over thirty thousand households from Liangzhou; the craftsmen came from there, the Western Regions and Central Asia."}},{"h":{"zh":"把皇宫搬进山洞","en":"The palace moved into the hill"},"t":{"zh":"中期冯太后、孝文帝推崇礼乐，宫廷乐队、平棊藻井、仿木屋檐都被刻进了石窟。","en":"In the middle period the court favoured ritual and music, so court bands, coffered ceilings and timber-style eaves were all carved into the caves."}},{"h":{"zh":"龙门那尊是唐朝的","en":"Longmen's giant is Tang"},"t":{"zh":"在龙门最震撼的卢舍那大佛，是唐朝 672–675 年凿的。唐朝人喜欢一尊大像镇住全场，北魏人喜欢满墙热闹。","en":"The great Vairocana at Longmen was carved by the Tang, 672–675. The Tang liked one great figure to command the space; the Wei liked a crowded, busy wall."}}]},{"t":"photo","p":"p159","r":-1,"w":"70%"}],"right":[{"t":"note","txt":{"zh":"独特有趣的是石窟早期的“胡风东渐”，石刻中犹如丘比特的西式小天使升天和中式升天同时并存；以及后期的“华风汉韵”，佛的面相从西域胡人面相转变为穿着汉服更符合汉人审美的温润。","en":"What's uniquely fun is the early 'western wind blowing east': in the carvings, Cupid-like little Western angels rise to heaven right alongside Chinese-style flying figures; and then the later 'Chinese grace', the Buddhas' faces shifting from Central Asian features to gentle ones in Han robes, more to Han taste."}},{"t":"photo","p":"p147","r":1,"w":"62%","cap":{"zh":"第 11 窟中心塔柱的彩绘立佛","en":"Cave 11: the painted standing Buddha on the central pillar"}},{"t":"row","p":["p142","p148"]},{"t":"row","p":["p150","p155"],"cap":[null,{"zh":"第 13 窟交脚弥勒","en":"Cave 13: the cross-ankled Maitreya"}]},{"t":"note","txt":{"zh":"站在窟里，我常想：一千五百多年前，头一回走进来的人，看见的是什么。那时佛像新成，颜色新上，洞里没有灯，只有门窗透进的一点天光。他抬头见到这样大的佛，满壁满顶的菩萨飞天，想必怔在那里，半天说不出话来。我们如今什么都见过了，尚且如此。","en":"Standing in the caves, I kept wondering what the first people to walk in, fifteen hundred years ago, actually saw. Back then the statues were new and the paint was fresh. There were no lamps, only a little daylight through the doors and windows. Looking up at a Buddha this huge, with bodhisattvas and apsaras covering every wall and the ceiling, they must have stood there stunned, unable to speak for a long while. We who have seen everything felt the same."}}],"cuts":[],"lat":40.1100808,"lon":113.1235104},{"id":"f","L":"F","area":"m","kind":"sight","time":"13:02","lat":40.1106,"lon":113.1246,"name":{"zh":"和大佛击掌","en":"High five with the Buddhas"},"pinName":{"zh":"击掌","en":"High fives"},"lab":{"dx":18,"dy":-10,"a":"start"},"left":[{"t":"label","zh":"击掌","en":"HIGH FIVE"},{"t":"note","txt":{"zh":"6️⃣当然网红击掌佛也得“high five”一个。","en":"6️⃣ And of course we had to give the internet-famous high-five Buddha a 'high five'."}},{"t":"photo","p":"p172","r":-1,"w":"40%","cap":{"zh":"挨个和崖上的大佛击掌","en":"Taking turns to high-five the Buddhas on the cliff"}},{"t":"row","p":["p176","p178","p174"],"ar":0.75},{"t":"row","p":["p180","p193"],"ar":0.75}],"right":[{"t":"row","p":["p184","p186","p188"],"ar":0.75},{"t":"row","p":["p185","p183","p190"],"ar":0.75},{"t":"photo","p":"p3004","r":1,"w":"60%","cap":{"zh":"插画：和大佛击掌","en":"Illustration: a high five with the Buddha"}},{"t":"photo","p":"p169","r":-1,"w":"44%","cap":{"zh":"崖上举着手的佛","en":"A Buddha with a raised hand"}}],"cuts":[]},{"id":"g","L":"G","area":"m","kind":"sight","time":"13:10","lat":40.1094,"lon":113.1226,"name":{"zh":"昙曜五窟 · 露天大佛","en":"Tanyao's caves · the open-air Buddha"},"pinName":{"zh":"露天大佛","en":"Open-air Buddha"},"lab":{"dx":-18,"dy":26,"a":"end"},"notes":{"zh":"最西边的第 16 到 20 窟，是昙曜最早开的五个大窟。这五尊大佛是为谁刻的？要从一场灾难说起：446 年，太武帝下令灭佛，拆寺院、杀和尚。六年后他的孙子文成帝即位，把佛教重新请了回来。文成帝先让人照着自己的样子雕一尊石佛，雕好一看，佛像脸上和脚上各有一块黑石头，正好对上皇帝身上的两颗黑痣。到 460 年开这五个大窟，学者认为，五尊大佛象征的就是北魏开国以来的五位皇帝：道武帝、明元帝、太武帝、景穆帝，还有文成帝自己。最妙的是——下令灭佛的太武帝，自己也成了一尊佛。在北魏，皇帝就是「当今如来」：拜佛，也就是拜皇帝。第 20 窟的大佛原来也坐在窟里，前壁塌了，才坐到了露天，高约 13.7 米，成了云冈的「代言人」。","en":"The westernmost caves, 16 to 20, are the first five Tanyao opened. Whom were these five giant Buddhas for? It begins with a disaster: in 446 Emperor Taiwu ordered Buddhism destroyed — temples torn down, monks killed. Six years later his grandson Emperor Wencheng took the throne and invited Buddhism back. Wencheng first had a stone Buddha carved in his own likeness — and when it was done, there was a black stone in its face and another in its foot, exactly where the emperor had two black moles. When the five caves were opened in 460, scholars believe, the five Buddhas stood for the five emperors since the dynasty began: Daowu, Mingyuan, Taiwu, Jingmu — and Wencheng himself. The best part: Taiwu, who had destroyed Buddhism, became a Buddha too. In the Northern Wei the emperor was 'the Buddha of the present day': to bow to the Buddha was to bow to the emperor. Cave 20's Buddha once sat inside a cave as well; when its front wall fell he was left in the open air, about 13.7 metres tall — the face of Yungang."},"left":[{"t":"label","zh":"昙曜五窟","en":"TANYAO'S FIVE CAVES"},{"c":"qima","w":"30%","r":-2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"photo","p":"p195","r":-1,"w":"54%"},{"t":"kbox","title":{"zh":"小知识 · 五尊大佛各看什么","en":"Field notes · what to look for"},"intro":{"zh":"从东往西，第 16 到 20 窟。","en":"East to west, Caves 16 to 20."},"rows":[{"h":{"zh":"第 16 窟","en":"Cave 16"},"t":{"zh":"立佛高 13.5 米，穿汉式的「褒衣博带」，胸前打个结——五窟里最晚完工的一尊。","en":"A 13.5 m standing Buddha in loose Chinese-style robes knotted at the chest — the last of the five finished."}},{"h":{"zh":"第 17 窟","en":"Cave 17"},"t":{"zh":"交脚弥勒高 15.5 米，几乎把窟塞满。","en":"A cross-ankled Maitreya, 15.5 m, nearly filling the cave."}},{"h":{"zh":"第 18 窟","en":"Cave 18"},"t":{"zh":"立佛身披「千佛袈裟」，衣服上刻满小佛；手指间连着一层薄膜，像鸭掌。","en":"The standing Buddha wears a robe of a thousand tiny Buddhas, and has webbed fingers, like a duck's foot."}},{"h":{"zh":"第 19 窟","en":"Cave 19"},"t":{"zh":"五窟里最大的窟，坐佛高 16.8 米，云冈第二大。","en":"The biggest of the five; its seated Buddha, 16.8 m, is Yungang's second largest."}},{"h":{"zh":"第 20 窟","en":"Cave 20"},"t":{"zh":"露天大佛。学者推测前壁是 512 年那场大地震震塌的：1992 年在窟前挖出一百三十多块立佛衣纹的石块，是当年工匠切下来准备修补、却被地震埋了一千五百年的。","en":"The open-air Buddha. Scholars think the earthquake of 512 brought down the front wall: in 1992 over 130 carved robe fragments were dug up before the cave — pieces cut for a repair and buried by the quake for fifteen hundred years."}}]},{"t":"row","p":["p199","p214"]},{"t":"row","p":["p166","p167"],"cap":[{"zh":"崖下的「流失造像」展：一面是当年的照片，掀开是今天空空的龛","en":"The 'lost statues' display: an old photo on one side, flip it to see the empty niche today"},null]}],"right":[{"t":"photo","p":"p197","r":1,"w":"86%","cap":{"zh":"第 20 窟，露天大佛","en":"Cave 20, the open-air Buddha"}},{"t":"note","txt":{"zh":"燕子叽叽喳喳穿梭，还有甚者停歇在大佛的肩头。一静一动，各得其所，好不美妙。","en":"Swallows chattered and darted about; some even perched on the Buddha's shoulder. One still, one in motion, each in its place — how lovely."}},{"t":"photo","p":"p208","r":-1,"w":"70%","cap":{"zh":"哥俩和大佛","en":"The two boys and the Buddha"}},{"t":"kbox","title":{"zh":"小知识 · 被凿走的佛头","en":"Field notes · the stolen heads"},"intro":{"zh":"有些佛像看不到全貌，不是风化，是被人偷了。","en":"Some figures are incomplete not from weather, but from theft."},"rows":[{"h":{"zh":"什么时候","en":"When"},"t":{"zh":"1907 到 1934 年，最凶的是 1918 到 1929 年。庙里不肖的和尚、本地人、古董商把佛头凿下来卖，很多经日本古董商转卖到海外。","en":"Between 1907 and 1934, worst from 1918 to 1929. Unscrupulous monks, locals and antique dealers chiselled off heads to sell, many passing through Japanese dealers to buyers abroad."}},{"h":{"zh":"丢了多少","en":"How many"},"t":{"zh":"1929 年调查，光佛头就丢了 96 颗；流失的造像一百多件，今天散在纽约大都会、巴黎吉美、大阪等地的博物馆里。","en":"A 1929 survey counted 96 heads missing; over a hundred pieces were lost, now in museums from the Met in New York to the Guimet in Paris and Osaka."}},{"h":{"zh":"回家的","en":"Coming home"},"t":{"zh":"2018 年，第 7 窟一个戴鲜卑帽子的天王头从美国捐回，工作人员在第 7 窟找到了它的身子，严丝合缝。","en":"In 2018 a guardian king's head in a Xianbei cap, from Cave 7, was donated back from the US — and staff found the body it fitted in Cave 7."}}]},{"t":"photo","p":"p217","r":-1,"w":"86%","cap":{"zh":"全家在大佛前","en":"All of us before the Buddha"}},{"t":"row","p":["p219","p222","p223"],"cap":[{"zh":"山西老陈醋味汽水","en":"Shanxi aged-vinegar soda"},null,null]},{"t":"tip","txt":{"zh":"从门口走到最西头的第 20 窟大约一公里。旺季一般 8:30–16:30 开放（2026 年 7/11–8/31 延长到 7:30–18:00），以当日公示为准。","en":"It's about a kilometre from the gate to Cave 20 at the western end. High-season hours are usually 8:30–16:30 (extended to 7:30–18:00 from 11 July to 31 August 2026) — check on the day."}}],"cuts":[]},{"id":"h","L":"H","area":"a","kind":"food","time":"15:31","name":{"zh":"龙聚祥 · 午饭","en":"Lunch at Longjuxiang"},"pinName":{"zh":"龙聚祥","en":"Longjuxiang"},"lab":{"dx":18,"dy":20,"a":"start"},"notes":{"zh":"出了云冈回城，在古城鼓楼西街和永泰街路口的龙聚祥烧麦馆吃了午饭。大同的面食和中原又不一样：刀削面是把面团托在手上，用弯刀一片片削进锅里，中间厚、两边薄，像柳叶，2023 年列入山西省级非遗；黄米凉糕是黄米蒸的，凉凉甜甜，当甜点；苦菜是夏天的时令菜，大同人把它切碎，泡进凉白开，加盐、葱花和醋，连汤带菜一起吃，说是解油腻。","en":"Back from Yungang we had lunch at Longjuxiang, a shaomai house where Gulou West Street meets Yongtai Street in the old city. Datong's flour food is different again from the central plains. Knife-cut noodles are shaved off a block of dough held in one hand, sliced into the pot with a curved blade — thick in the middle, thin at the edges, like willow leaves; Datong's version became Shanxi intangible heritage in 2023. Yellow-millet cake is steamed millet, cool and sweet, eaten as a pudding. And kucai, a bitter summer green, is chopped and steeped in cooled boiled water with salt, spring onion and vinegar, and eaten broth and all — to cut the grease, they say."},"left":[{"t":"label","zh":"龙聚祥","en":"LONGJUXIANG · 龙聚祥"},{"c":"daoxiao","w":"38%","r":2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"photo","p":"p224","r":-1,"w":"56%","cap":{"zh":"进古城","en":"Into the old city"}}],"right":[{"t":"wall","cols":3,"p":[["p228",{"zh":"黄米凉糕","en":"Millet cake"}],["p230",{"zh":"苦菜","en":"Kucai greens"}],["p232",{"zh":"刀削面","en":"Knife-cut noodles"}]]},{"t":"photo","p":"p233","r":1.5,"w":"50%","cap":{"zh":"龙聚祥门口","en":"At the door of Longjuxiang"}}],"cuts":[],"lat":40.0900229,"lon":113.2951468},{"id":"i","L":"I","area":"a","kind":"sight","time":"16:26","name":{"zh":"纯阳宫 · 古城里的道观","en":"Chunyang Temple · a Daoist temple in the old city"},"pinName":{"zh":"纯阳宫","en":"Chunyang Temple"},"lab":{"dx":-18,"dy":-14,"a":"end"},"notes":{"zh":"要是读过金庸，你对这座道观其实一点也不陌生。《射雕英雄传》里的「中神通」王重阳、给郭靖杨康起名字的丘处机、全真七子——全是真人。王重阳 1167 年在山东创立全真教，道士要出家、住道观、守清规；他说自己有一回喝醉了，在甘河镇遇见两位神仙，其中一位就是八仙里的吕洞宾，从此奉他为师。所以全真教把吕洞宾奉为祖师，吕洞宾号「纯阳子」，供他的地方就叫纯阳宫。丘处机七十三岁时带着十八个弟子，走了三万五千里，到今天的阿富汗去见成吉思汗，劝他少杀人、敬天爱民；回来后全真教盛极一时。据说大同纯阳宫，就是丘处机的弟子刘道宁在这前后建的。至于华山论剑、九阴真经、抗金、古墓派的林朝英——那都是金庸加的。按门口简介牌的说法，这里是大同现存唯一一座全真派宫观；在满城的佛寺中间，它是难得的一座道观。","en":"If you've read Jin Yong's novels, you already know this place. Wang Chongyang, the 'Central Divine' of The Legend of the Condor Heroes, Qiu Chuji who names the boys Guo Jing and Yang Kang, the Seven Masters of Quanzhen — all real people. Wang founded the Quanzhen school in Shandong in 1167: its priests leave home, live in temples and keep strict rules. He said that once, drunk, he met two immortals at Ganhe, one of them Lü Dongbin of the Eight Immortals, and took him as his teacher. So Quanzhen reveres Lü as a patriarch; Lü's Daoist name was Chunyangzi, and his temples are called Chunyang temples. At seventy-three Qiu Chuji set out with eighteen disciples on a journey of thousands of miles to meet Genghis Khan in today's Afghanistan, urging him to kill less and care for his people; afterwards Quanzhen flourished. Datong's Chunyang Temple is said to have been founded around then by Qiu's own disciple Liu Daoning. The sword contest on Mount Hua, the Nine Yin Manual, the fight against the Jin, the tomb of Lin Chaoying — those are Jin Yong's inventions. The board at the gate calls this the only surviving Quanzhen temple in Datong: a rare Daoist temple in a city full of Buddhist ones."},"left":[{"t":"label","zh":"纯阳宫","en":"CHUNYANG TEMPLE"},{"t":"notes"},{"t":"photo","p":"p239","r":-1,"w":"80%","cap":{"zh":"门口的简介牌：左边是全宫的平面图，西院的水池是个葫芦","en":"The board at the gate: a plan of the temple, with a gourd-shaped pond in the west garden"}},{"t":"kbox","title":{"zh":"小知识 · 走进一座道观","en":"Field notes · inside a Daoist temple"},"intro":{"zh":"从山门往里，一殿一殿看过去。","en":"From the gate inwards, hall by hall."},"rows":[{"h":{"zh":"灵官殿","en":"Lingguan Hall"},"t":{"zh":"进门第一殿，供王灵官：红脸、三只眼、手持钢鞭，是道观的守门神。","en":"The first hall honours Wang Lingguan — red-faced, three-eyed, with an iron whip — the guardian at a Daoist gate."}},{"h":{"zh":"祖师殿","en":"Patriarch Hall"},"t":{"zh":"供吕洞宾，是宫里最大的一座殿，绿琉璃瓦顶。主殿四周十八根柱子围成回廊，平面像个「回」字，正好对上吕洞宾的别号「回道人」。","en":"Lü Dongbin's own hall, the largest, under green-glazed tiles. Eighteen columns ring it so that its plan looks like the character hui, a square inside a square — a nod to his nickname, 'the Hui Daoist'."}},{"h":{"zh":"三清殿","en":"Hall of the Three Pure Ones"},"t":{"zh":"供道教最高的三位神：元始天尊、灵宝天尊、道德天尊（就是太上老君）。楼上是藏经楼。","en":"The three highest Daoist gods: the Primordial Lord, the Lord of the Numinous Treasure and the Lord of the Way — Laozi. The floor above holds the scriptures."}},{"h":{"zh":"葫芦池","en":"The gourd pond"},"t":{"zh":"西院是一座园子，中间的水池做成宝葫芦形——葫芦是八仙的法器之一，也是吕祖的标志。","en":"The west court is a garden whose pond is shaped like a gourd — one of the Eight Immortals' emblems, and Patriarch Lü's sign."}},{"h":{"zh":"奶奶殿","en":"Granny Hall"},"t":{"zh":"供碧霞元君，民间叫「泰山奶奶」，两边是送子、催生、天花、眼光四位娘娘；四面墙上画着《百子团圆图》，按春夏秋冬画了一百个孩子玩耍。","en":"The Bixia goddess — 'Granny of Mount Tai' — with four goddesses of childbirth, children and eyesight beside her; the walls show a hundred children at play through the four seasons."}},{"h":{"zh":"一块城砖","en":"A city-wall brick"},"t":{"zh":"庙门下挖出过一块刻着「明洪武四年六月」的大砖，是当年修大同城墙用的。","en":"A large brick stamped 'sixth month, fourth year of Hongwu' (1371) was dug up under the gate — a brick from the Ming city wall."}}]},{"t":"row","p":["p242","p244"]}],"right":[{"t":"note","txt":{"zh":"下午闲逛了大同古城，古城里有全真教纯阳宫，","en":"In the afternoon we wandered the old city of Datong — it has a Quanzhen Daoist temple, Chunyang Temple,"}},{"t":"row","p":["p240","p241"]},{"t":"photo","p":"p248","r":1,"w":"66%"},{"t":"kbox","title":{"zh":"小知识 · 金庸小说里的全真教","en":"Field notes · Jin Yong's Quanzhen"},"intro":{"zh":"人是真的，门派是真的，师徒也是真的。","en":"The people, the school and the teachers are all real."},"rows":[{"h":{"zh":"小说里 vs 真的","en":"Novel vs history"},"t":{"zh":"真的：王重阳、全真七子、孙不二是马钰的妻子、王重阳挖坑住的「活死人墓」、丘处机见成吉思汗。小说加的：武功、华山论剑、抗金（真实的全真教和金朝、蒙古关系都不错）。","en":"Real: Wang Chongyang, the Seven Masters, Sun Bu'er as Ma Yu's wife, Wang's 'tomb of the living dead' (a pit he really lived in), Qiu's meeting with Genghis Khan. Invented: the martial arts, the Mount Hua contest, the fight against the Jin (the real Quanzhen got on well with both the Jin and the Mongols)."}},{"h":{"zh":"一言止杀？","en":"Stopping the killing?"},"t":{"zh":"后人说丘处机「一言止杀」，一句话让蒙古停止屠杀。他确实劝过，成吉思汗也很敬重他；但学者考证，这句话是后人夸大的。","en":"Later ages said Qiu stopped the Mongol slaughter with a single sentence. He did urge mercy, and Genghis respected him — but historians find the phrase an exaggeration."}},{"h":{"zh":"吕洞宾的黄粱梦","en":"Lü's millet dream"},"t":{"zh":"元代杂剧《黄粱梦》里，吕洞宾在客店睡了一觉，梦里享尽荣华又一落千丈；醒来，锅里的黄粱饭还没熟。他从此跟着钟离权修道。","en":"In the Yuan play The Yellow Millet Dream, Lü dozes at an inn and dreams a whole life of glory and ruin — and wakes before the millet in the pot is cooked. He goes off with Zhongli Quan to follow the Way."}},{"h":{"zh":"一句俗话","en":"A saying"},"t":{"zh":"「狗咬吕洞宾，不识好人心」——说的就是好心没被领情。","en":"'The dog bites Lü Dongbin — it can't tell a kind heart': said when good intentions go unthanked."}}]},{"t":"row","p":["p245","p247"],"cap":[{"zh":"奶奶殿：供碧霞元君","en":"Hall of the Bixia goddess"},null]},{"t":"photo","p":"p250","r":-1,"w":"70%","cap":{"zh":"墙上的牌子都画着太极八卦","en":"Every board on the wall carries the taiji and the eight trigrams"}}],"cuts":[],"lat":40.090287,"lon":113.2934548},{"id":"j","L":"J","area":"a","kind":"sight","time":"17:28","name":{"zh":"华严寺","en":"Huayan Temple"},"pinName":{"zh":"华严寺","en":"Huayan Temple"},"lab":{"dx":-18,"dy":6,"a":"end"},"notes":{"zh":"华严寺是辽代的皇家寺院，和一般坐北朝南的寺庙不同，它坐西朝东——据说和契丹人拜太阳的习俗有关。1122 年金兵攻下大同，寺被战火烧了；金天眷三年（1140）重建的上寺大雄宝殿留到今天，面阔九间，一千五百多平方米，是中国现存最大的古代佛殿，屋脊上的琉璃鸱吻高 4.5 米。下寺的薄伽教藏殿是辽代 1038 年建的藏经殿，里面那尊合掌露齿、微微侧身的菩萨，被郑振铎称为「东方维纳斯」。我们登的华严宝塔是 2008 年照辽代记载新建的，纯木榫卯，高 43.5 米，塔下有一座用了一百多吨黄铜的千佛地宫。","en":"Huayan was a Liao imperial temple, and unlike most temples, which face south, it faces east — said to follow the Khitan custom of honouring the sun. When the Jin took Datong in 1122 it burned; the Great Hall of the upper temple, rebuilt in 1140, still stands: nine bays and over 1,500 square metres, the largest old Buddhist hall in China, with glazed ridge-beasts 4.5 metres high. The lower temple's Bhagavat Sutra Library, built by the Liao in 1038, holds a slightly turning bodhisattva, palms together and smiling to show her teeth, whom the writer Zheng Zhenduo called 'the Venus of the East'. The Huayan Pagoda we climbed is new, built in 2008 from Liao records: all timber and joinery, 43.5 metres, over an underground hall of a thousand Buddhas cast from more than a hundred tonnes of brass."},"left":[{"t":"label","zh":"华严寺","en":"HUAYAN TEMPLE"},{"t":"notes"},{"t":"photo","p":"p272","r":-1,"w":"60%","cap":{"zh":"大雄宝殿，下面一块「调御丈夫」","en":"The Great Hall, and below it 'Tamer of Men'"}},{"t":"kbox","title":{"zh":"小知识 · 「调御丈夫」","en":"Field notes · 'Tamer of Men'"},"intro":{"zh":"大雄宝殿匾下面的那块横匾。","en":"The board beneath the Great Hall's name."},"rows":[{"h":{"zh":"什么意思","en":"Meaning"},"t":{"zh":"「如来十号」之一：佛像一个高明的驯马师，能调教、引导所有的人走上正路。","en":"One of the ten titles of the Buddha: like a master horse-trainer, he tames and guides everyone onto the right road."}},{"h":{"zh":"谁写的","en":"Who wrote it"},"t":{"zh":"明万历四十六年（1618），当过大同参将的马林题写。他能诗、善书。","en":"Ma Lin, once a commander at Datong and a poet and calligrapher, in 1618."}},{"h":{"zh":"第二年","en":"The next year"},"t":{"zh":"1619 年萨尔浒之战，马林领北路明军，被努尔哈赤打败，同年守开原时战死。","en":"In 1619, at the Battle of Sarhu, Ma Lin led the northern Ming column and was beaten by Nurhaci; he died defending Kaiyuan that same year."}}]},{"t":"row","p":["p260","p267"],"cap":[null,{"zh":"药师殿","en":"Hall of the Medicine Buddha"}]},{"t":"row","p":["p286","p289"]},{"t":"photo","p":"p258","r":1,"w":"48%","cap":{"zh":"清香型白酒风味汽水","en":"Light-aroma, baijiu-flavoured soda"}},{"t":"note","txt":{"zh":"白天在云冈喝过一瓶老陈醋味的汽水。晚上在古城，又遇见一瓶红标签的，写着“清香型 白酒风味汽水”。清香型是汾酒一路的香型。尝一口，果然是白酒味，却一点酒也没有。\n醋和酒，山西人都做进汽水里了。","en":"At Yungang in the daytime we'd had an aged-vinegar soda. In the old city that evening we came across another, with a red label: 'light-aroma style, baijiu-flavoured soda'. Light-aroma is the style Fenjiu belongs to. One sip — and it really did taste of baijiu, without a drop of alcohol.\nVinegar and liquor: the people of Shanxi have put them both into soda."}}],"right":[{"t":"photo","p":"p274","r":1,"w":"80%"},{"t":"note","txt":{"zh":"以及关门时刻匆匆走马观花了华严寺（华严寺真美！）怪不得旁边整个广场都是旅拍店呢，这样的场景怎么拍都好看。","en":"and right at closing time we dashed through Huayan Temple (Huayan is so beautiful!). No wonder the whole square next to it is lined with travel-photo studios — a setting like this looks good however you shoot it."}},{"t":"note","txt":{"zh":"寺里寺外，穿古装的人很多。有唐装，有宋制，有明制，还有照着壁画打扮的“神仙服”“供养人”。听说旁边的旅拍馆，节假日一天要拍上百人。\n汉服原来就不只是一个样子，各朝各代有各朝各代的穿法。放在一座辽金的寺里，看着热闹，也好看。","en":"Inside the temple and out, lots of people were in historical dress: Tang style, Song style, Ming style, and some dressed after the murals as 'immortals' or 'donors'. I heard the photo studios next door shoot over a hundred people a day on holidays.\nHanfu was never just one look: every dynasty had its own way of dressing. Set in a Liao and Jin temple, it was lively, and lovely to look at."}},{"t":"row","p":["p281","p283"]},{"t":"photo","p":"p323","r":-1,"w":"70%","cap":{"zh":"华严宝塔","en":"The Huayan Pagoda"}},{"t":"row","p":["p328","p309"],"cap":[null,{"zh":"天快黑了，宝塔亮了灯","en":"Dusk, and the pagoda lights up"}]},{"t":"photo","p":"p332","r":1,"w":"52%","cap":{"zh":"下寺，薄伽教藏殿","en":"The lower temple: the Sutra Library"}},{"t":"photo","p":"p342","r":-1,"w":"80%","cap":{"zh":"华严寺门口，一家四口","en":"The four of us outside Huayan Temple"}},{"t":"tip","txt":{"zh":"华严寺门票旺季 ¥50（≈ $7），以当日公示为准。","en":"Huayan Temple: ¥50 (≈ $7) in high season — check on the day."}}],"cuts":[],"lat":40.0912493,"lon":113.2876647},{"id":"k","L":"K","area":"n","kind":"food","time":"19:33","name":{"zh":"鼓楼 · 铜火锅","en":"The Drum Tower · copper hotpot"},"pinName":{"zh":"鼓楼","en":"Drum Tower"},"lab":{"dx":-18,"dy":-14,"a":"end"},"wide":{"p":{"zh":"p3003","en":"p3003"},"mx":1060,"cap":{"zh":"吃完饭出来，天边烧起了晚霞，鼓楼亮了灯","en":"Out after dinner: a burning sky, and the Drum Tower lit up"}},"notes":{"zh":"大同鼓楼是明代建的过街楼，三重檐、十字歇山顶，底下是十字穿心的门洞。明代的大同城里有四座楼，东太平楼、西钟楼、北魁星楼、南鼓楼，如今只剩这一座。北面柱子上曾刻过一副对联，传是康熙写的：「世事让三分，天宽地阔；心田留一点，子耘孙耕。」晚饭在鼓楼边吃的铜火锅。大同的「什锦火锅」不是涮肉：铜锅中间烧炭，四周先码好大烧肉、丸子、虾、炸豆腐和菜，端上桌一起炖着吃。","en":"Datong's Drum Tower is a Ming gate-tower over the crossroads: three tiers of eaves, a cross-shaped hip-and-gable roof, and a cross-shaped passage underneath. The Ming city had four towers — Taiping to the east, the Bell Tower to the west, Kuixing to the north, the Drum Tower to the south — and only this one is left. A couplet once carved on its north pillars, said to be by the Kangxi Emperor, reads: 'Yield a little in the world's affairs, and heaven and earth are wide; leave a little in the field of the heart, and sons and grandsons will till it.' Dinner was copper hotpot beside the tower. Datong's 'assorted hotpot' isn't for dipping: charcoal burns in the middle of the copper pot, and braised pork, meatballs, prawns, fried tofu and greens are arranged around it in advance and simmered together at the table."},"left":[{"t":"label","zh":"鼓楼","en":"DRUM TOWER · 鼓楼"},{"t":"notes"},{"t":"photo","p":"p368","r":-1,"w":"82%"},{"t":"kbox","title":{"zh":"小知识 · 铜火锅从哪来","en":"Field notes · where the copper pot came from"},"intro":{"zh":"大同人自己也有两种说法。","en":"Even Datong has two stories."},"rows":[{"h":{"zh":"元初说","en":"Early Yuan"},"t":{"zh":"大同的铜匠为了行军野餐，做出了「火碗」。","en":"Datong coppersmiths made a 'fire bowl' for armies eating in the field."}},{"h":{"zh":"明代说","en":"Ming"},"t":{"zh":"代王朱桂嫌冬天宴席上的菜凉得快，官员找工匠做出铜火锅，叫「速升锅」。","en":"The Prince of Dai complained that winter banquets went cold, and his officials had craftsmen make the copper hotpot — the 'quick-heat pot'."}},{"h":{"zh":"非遗","en":"Heritage"},"t":{"zh":"大同铜器制作技艺 2014 年列入国家级非遗。","en":"Datong copperwork became national intangible heritage in 2014."}}]},{"t":"photo","p":"p2010","r":1,"w":"40%","cap":{"zh":"羊肉串（视频截图）","en":"Lamb skewers (video still)"}},{"t":"row","p":["p337","p353"]}],"right":[{"t":"photo","p":"p347","r":-1,"w":"62%","cap":{"zh":"喜晋道门口","en":"Outside Xijindao"}},{"t":"note","txt":{"zh":"ps，喜晋道（刀削面）排队也太夸张了吧，中午拿晚饭排位号，晚上七点多前面排了208桌😂","en":"ps: the queue at Xijindao (knife-cut noodles) is insane
