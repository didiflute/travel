","p323":"img/p323.webp","p328":"img/p328.webp","p332":"img/p332.webp","p335":"img/p335.webp","p337":"img/p337.webp","p342":"img/p342.webp","p347":"img/p347.webp","p353":"img/p353.webp","p356":"img/p356.webp","p360":"img/p360.webp","p368":"img/p368.webp","p701":"img/p701.webp","c_chengluo":"img/c_chengluo.webp","c_daoxiao":"img/c_daoxiao.webp","c_qima":"img/c_qima.webp","c_shaomai":"img/c_shaomai.webp","c_yungang":"img/c_yungang.webp"},"c":"datong"},"2":{"D":{"ui":{"title":{"zh":"古都走廊 · 大同","en":"Ancient Capitals · Datong"},"sub":{"zh":"DATONG · 平城","en":"DATONG · OLD PINGCHENG"},"dayline":{"zh":"悬空寺 · 恒山 · 《何以悬空寺》","en":"The Hanging Temple · Mount Heng · a night on the cliff"},"legendM":{"zh":"午后 · 悬空寺","en":"Early afternoon"},"legendA":{"zh":"下午 · 恒山","en":"Late afternoon"},"legendN":{"zh":"晚上","en":"Evening"},"sight":{"zh":"名所","en":"Sights"},"food":{"zh":"吃的","en":"Food"},"all":{"zh":"全图","en":"Whole map"},"hint":{"zh":"点圆点或下面的地名翻到那一页。缩放：按钮、双指，或 Ctrl/⌘ + 滚轮；电脑上可拖动地图。单指上下滑照常翻页。","en":"Tap a pin, or a name below, to turn to its page. Zoom with the buttons, a two-finger pinch, or Ctrl/⌘ + scroll; on a computer, drag to pan. A one-finger swipe simply scrolls the page."},"back":{"zh":"回地图","en":"Back to map"},"notesTag":{"zh":"小知识","en":"Background"},"feelTag":{"zh":"攻略","en":"Tips"},"dayTag":{"zh":"那天","en":"That day"},"next":{"zh":"下一页 →","en":"Next →"},"home":{"zh":"酒店","en":"Hotel"},"end":{"zh":"— Day 2 · 完 —","en":"— end of Day 2 —"},"fab":{"zh":"回地图","en":"Map"},"tobook":{"zh":"往下看这一天的手账 ↓","en":"Read the day's journal ↓"},"day":"Day 2","badge":"平","maphead":{"zh":"City Walk","en":"City Walk"}},"areas":{"m":{"color":"#2f7fb0","zh":"午后 · 悬空寺","en":"Early afternoon · Hanging Temple","box":[300,539,362]},"a":{"color":"#c4554b","zh":"下午 · 恒山","en":"Late afternoon · Mount Heng","box":[825,253,267]},"n":{"color":"#6a4c9c","zh":"晚上 · 何以悬空寺","en":"Evening · the cliff show","box":[330,559,314]},"d":{"color":"#6f6a64","zh":"第二天早上 · 去北京","en":"Next morning · to Beijing","box":[-20,470,160]}},"nohome":true,"view":[0,0,1400],"hops":[{"from":"c","to":"d","q":[1000,900],"t":[850,690,-40],"fs":24,"txt":{"zh":"上恒山","en":"up Mount Heng"}},{"from":"d","to":"e","q":[800,300],"t":[520,330,8],"fs":24,"txt":{"zh":"天黑前回到悬空寺","en":"back to the temple by dusk"}}],"places":[{"id":"a","L":"A","area":"m","kind":"sight","time":"13:44","name":{"zh":"悬空寺","en":"The Hanging Temple"},"pinName":{"zh":"悬空寺","en":"Hanging Temple"},"lab":{"dx":-18,"dy":6,"a":"end"},"notes":{"zh":"悬空寺在大同东南浑源县，恒山脚下金龙峡的翠屏峰崖壁上。相传北魏太和十五年（491）始建，原名「玄空阁」——「玄」是道家，「空」是佛家；后来因为整座寺挂在悬崖半空，「玄」就成了「悬」。寺离地约五十米，从下面看，好像是那十几根碗口粗的木柱撑着；其实这些立柱「悬而不承」，不是主要承重的。真正托住寺的，是二十七根用桐油泡过的铁杉木横梁：一头插进岩石里，楼阁和栈道就压在这些横梁上，重量借山岩托住。还有个传说：寺刚建成时底下并没有柱子，人们看着心慌，才加了几根，让人放心。当地有句民谣：「悬空寺，半天高，三根马尾空中吊。」明代的徐霞客来过，称它「天下巨观」；2010 年，美国《时代》周刊把它列进全球十大最奇险的建筑。","en":"The Hanging Temple is in Hunyuan County, southeast of Datong, on the Cuiping cliff of the Jinlong Gorge below Mount Heng. Tradition dates it to 491 under the Northern Wei; it was first called Xuankong Ge — xuan for the Daoists, kong (emptiness) for the Buddhists — and since the whole temple hangs in mid-air, xuan, 'mysterious', became its homophone xuan, 'hanging'. It sits about fifty metres up. From below it seems to stand on a dozen bowl-thick wooden posts; in fact the posts 'hang without bearing' and are not the main supports. What holds the temple up are twenty-seven hemlock beams soaked in tung oil, one end driven into the rock: the halls and walkways rest on them, and the cliff takes the weight. Legend says that when the temple was new there were no posts at all — people found it unnerving to look at, so a few were added for reassurance. A local rhyme says: 'Hanging Temple, half the sky high, hung on three horsehairs.' The Ming traveller Xu Xiake came and called it 'the greatest sight under heaven'; in 2010 Time magazine put it among the world's ten most precarious buildings."},"left":[{"t":"label","zh":"悬空寺","en":"HANGING TEMPLE · 悬空寺"},{"c":"xuankong","w":"36%","r":2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"photo","p":"p394","r":-1,"w":"84%","cap":{"zh":"挂在半崖上","en":"Hanging halfway up the cliff"}},{"t":"photo","p":"p383","r":1,"w":"50%","cap":{"zh":"13:44，先去售票处","en":"13:44 — first, the ticket office"}},{"t":"kbox","title":{"zh":"小知识 · 「壮观」多一点","en":"Field notes · the extra dot"},"intro":{"zh":"崖下的石头上刻着「壮观」两个大字，「壮」字多了一点。","en":"The rock below the temple is carved with two big characters, 'magnificent' — with one dot too many."},"rows":[{"h":{"zh":"传说","en":"The legend"},"t":{"zh":"李白来到这里，觉得「壮观」两个字都不够，就在「壮」字上多加了一点。清代的《恒山志》、明代的《浑源州志》都这么写。","en":"Li Bai came here, felt 'magnificent' wasn't enough, and added a dot. Qing and Ming gazetteers both tell it."}},{"h":{"zh":"反转","en":"The twist"},"t":{"zh":"大同市政府网站说，这字体像明清流行的馆阁体，大概是后人借李白的名字写的；全国至少有五处「李白写的壮观」。","en":"Datong's own government site says the hand looks like Ming–Qing court script — probably someone borrowing Li Bai's name. There are at least five 'Li Bai magnificents' around China."}},{"h":{"zh":"今天这两个字","en":"Today's carving"},"t":{"zh":"是 1991 年照华严寺收藏的清代拓片重新刻的。","en":"Re-cut in 1991 from a Qing rubbing kept at Huayan Temple."}}]}],"right":[{"t":"row","p":["p386","p397"]},{"t":"note","txt":{"zh":"悬空寺的日☀️与夜🌃。壮观，壮观！这座屹立千年不倒的崖壁上的寺庙，麻雀虽小但五脏俱全，还有个迷你大雄宝殿。","en":"The Hanging Temple by day ☀️ and by night 🌃. Magnificent, magnificent! This temple on the cliff, standing for a thousand years without falling, is small but has everything — even a mini Great Hall."}},{"t":"note","txt":{"zh":"悬空寺始建于北魏，历代多有修缮和重建。站在山下远远看去，就已经明白为什么古人会用“壮观”二字来形容它；","en":"The Hanging Temple was begun in the Northern Wei and repaired and rebuilt many times since. Just looking up at it from the foot of the mountain, you understand why the ancients chose the word 'magnificent' for it;"},"by":"dad"},{"t":"photo","p":"p400","r":1,"w":"62%","cap":{"zh":"崖下就是「壮观」石","en":"The 'magnificent' rock below"}},{"t":"row","p":["p407","p409"]},{"t":"note","txt":{"zh":"悬空寺的登临票提前七天在网上抢。我们晚了一天，网上早就一张不剩，只好跑去现场碰碰运气。现场每天就那么些票，老人的免费票更少。偏偏那天车在路上开得特别久（也不知道省道上白天哪来那么多大货车），一路上心里七上八下。排到窗口——幸好还有！\n后来听说，现场已经不卖登临票了，只能网上抢。没有国内手机号、约不上票的外国游客怎么办？不会用手机的老人怎么办？当然，这是后话了。","en":"Climbing tickets for the Hanging Temple go on sale online seven days ahead. We were a day late: online there wasn't a single one left, so we went to try our luck at the gate. Only so many are sold there each day, and even fewer free tickets for the elderly. And that day, of all days, the drive took especially long (who knows why the provincial road was full of big lorries in broad daylight); all the way our hearts were in our mouths. At the window — luckily, there were still some!\nLater we heard the gate has stopped selling climbing tickets altogether; it's online only. What about foreign visitors with no Chinese phone number to book with? What about elderly people who can't use a smartphone? But that's another story."}},{"t":"tip","txt":{"zh":"悬空寺门票 ¥15（≈ $2），登临另收 ¥100（≈ $15），以当日公示为准。==登临票每天限量 1200 张，常常一放就没==：在小程序「北岳云游」预约 7 天内的票；2026 年 6 月 26 日起每天分两段放——前一天 20:00–23:00、当天 7:20–18:00，各 600 张，两段都含 60 岁以上免费票。现场还卖不卖，以当日公示为准。","en":"Entry ¥15 (≈ $2), plus ¥100 (≈ $15) to climb up into the temple — check on the day. ==Climbing tickets are capped at 1,200 a day and often go the moment they're released==: book up to 7 days ahead on the 'Beiyue Yunyou' WeChat mini-programme. From 26 June 2026 they're released in two batches of 600 — 20:00–23:00 the day before and 7:20–18:00 on the day — each including free tickets for over-60s. Whether any are sold at the gate: check on the day."}}],"cuts":[],"lat":39.6596515,"lon":113.7089612},{"id":"b","L":"B","area":"m","kind":"sight","time":"14:10","name":{"zh":"走进悬空寺","en":"Up inside the temple"},"pinName":{"zh":"登临","en":"Climbing in"},"lab":{"dx":18,"dy":6,"a":"start"},"nudge":[70,50],"notes":{"zh":"整座寺只占地一百五十多平方米，却有四十间殿阁，用栈道、悬梯一层层连起来，脚下的木板外面就是悬崖。头顶的崖壁上凿了一道「天沟」，专门挡落石——2015 年还真有一块落石砸中了鼓楼的吻兽，寺关了半年修。","en":"The whole temple covers only about 150 square metres, yet holds forty halls and rooms, linked level by level by plank walks and hanging stairs, with the drop right outside the boards. A 'sky gutter' is cut into the cliff overhead to catch falling rocks — and in 2015 one did hit the drum tower's ridge ornament, closing the temple for half a year."},"left":[{"t":"label","zh":"栈道悬梯","en":"PLANKS AND LADDERS"},{"t":"notes"},{"t":"photo","p":"p414","r":-1,"w":"88%","cap":{"zh":"上去之前，大家在崖下栈道上","en":"Everyone on the walkway below, before going up"}},{"t":"row","p":["p422","p425"]},{"t":"row","p":["p2021","p2019"],"cap":[{"zh":"爬悬梯（视频截图）","en":"Up a hanging ladder (video stills)"},{"zh":"蹲下来，抓着梁往前挪","en":"Crouching, gripping the beams"}]},{"t":"note","txt":{"zh":"栈道窄得很，人又多，前胸贴后背。好些地方，大人只能蹲下来，一点一点往前挪。二楼的栏杆，大人站直了才到腰，男人还不到腰，往外一看，脚下就是几十米的空。外婆恐高，老公也恐高，两个人贴着墙，一步一步地蹭。孩子们倒一点不怕，只觉得新奇。\n好不容易下来了，老公在底下站了一会儿，忽然说：“来都来了，要挑战一下自己，再看一次！”转身又绕回去，从头走了一遍。","en":"The plank walks are narrow, and with the crowds we were pressed front to back. In many places the grown-ups could only crouch and inch forward. On the second floor the railing reached only an adult's waist standing straight — below the waist for the men — and one look out showed tens of metres of empty air beneath. My mother is afraid of heights, and so is my husband; the two of them hugged the wall and edged along step by step. The kids weren't scared at all — just curious.\nWhen we finally got down, my husband stood at the bottom for a moment, then suddenly said, 'We've come all this way — I should challenge myself and see it once more!' He turned round, went back, and did the whole route again."}},{"t":"row","p":["p2022","p2023","p2024"],"cap":[{"zh":"栈道上（视频截图）","en":"On the walkway (video stills)"},{"zh":"手脚并用","en":"Hands and feet"},{"zh":"扶着岩壁","en":"A hand on the cliff"}]},{"t":"photo","p":"p442","r":1,"w":"54%","cap":{"zh":"楼阁里人挤人","en":"Shoulder to shoulder inside"}}],"right":[{"t":"row","p":["p431","p447"]},{"t":"note","txt":{"zh":"这次本来对登临不抱希望了，提前7天线上放票迅速售罄，线下的票也少得可怜。还好我们运气爆棚，达成心愿🫶。登临是去一次少一次，前段时间还临时关闭，传说也是之后有可能会永久关闭只能远观了。小朋友们是初生牛犊不怕虎，恐高是一点没有的。大人们倒是都走得小心翼翼，有一段的护栏也就到膝盖处，往下看去悬崖绝壁，不免生出些害怕，也更有对浑源工匠们的敬意。","en":"I'd given up hope of climbing up this time: online tickets released 7 days ahead sold out in no time, and there were pitifully few at the gate. Luckily our luck was off the charts and we got our wish 🫶. Every climb may be one of the last — it was closed for a while recently, and rumour has it that one day it may close for good and you'll only be able to look from below. The kids, like newborn calves unafraid of tigers, had no fear of heights at all. The grown-ups all stepped very carefully; along one stretch the railing only came up to the knee, and looking down at the sheer drop you couldn't help feeling a little scared — and all the more respect for the Hunyuan craftsmen."}},{"t":"note","txt":{"zh":"真正登上去，才体会到它的“险”。栏杆之外几乎就是垂直的悬崖，我的恐高症又一次被精准唤醒。可是回头再看，又忍不住回去“二刷”。","en":"Only once you're up there do you feel how perilous it is. Beyond the railing is an almost vertical drop, and my fear of heights was woken right on cue. And yet, looking back, I couldn't resist going round a second time."},"by":"dad"},{"t":"photo","p":"p470","r":-1,"w":"58%","cap":{"zh":"往下看","en":"Looking down"}},{"t":"photo","p":"p439","r":1,"w":"62%"},{"t":"row","p":["p2015","p429"],"cap":[{"zh":"倚着栏杆，一点不怕（视频截图）","en":"Leaning on the rail, not scared at all (video still)"},null]},{"t":"photo","p":"p482","r":1,"w":"72%"}],"cuts":[],"lat":39.6591736,"lon":113.7101933},{"id":"c","L":"C","area":"m","kind":"sight","time":"14:23","name":{"zh":"三教同堂","en":"Three teachings under one roof"},"pinName":{"zh":"殿里 · 下来以后","en":"The halls · back down"},"lab":{"dx":16,"dy":-16,"a":"start"},"notes":{"zh":"登临的路绕着四十间殿阁走一圈，里面供的有佛，有道，也有儒。最高处的三教殿里，释迦牟尼、老子、孔子坐在同一间屋里：三家在别处常常争谁第一，在这里挤在一起，相安无事。其实寺最早的名字「玄空阁」，就已经一个字取道家，一个字取佛家了。","en":"The climbing route loops past the forty halls, and what they hold is Buddhist, Daoist and Confucian. In the highest, the Hall of Three Teachings, the Buddha, Laozi and Confucius sit in the same small room: three schools that elsewhere argued over who came first, squeezed in here together in peace. Even the temple's first name, Xuankong Ge, took one word from the Daoists and one from the Buddhists."},"left":[{"t":"label","zh":"三教同堂","en":"THREE TEACHINGS"},{"t":"notes"},{"t":"photo","p":"p474","r":-1,"w":"72%"},{"t":"row","p":["p475","p489"],"cap":[{"zh":"三圣殿","en":"Sansheng Hall"},null]},{"t":"photo","p":"p487","r":1,"w":"60%","cap":{"zh":"在殿里拜一拜","en":"A bow in the hall"}},{"t":"kbox","title":{"zh":"小知识 · 一座小寺，几段故事","en":"Field notes · a small temple, several stories"},"intro":{"zh":"名字容易弄混，故事也不少。","en":"Easy names to mix up — and more stories than you'd expect."},"rows":[{"h":{"zh":"三教殿","en":"Hall of Three Teachings"},"t":{"zh":"在寺的最高处，释迦牟尼、老子、孔子三位教主同殿供奉。","en":"At the very top: the Buddha, Laozi and Confucius, enshrined together."}},{"h":{"zh":"三圣殿","en":"Sansheng Hall"},"t":{"zh":"名字像，其实是佛殿：里面是泥塑的释迦、韦陀、天女和阿难。儒、道、佛三家同堂的，是楼上的三教殿。","en":"The name is similar, but it's a Buddhist hall — clay figures of the Buddha, Weituo, a celestial maiden and Ananda. The three-teachings room is the one further up."}},{"h":{"zh":"《黑神话：悟空》","en":"Black Myth: Wukong"},"t":{"zh":"游戏里的 36 处实景取景地，山西占了 27 处；浑源县有两处——悬空寺和永安寺。","en":"Of the game's 36 real-world locations, 27 are in Shanxi; two are in Hunyuan County — the Hanging Temple and Yong'an Temple."}},{"h":{"zh":"《笑傲江湖》","en":"The Smiling, Proud Wanderer"},"t":{"zh":"金庸写进了第三十回「密议」：当上恒山派掌门的令狐冲，请少林方证大师、武当冲虚道长到悬空寺商量怎么对付左冷禅。书里说寺有「楼阁二座，皆高三层，凌虚数十丈……二楼之间，联以飞桥」，还给两座楼起名灵龟阁、神蛇阁。三人正在飞桥上说话，两边楼里埋伏着日月神教的人——幸好任盈盈及时赶到。","en":"Jin Yong set chapter 30, 'A Secret Council', here: Linghu Chong, now head of the Mount Heng sect, brings Abbot Fangzheng of Shaolin and Daoist Chongxu of Wudang to the temple to plan against Zuo Lengchan. The novel gives it 'two towers, each three storeys high, tens of zhang above the void… joined by a flying bridge', and names them the Spirit Tortoise and the Divine Serpent. As the three talk on the bridge, Sun Moon Cult men lie in ambush on both sides — until Ren Yingying arrives just in time."}}]},{"t":"row","p":["p539","p543"]}],"right":[{"t":"photo","p":"p459","r":1,"w":"56%"},{"t":"row","p":["p464","p467","p469"]},{"t":"photo","p":"p480","r":-1,"w":"56%"},{"t":"photo","p":"p494","r":1,"w":"52%"},{"t":"photo","p":"p510","r":-1,"w":"62%","cap":{"zh":"下来以后，大合影","en":"Back down: the big group photo"}},{"t":"row","p":["p516","p522"]},{"t":"photo","p":"p527","r":1,"w":"56%","cap":{"zh":"回头再看一眼","en":"One more look back"}}],"cuts":[],"lat":39.661541,"lon":113.7083418},{"id":"d","L":"D","area":"a","kind":"sight","time":"16:19","name":{"zh":"北岳恒山","en":"Mount Heng, the Northern Peak"},"pinName":{"zh":"恒山","en":"Mount Heng"},"lab":{"dx":18,"dy":-10,"a":"start"},"notes":{"zh":"恒山是五岳里的北岳，主峰天峰岭海拔 2016.1 米。有意思的是，北岳搬过家：明代以前，朝廷祭北岳是在河北曲阳的大茂山，到清顺治年间才改到山西浑源，这座山从此叫恒山。传说四千年前舜帝北巡到这里祭北岳，大雪封山上不去，只好在曲阳遥祭，忽然一块石头从恒山飞到他面前；石头飞走的地方留下一个大石窟，叫「飞石窟」，北岳最早的正殿就建在窟里。清代的魏源比较五岳：「恒山如行，泰山如坐，华山如立，嵩山如卧，唯有南岳独如飞。」","en":"Mount Heng is the Northern Peak of the Five Great Mountains; its summit, Tianfeng Ridge, stands at 2,016.1 metres. Oddly, the Northern Peak once moved house: until the Ming, the court made its sacrifices to the north at Damao Shan in Quyang, Hebei, and only under the Shunzhi Emperor in the Qing were they moved here to Hunyuan — this mountain has been Mount Heng ever since. Legend says that four thousand years ago Emperor Shun came north to sacrifice, found the mountain snowed in and worshipped from Quyang instead, when a stone flew from Mount Heng and landed before him. Where it flew from, a great hollow was left, the 'Flying Stone Grotto', and the first main hall of the Northern Peak was built inside it. The Qing writer Wei Yuan compared the five: 'Heng walks, Tai sits, Hua stands, Song lies down — and only the Southern Peak flies.'"},"left":[{"t":"label","zh":"北岳","en":"THE NORTHERN PEAK"},{"c":"hengshan","w":"38%","r":-2,"a":"r","wrap":1,"t":"deco"},{"t":"notes"},{"t":"photo","p":"p553","r":-1,"w":"84%","cap":{"zh":"我在恒山想你","en":"'Missing you from Mount Heng'"}},{"t":"row","p":["p2002","p2003"],"cap":[{"zh":"坐索道上恒山（视频截图）","en":"Cable car up Mount Heng (video stills)"},null]},{"t":"row","p":["p555","p565"]},{"t":"row","p":["p573","p581"]},{"t":"note","txt":{"zh":"离晚上的演出还早。既然到了恒山脚下，北岳总得上去看看。\n我们坐索道上山。到了半山腰，大家分了头：爷爷和老公还想往上，一直走过凌极门。估计离天峰岭的峰顶还差一百多米，可路越来越陡，又要赶下山的索道——索道六点就停了，错过了就得自己走下山，膝盖可受不了。于是就此作罢。外公外婆领着两个孩子去了观音庙；其余的人在半山腰等。\n下山的时候，一家人又凑齐了，一起坐索道下来。","en":"There was still time before the evening show. Since we were at the foot of Mount Heng, we had to go up and see the Northern Peak.\nWe took the cable car up. Halfway up the mountain we split up: Grandpa and my husband wanted to keep climbing and went on past Lingji Gate. They reckoned they were still a hundred-odd metres short of the summit, Tianfeng Ridge, but the path kept getting steeper, and they had to catch the cable car down — it stops at six, and missing it would mean walking all the way down, which is hard on the knees. So they called it a day. My parents took the two boys to the Guanyin temple; the rest of us waited halfway up.\nComing down, the whole family was together again, and we all rode the cable car down."}},{"t":"kbox","title":{"zh":"小知识 · 我们走到的几处","en":"Field notes · where we went"},"intro":{"zh":"恒山的庙群挂在半山腰上，一殿一个故事。","en":"Mount Heng's temples cling to the mountainside, one story to a hall."},"rows":[{"h":{"zh":"「母仪天下」","en":"'Mother of All'"},"t":{"zh":"供女神的殿，多半就是九天宫。九天宫民间叫「奶奶庙」，供九天玄女——神话里帮黄帝打败蚩尤的女神，后来也管送儿送女。","en":"A hall of goddesses — most likely the Jiutian Palace, the 'Granny Temple', which honours the Nine Heavens Mystic Lady, who helped the Yellow Emperor defeat Chiyou and later took charge of bringing children."}},{"h":{"zh":"「光天一炁」","en":"'One breath'"},"t":{"zh":"「炁」是道教的「气」，「一炁」指万物最初的那一口气。","en":"Qi in its Daoist spelling: 'one breath', the primal breath all things came from."}},{"h":{"zh":"会仙府","en":"Huixian Fu"},"t":{"zh":"海拔约 1820 米，是恒山位置最高的一组建筑，供福禄寿三星和八洞神仙。","en":"At about 1,820 m, the highest group of buildings on the mountain, home to the gods of fortune, rank and long life and the Eight Immortals' cave-mates."}},{"h":{"zh":"凌极门","en":"Lingji Gate"},"t":{"zh":"去峰顶天峰岭要过的一道门，过了门，登顶的路又窄又陡。","en":"The gate on the way to the summit, Tianfeng Ridge; beyond it the path narrows and steepens."}}]}],"right":[{"t":"row","p":["p548","p559"]},{"t":"row","p":["p566","p568"],"cap":[{"zh":"「光天一炁」","en":"'One breath'"},{"zh":"「母仪天下」","en":"'Mother of All'"}]},{"t":"photo","p":"p561","r":-1,"w":"70%"},{"t":"photo","p":"p582","r":1,"w":"50%","cap":{"zh":"凌极门，再往上就是去峰顶的路","en":"Lingji Gate — beyond it, the summit path"}},{"t":"kbox","title":{"zh":"小知识 · 《笑傲江湖》里的恒山","en":"Field notes · Mount Heng in Jin Yong"},"intro":{"zh":"来恒山，绕不开金庸。","en":"You can't come to Mount Heng without Jin Yong."},"rows":[{"h":{"zh":"一派尼姑","en":"A sect of nuns"},"t":{"zh":"五岳剑派里，恒山派全是女弟子，住在见性峰上的无色庵；掌门定闲师太和师妹定静、定逸，人称「恒山三定」。剑法「绵密有余，凌厉不足」，正适合女子。","en":"Of the Five Peaks sects, Mount Heng's is all women, living at the Wuse Convent on Jianxing Peak and led by three senior nuns, Dingxian, Dingjing and Dingyi. Its swordplay is 'dense rather than fierce', made for women."}},{"h":{"zh":"男掌门","en":"A man in charge"},"t":{"zh":"定闲师太临终，把恒山派托给了令狐冲——一群尼姑的掌门，是个爱喝酒的大男人。","en":"Dying, Dingxian left the sect to Linghu Chong — so a house of nuns ended up led by a hard-drinking young man."}},{"h":{"zh":"小师妹","en":"Little Sister"},"t":{"zh":"仪琳是定逸师太的徒弟，最心软的小尼姑，她爹是不戒和尚。山上的「小师妹茶咖」，借的就是她。","en":"Yilin, Dingyi's pupil, is the softest-hearted little nun; her father is the monk Bujie. The mountain's 'Little Sister' café borrows her."}},{"h":{"zh":"悬空寺那一回","en":"The temple chapter"},"t":{"zh":"令狐冲当了掌门，请方证、冲虚到悬空寺密议——见前面「三教同堂」那页。","en":"As the new head he takes Fangzheng and Chongxu to the Hanging Temple — see the 'Three teachings' page."}}]},{"t":"row","p":["p589","p590"],"cap":[{"zh":"小师妹茶咖","en":"The 'Little Sister' café"},{"zh":"五岳特种兵 · 恒山站","en":"Five Peaks challenge · Heng"}]},{"t":"note","txt":{"zh":"等晚上演出前，又顺路上了一次恒山。第一次登五岳，是10岁时的嵩山；第二次登五岳，已经是28年后的今天，在恒山。果然不出我所料，还真让我找到了《笑傲江湖》元素——仪琳小师妹文创店😆","en":"Waiting for the evening show, we went up Mount Heng on the way. My first of the Five Great Mountains was Song Shan, at ten; my second is today, twenty-eight years later, on Heng Shan. Just as I'd guessed, I really did find something from The Smiling, Proud Wanderer — a 'Little Sister Yilin' gift shop 😆"},"by":"dad"},{"t":"tip","txt":{"zh":"恒山庙群门票 ¥45（≈ $7），以当日公示为准。恒山索道 2014 年开通，全长约 1.7 公里，下站在岳门湾游客服务中心。夏季（5/6–9/30）景区 8:00–17:30、索道 8:00–18:00，==别错过最后一班下山索道==。","en":"Mount Heng temples: ¥45 (≈ $7) — check on the day. The cable car, opened in 2014, runs about 1.7 km from the Yuemenwan visitor centre. In summer (6 May–30 Sep) the mountain is open 8:00–17:30 and the cable car 8:00–18:00 — ==don't miss the last car down==."}}],"cuts":[],"lat":39.6689412,"lon":113.7254484},{"id":"e","L":"E","area":"n","kind":"sight","time":"19:10","name":{"zh":"《何以悬空寺》 · 开场","en":"Why the Temple Hangs · opening"},"pinName":{"zh":"《何以悬空寺》","en":"The cliff show"},"lab":{"dx":-18,"dy":-8,"a":"end"},"notes":{"zh":"天黑以后，回到悬空寺看《何以悬空寺》。这是一台大型崖壁光影实景演出，2026 年 5 月 18 日才首演，观众跟着剧情一路走着看，全程站立。一位「玄武老者」带着大家穿越时空，一个个请出和悬空寺有关的历史人物：北魏的道士寇谦之、写下「壮观」传说的李白、金代诗人元好问、明代的徐霞客。前半场在搭起来的实景舞台上，有真人演员；后半场走到悬空寺对面看崖壁。总导演杨建林，主创团队参与过《只此青绿》《赳赳大秦》《长恨歌》和北京冬奥会开闭幕式。","en":"After dark we went back to the temple for 'Why the Temple Hangs' (He Yi Xuankong Si), a large light-and-landscape show on the cliff that only premiered on 18 May 2026. The audience walks with the story and stands throughout. An old sage, the 'Xuanwu Elder', leads everyone through time and calls up the people tied to the temple: the Northern Wei Daoist Kou Qianzhi, Li Bai of the 'magnificent' legend, the Jin poet Yuan Haowen, and the Ming traveller Xu Xiake. The first half plays on a built set with live actors; for the second, you cross over to face the temple and its cliff. The chief director is Yang Jianlin; the creative team has worked on the dance-drama Ode to Verdant Mountains, The Mighty Qin, The Everlasting Regret, and the Beijing Winter Olympics ceremonies."},"left":[{"t":"label","zh":"何以悬空","en":"WHY IT HANGS"},{"t":"notes"},{"t":"photo","p":"p604","r":-1,"w":"86%","cap":{"zh":"开演前，在「何以悬空寺」的灯笼前","en":"Before the show, under the lanterns"}},{"t":"photo","p":"p2004","r":1,"w":"70%","cap":{"zh":"看演出（视频截图）","en":"At the show (video still)"}},{"t":"kbox","title":{"zh":"小知识 · 戏里请出的人","en":"Field notes · who appears"},"intro":{"zh":"几位都是真实的历史人物。","en":"All of them really lived."},"rows":[{"h":{"zh":"寇谦之","en":"Kou Qianzhi"},"t":{"zh":"北魏的道士，改革了天师道，太武帝很信他。悬空寺最早的「玄空阁」，传说和他的道场有关。","en":"A Northern Wei Daoist who reformed the Celestial Masters and had Emperor Taiwu's ear. The temple's first 'Xuankong Pavilion' is said to be linked to his altar."}},{"h":{"zh":"李白","en":"Li Bai"},"t":{"zh":"就是「壮观」多一点的那个传说。","en":"The extra dot in 'magnificent'."}},{"h":{"zh":"徐霞客","en":"Xu Xiake"},"t":{"zh":"明代的旅行家，1633 年游恒山，写下悬空寺是「天下巨观」。","en":"The Ming traveller, who walked Mount Heng in 1633 and called the temple 'the greatest sight under heaven'."}}]}],"right":[{"t":"photo","p":"p607","r":1,"w":"80%","cap":{"zh":"天黑前的小吃街","en":"The snack street before dark"}},{"t":"photo","p":"p611","r":-1,"w":"84%"},{"t":"row","p":["p614","p615"]},{"t":"photo","p":"p2005","r":-1,"w":"80%","cap":{"zh":"整面山崖亮起来，满崖都是楼阁（视频截图）","en":"The whole cliff lights up with pavilions (video still)"}},{"t":"row","p":["p617","p622","p624"]}],"cuts":[],"lat":39.6621,"lon":113.7068},{"id":"f","L":"F","area":"n","kind":"sight","time":"21:00","name":{"zh":"崖壁上的光影","en":"Light on the cliff"},"pinName":{"zh":"崖壁光影","en":"Cliff projection"},"lab":{"dx":18,"dy":24,"a":"start"},"notes":{"zh":"最后几幕，光打在悬空寺所在的整面崖壁上：星轨转起来，月亮和星球浮在半空，竖排的大字一行行出来，山水、飞天、成排的灯笼，最后打出「何以悬空寺」几个大字。投影面积三万七千五百多平方米，2026 年 6 月拿到了吉尼斯「最大的崖壁光影秀」。用的是冷光源，没有紫外线和热辐射，照度只有日光的万分之一，设备离崖壁远远的，不碰古建筑一下。","en":"In the last scenes the light falls on the whole cliff that holds the temple: star trails wheel, moons and planets hang in the air, lines of tall characters appear one by one, then mountains and rivers, flying apsaras, rows of lanterns — and finally the words 'Why the Temple Hangs'. The projection covers over 37,500 square metres, and in June 2026 it was certified by Guinness as the largest cliff light show. It uses cold light — no ultraviolet, no heat — at one ten-thousandth of daylight, from projectors set well back, never touching the old buildings."},"left":[{"t":"label","zh":"崖壁光影","en":"LIGHT ON THE CLIFF"},{"t":"notes"},{"t":"kbox","title":{"zh":"小知识 · 六个篇章","en":"Field notes · six chapters"},"intro":{"zh":"边走边看：第一章在小吃街，第四章到了悬空寺下，最后站到对岸看整面崖壁。（篇名只在一篇报道里见到）","en":"You walk as you watch: chapter one in the snack street, chapter four below the temple, and the last ones from across the gorge, facing the whole cliff. (The titles appear in only one report.)"},"rows":[{"h":{"zh":"一","en":"1"},"t":{"zh":"《恒山问道·缘起》","en":"Asking the Way on Mount Heng · Origins"}},{"h":{"zh":"二","en":"2"},"t":{"zh":"《绝壁生佛·营造》","en":"Buddhas Born from the Cliff · Building"}},{"h":{"zh":"三","en":"3"},"t":{"zh":"《诗仙留痕·诗魂》——李白、徐霞客出场","en":"The Poet Immortal's Trace · Soul of Poetry — Li Bai and Xu Xiake appear"}},{"h":{"zh":"四","en":"4"},"t":{"zh":"《千年守望·文脉》","en":"A Thousand Years' Watch · Heritage"}},{"h":{"zh":"五","en":"5"},"t":{"zh":"《山河回响·盛世》","en":"Echoes of the Land · Golden Age"}},{"h":{"zh":"六","en":"6"},"t":{"zh":"《何以悬空·永恒》","en":"Why It Hangs · Forever"}}]},{"t":"photo","p":"p630","r":-1,"w":"86%"},{"t":"photo","p":"p646","r":1,"w":"80%","cap":{"zh":"「上延霄客，下绝嚣浮」","en":"'Up to the sky's guests, away from the noisy world'"}},{"t":"row","p":["p2008","p2007"],"cap":[{"zh":"视频截图","en":"Video stills"},null]},{"t":"photo","p":"p2011","r":1,"w":"80%","cap":{"zh":"满崖的灯笼（视频截图）","en":"Lanterns all over the cliff (video still)"}}],"right":[{"t":"row","p":["p642","p663"]},{"t":"photo","p":"p2009","r":1,"w":"84%","cap":{"zh":"李白那一幕：崖上写出「壮观」（视频截图）","en":"Li Bai's scene: 'magnificent' written across the cliff (video still)"}},{"t":"photo","p":"p698","r":1,"w":"84%"},{"t":"photo","p":"p680","r":-1,"w":"88%","cap":{"zh":"最后一幕：何以悬空寺","en":"The finale: why the temple hangs"}},{"t":"note","txt":{"zh":"晚上《何以悬空寺》，故事虽有些单薄，但形式还是很新颖，以悬空寺和身后的群山为布景，华美绚丽的灯光和寺和石完美结合，视觉享受，还是值得一看的。满满的一日，","en":"In the evening, Why the Temple Hangs: the story is a bit thin, but the format is really novel — the Hanging Temple and the mountains behind it are the set, and the gorgeous lighting blends perfectly with temple and rock. A feast for the eyes, definitely worth seeing. A full, full day,"}},{"t":"note","txt":{"zh":"晚上看的悬崖光影秀也很惊喜。以悬空寺为背景，把周围近乎垂直的山崖当作天然幕布，本身就是一个很好的创意。影像又很好地顺着山石的形状展开，悬空寺的气势进一步被放大了。哥俩看到后面都激动起来，拿着手表不停拍照。","en":"The cliff light show that night was a pleasant surprise too. Using the Hanging Temple as the backdrop and the near-vertical cliffs around it as a natural screen is a great idea in itself. The images unfold along the shapes of the rock, and the temple's grandeur is magnified even further. By the end both boys were thrilled, snapping away nonstop with their watches."},"by":"dad"},{"t":"note","txt":{"zh":"前两章平平。到第三章，李白、徐霞客出来，开始好看了。下一章是青龙、玄武，更好看。最好看的是最后：整面山崖都亮了，演古人怎么在悬崖上凿洞、插梁，一层一层把寺搭起来，看得人热血。\n一座木头的寺，挂在崖上一千多年，到今天还在，是一代一代的人守着它，修了又修。看完很感动。我们今天能站在这里看它，靠的是前人一代一代攒下来的。","en":"The first two chapters were so-so. In the third, with Li Bai and Xu Xiake, it started getting good. The next, with the Azure Dragon and the Black Tortoise, was better still. Best of all was the end: the whole cliff lit up, showing how people long ago cut holes in the rock, drove in beams, and built the temple up storey by storey. It got the blood pumping.\nA wooden temple, hanging on a cliff for over a thousand years and still here today — because generation after generation has looked after it, repairing it again and again. It moved me deeply. That we can stand here and see it today is thanks to what those before us built up, one generation after another."}},{"t":"tip","txt":{"zh":"演出每晚 20:00 开第一场，周一到周四一般两场，周五到周日三四场，以当日公示为准。==全程站着、边走边看，山里夜里凉，带件外套==。","en":"The first show starts at 20:00; usually two a night Monday to Thursday, three or four Friday to Sunday — check on the day. ==You stand and walk the whole time, and mountain nights are cold: bring a jacket.=="}}],"cuts":[],"lat":39.6593,"lon":113.71},{"id":"g","L":"G","area":"d","kind":"sight","time":"08:34","lat":39.664,"lon":113.6958,"name":{"zh":"再见大同","en":"Goodbye, Datong"},"pinName":{"zh":"← 回大同 · 去北京","en":"← Datong · to Beijing"},"lab":{"dx":18,"dy":6,"a":"start"},"notes":{"zh":"看完演出回到大同，已经过了半夜。从大同去北京坐的是张大高铁：2019 年底开通，接上京张高铁，大同南到北京最快一小时四十二分。","en":"It was past midnight when we got back to Datong. To Beijing we took the Zhangjiakou–Datong high-speed line, opened at the end of 2019 and joined to the Beijing–Zhangjiakou line: Datong South to Beijing takes as little as an hour and forty-two minutes."},"left":[{"t":"label","zh":"去北京","en":"TO BEIJING"},{"t":"notes"},{"t":"photo","p":"p687","r":-1,"w":"76%"},{"t":"note","txt":{"zh":"算是完美收官本次西安➡️洛阳➡️开封➡️大同的古都走廊之行了，感谢团员们的支持和配合，满满当当的宝贵回忆。总体感受就是，国内的古城真的有用心开发挖掘合适的商业化机会，基建也有跟上，吃的饭店都不踩雷，也可能恰巧我们时间点都踩得不错，没有遇上酷热和暑假高峰，体验感好过预期，🫶。","en":"a perfect finale to our Xi'an ➡️ Luoyang ➡️ Kaifeng ➡️ Datong ancient-capitals trip. Thanks to all our team members for their support and cooperation — so many precious memories. My overall feeling: China's old cities really are working hard to find the right kind of commercial development, the infrastructure has kept up, and none of the restaurants let us down. Maybe we also just timed it well, missing the worst heat and the summer-holiday peak. Better than expected 🫶."}},{"t":"note","txt":{"zh":"云冈石窟和悬空寺只是大同最有代表性的两站。其实大同的古迹到处都是：华严寺、纯阳宫……大同的确是个宝藏城市。","en":"Yungang and the Hanging Temple are just Datong's two best-known stops. In fact the city is full of old sites — Huayan Temple, Chunyang Temple… Datong really is a treasure of a city."},"by":"dad"}],"right":[{"t":"photo","p":"p688","r":1,"w":"58%","cap":{"zh":"第二天的早饭","en":"Breakfast the next day"}},{"t":"row","p":["p689","p690"],"cap":[{"zh":"去北京的路上","en":"On the way to Beijing"},null]},{"t":"note","txt":{"zh":"高铁到北京，这次古都之行结束。我告诉哥哥说，你已经去过了自秦统一中国以来几乎所有的大一统王朝和重要时代的古都，这次去的景点和活动也覆盖了各个重要的时代 —— 秦（兵马俑），汉（白马寺），三国（关林），晋（博物馆），北魏（云冈石窟，悬空寺），隋（博物馆），唐（大雁塔，龙门石窟），宋（清明上河园） —— 等以后有机会玩一次北京把元明清补上，就全齐活了。","en":"The high-speed train to Beijing, and the trip is over. I told our older boy that he has now been to the capitals of almost every unified dynasty and major era since Qin unified China, and that the sights and activities covered every important period — Qin (the Terracotta Army), Han (White Horse Temple), the Three Kingdoms (Guanlin), Jin (the museums), Northern Wei (Yungang, the Hanging Temple), Sui (the museums), Tang (the Big Wild Goose Pagoda, Longmen), Song (the Qingming Riverside Park). Once we get a proper trip to Beijing for the Yuan, Ming and Qing, the set will be complete."},"by":"dad"},{"t":"note","txt":{"zh":"在这次古都之行的结尾，最高兴的就是见到了十年未谋面的老朋友。感谢你们的盛情款待。过了这么多年，我们天各一方，追寻自己的道路，但我们仍然是很聊得来的好基友。","en":"At the end of the trip, the happiest part was seeing old friends we hadn't met in ten years. Thank you for your warm hospitality. After all these years, living far apart and each following our own road, we can still talk like the best of old buddies."},"by":"dad"},{"t":"end"}],"cuts":[]}],"voices":[],"vr":0.62,"days":[{"n":"Day 1","url":"#day1"},{"n":"Day 2","cur":true}]},"G":{"local":" M293.3,283.3 L293.6,287.9 L311.6,306.7 L317.6,317.6 L331.8,352.5 L334.5,378.0 L350.4,396.5 L369.0,409.5 L388.8,419.3 L391.4,423.3 L393.2,428.5 L394.0,433.8 L393.4,440.6 L391.8,447.9 L390.3,455.5 L389.7,460.5 L390.2,465.2 L392.0,473.7 L395.8,481.3 L412.3,492.0 L427.5,503.9 L429.4,507.8 L431.6,512.6 L428.6,522.2 L409.7,540.9 L404.2,544.9 L396.4,550.6 M491.8,636.1 L508.9,631.3 M508.9,631.3 L514.3,629.7 M514.3,629.7 L514.2,622.5 L511.9,616.3 L493.3,603.1 L480.2,588.0 L459.7,574.6 L457.9,570.4 L460.3,566.3 M389.5,553.9 L385.2,557.4 L384.3,566.8 L398.1,581.8 L478.1,626.3 L487.1,636.1 L491.8,636.1 M396.4,550.6 L389.5,553.9 M411.0,477.3 L42   <text x="6" y="${M.H-8}" font-family="${ff},cursive" font-size="17" fill="#c4554b">${LANG==='en'?'④ Waguriya or Himitsudō: pick the shorter line':'④ 和栗や / 秘密堂 看队伍二选一'}</text></svg>`;
  return `<figure class="rmap"><figcaption>${LANG==='en'?'Our afternoon route':'下午的散步路线'}</figcaption>${g}</figure>`}
 case 'sticker':return `<figure class="stk" style="width:${b.w}"><img src="${IMG['c_'+b.c]}" alt="" style="transform:rotate(${b.r}deg)"><figcaption>${T(b.cap)}</figcaption></figure>`;
 case 'callout':return `<div class="callout"><p>${T(b.txt)}</p></div>`;
 case 'deco':return `<img class="deco-st" src="${IMG['c_'+b.c]}" alt="" style="width:${b.w||'40%'};align-self:${b.a==='l'?'flex-start':b.a==='c'?'center':'flex-end'};--r:${b.r||0}deg;margin-top:${b.mt||0}px;margin-bottom:${b.mb||0}px">`;
 case 'big':return `<div class="big">${b.w}</div>`;
 case 'circles':return `<div class="circles">${b.items.map(([id,c,col])=>`<div class="dot ${col} "><p>${T(c)}</p><img class="cc" src="${IMG[id]}" alt="" loading="lazy"></div>`).join('')}</div>`;
 case 'slip':return `<figure class="slip "><img src="${IMG[b.p]}" alt="" loading="lazy"><figcaption>${T(b.cap)}</figcaption></figure>`;
 case 'film':return `<div class="film ">${b.p.map(id=>`<img src="${IMG[id]}" alt="" loading="lazy">`).join('')}</div>`;
 case 'belt':return `<div class="belt">${b.p.map(id=>`<img src="${IMG[id]}" alt="" loading="lazy">`).join('')}</div>`;
 case 'end':return `<div class="endmark">${T(UI.end)}</div>`;
} return ''}
function buildBook(){
  const VO=(D.voices||[]);const vtxt=v=>T(v.txt).split('\n').map(x=>x.startsWith('- ')?`<p class="hand vli">${md(x.slice(2))}</p>`:/^\d+\. /.test(x)?`<p class="hand vli vnum">${md(x)}</p>`:`<p class="hand">${md(x)}</p>`).join('');
  const BACK=`<button class="backmap" data-back><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>${T(UI.back)}</button>`;
  const vpage=(v,i)=>`<div class="pg vpg"><div class="pghead">${i?BACK:`<span>${D.ui.day}</span>`}<span class="tag vtag"><b>✎</b>${T(v.tag)}</span></div><div class="feelwrap vwrap">${vtxt(v)}</div>${(v.rows||[]).map(r=>block(r,{})).join('')}${v.credit?`<p class="vcredit">${T(v.credit)}</p>`:''}</div>`;
  const voice=pos=>{const vs=VO.filter(v=>v.pos===pos);if(!vs.length)return'';const wide=vs.filter(v=>v.wide).map(v=>`<figure class="vwide"><img src="${IMG[v.wide.p]}" alt=""><figcaption>${T(v.wide.cap)}<small>${T(v.wide.src||'')}</small></figcaption></figure>`).join('');return `<article class="spread vsp" id="sp-his">${vs.map(vpage).join('')}${vs.length===1?'<div class="pg"></div>':''}${wide}</article>`};
  $('#book').innerHTML=voice('start')+PL.map((p,i)=>{const col=p.kind==='food'?'#d9822b':'#24211e',ac=AR[p.area].color,nx=PL[i+1];
    const cut=side=>p.cuts.filter(c=>c.side===side).map(c=>`<img class="cut " src="${IMG['c_'+c.c]}" alt="" style="${c.s}">`).join('');
    return `<article class="spread" id="sp-${p.id}" aria-label="${p.L} ${T(p.name)}">${p.wide?`<figure class="vwide vtop"${p.wide.mx?` style="--wmx:${p.wide.mx}px"`:''}><img src="${IMG[p.wide.p[LANG]||p.wide.p.zh]}" alt="${T(p.wide.cap||'')}">${p.wide.cap?`<figcaption>${T(p.wide.cap)}</figcaption>`:''}</figure>`:''}
     <div class="pg"><div class="pghead"><span>${D.ui.day}</span><span class="tag"><b style="background:${col};box-shadow:0 0 0 3px ${ac}">${p.L}</b>${T(p.name)}</span></div>${blocks(p.left,p)}${cut('left')}</div>
     <div class="pg"><div class="pghead"><button class="backmap" data-back><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>${T(UI.back)}</button><span style="color:${ac}">${T(AR[p.area])}</span></div>${blocks(p.right,p)}${cut('right')}
      ${nx?`<button class="nextp" data-next="${nx.id}">${T(UI.next)} ${nx.L} · ${T(nx.name)}</button>`:''}</div></article>`}).join('')+voice('end');
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>$('#mapsheet').scrollIntoView({behavior:'smooth'}));
  document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>jump(b.dataset.next));
}
function jump(id){const el=$('#sp-'+id);if(!el)return;el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}

/* ---------------- text / language ---------------- */
function renderAll(){
  document.documentElement.lang=LANG==='en'?'en':'zh-CN';
  if(typeof INDEXURL!=='undefined'){const h=$('#t-home');h.href=INDEXURL;h.hidden=false;h.textContent=LANG==='en'?'← All trips':'← 全部旅行'}$('#t-title').textContent=T(UI.title);if(UI.badge)$('#t-badge').textContent=UI.badge;if(UI.maphead)$('#t-maphead').textContent=T(UI.maphead);$('#t-sub').textContent=T(UI.sub);$('#t-dayline').textContent=T(UI.dayline);$('#t-dayno').textContent=UI.day;$('#daynav').innerHTML=(D.days||[]).map(x=>x.url?`<a href="${x.url}" ${x.url.startsWith("#")?"":"target=\"_top\""} ${x.cur?'aria-current="page"':''}>${x.n}</a>`:`<button ${x.cur?'aria-pressed="true"':'disabled'}>${x.n}</button>`).join('');$('#t-hint').textContent=T(UI.hint);
  $('#legend').innerHTML=`<span><i style="background:var(--m)"></i>${T(UI.legendM)}</span><span><i style="background:var(--a)"></i>${T(UI.legendA)}</span><span><i style="background:var(--n)"></i>${T(UI.legendN)}</span><span><b style="background:#24211e">A</b>${T(UI.sight)}</span><span><b style="background:#d9822b">B</b>${T(UI.food)}</span>`;
  $('#chips').innerHTML=`<button class="chip" data-z="all">${T(UI.all)}</button>`+Object.entries(AR).map(([a,o])=>`<button class="chip ${a}" data-z="${a}">${T(o)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>zoomTo(c.dataset.z));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  $('#stops').innerHTML=PL.map(p=>`<button class="stopbtn" data-go="${p.id}"><b style="background:${p.kind==='food'?'#d9822b':'#24211e'};box-shadow:0 0 0 2px ${AR[p.area].color}">${p.L}</b>${T(p.name)}</button>`).join('');
  document.querySelectorAll('.stopbtn').forEach(b=>b.onclick=()=>jump(b.dataset.go));
  $('#tobook').textContent=T(UI.tobook);$('#t-fab').textContent=T(UI.fab);
  const keep={...vb};buildMap();vb=keep;applyVB();buildBook();
}
$('#tobook').onclick=()=>jump(PL[0].id);
$('#fab').onclick=()=>$('#mapsheet').scrollIntoView({behavior:'smooth'});
if('IntersectionObserver' in window){new IntersectionObserver(es=>{{const f=$('#fab');if(f)f.hidden=es[0].isIntersecting}},{threshold:0}).observe($('#mapsheet'))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('walk-lang',LANG)}catch(e){}renderAll()});
renderAll();
if(location.hash.startsWith('#sp-'))setTimeout(()=>jump(location.hash.slice(4)),300);
if(location.hash==='#zm')zoomTo('a');

/* tap a photo to see it large; tap again anywhere to close */
document.addEventListener('click',e=>{const im=e.target.closest('.book figure img');if(!im)return;const d=document.createElement('div');d.className='lbox fit';d.innerHTML=`<img src="${im.src}" alt=""><p>${LANG==='en'?'Tap anywhere to close':'点一下关闭'}</p>`;d.onclick=()=>d.remove();document.body.appendChild(d)});
</script>

</body></html>
